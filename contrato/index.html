<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Contrato — NEXIO Inteligência Contábil</title>
<link rel="stylesheet" href="/assets/portal.css?v=202611251051">
<style>
body{background:#F3EFEC}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid #2344AC;padding-bottom:10px;margin-bottom:20px}
.top b{color:#2344AC;font-size:26px;letter-spacing:3px}.top small{color:#2344AC;font-size:11px;letter-spacing:3px}
pre{white-space:pre-wrap;font:15px/1.65 Calibri,Arial,sans-serif;background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;max-height:60vh;overflow:auto}
.sign{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:18px;display:grid;gap:12px}
.ok{background:#E8F7EF;border:1px solid #00A36C;border-radius:12px;padding:16px;margin-top:18px}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/assets/logo-nexio.png" alt="NEXIO Inteligência Contábil" style="height:56px"></div>
  <main id="app"><p class="help">Carregando contrato…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
var sb=supabase.createClient('https://pctwjndleohoidikiwcv.supabase.co','sb_publishable_U8jK8tPwRuQ4xQGARUHHWg_UWz8Potv',{auth:{persistSession:false}});
var app=document.getElementById('app'),tk=new URLSearchParams(location.search).get('t')||'';
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function brl(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fd(d){if(!d)return '—';var p=String(d).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
if(!/^[0-9a-f-]{36}$/i.test(tk)){app.innerHTML='<h1>Link inválido</h1><p class="help">Confira o link recebido por e-mail ou fale com contato@nexioic.com.br.</p>';return;}
function carregar(){sb.rpc('contrato_por_token',{p_token:tk}).then(function(r){var c=r.data;
  if(r.error||!c){app.innerHTML='<h1>Contrato indisponível</h1><p class="help">Este link não está ativo. Fale com a NEXIO: contato@nexioic.com.br · (11) 93956-5190.</p>';return;}
  var assinado=c.status==='assinado';
  app.innerHTML='<h1 style="font-size:24px">Contrato de prestação de serviços</h1><p class="help">'+e(c.empresa)+' · '+e(c.plano||'')+' · '+brl(c.valor)+'/mês · vigência '+(c.fim?'de '+fd(c.inicio)+' a '+fd(c.fim):'a partir de '+fd(c.inicio)+', prazo indeterminado')+(c.fidelidade_meses?' · <b>fidelidade de '+c.fidelidade_meses+' meses</b>':'')+'</p>'+
  '<pre>'+e(c.texto)+'</pre>'+
  (assinado?'<div class="ok"><b>Contrato assinado eletronicamente</b><br>por '+e(c.assinado_nome)+' em '+new Date(c.assinado_em).toLocaleString('pt-BR')+'.<br><button class="btn b-blue" id="pdf" style="margin-top:10px">Baixar via assinada (PDF com certificado)</button></div>':
  '<form class="sign" id="f"><h2 style="margin:0;font-size:18px">Assinatura eletrônica</h2>'+
  '<label>Nome completo do responsável<input name="nome" required autocomplete="name"></label>'+
  '<label>CPF do responsável<input name="doc" required inputmode="numeric" placeholder="000.000.000-00"></label>'+
  '<label style="flex-direction:row;align-items:flex-start;gap:8px;font-weight:500"><input type="checkbox" name="ok" required style="width:auto;min-height:auto;margin-top:4px"> Li e concordo com todas as cláusulas deste contrato e declaro ter poderes para assiná-lo em nome da empresa.</label>'+
  '<p class="help">Serão registrados data, hora, endereço IP e um código de integridade do texto aceito.</p>'+
  '<button class="btn b-blue" type="submit">Assinar contrato</button><p class="help" id="m" style="color:var(--bad)"></p></form>');
  var f=document.getElementById('f');if(f)f.onsubmit=function(ev){ev.preventDefault();var d=new FormData(f),cpf=String(d.get('doc')).replace(/\D/g,'');
    if(cpf.length!==11&&cpf.length!==14){document.getElementById('m').textContent='Informe um CPF válido.';return;}
    f.querySelector('button').disabled=true;
    sb.rpc('assinar_contrato',{p_token:tk,p_nome:d.get('nome'),p_doc:cpf,p_ua:navigator.userAgent}).then(function(r){if(r.error){f.querySelector('button').disabled=false;document.getElementById('m').textContent=/dados_invalidos/.test(r.error.message)?'Confira o nome e o CPF.':/texto_divergente/.test(r.error.message)?'O texto deste contrato foi alterado. Peça um novo link à NEXIO.':'Não foi possível assinar agora. Tente novamente.';return;}carregar();window.scrollTo(0,document.body.scrollHeight);});};
  var pb=document.getElementById('pdf');if(pb)pb.onclick=function(){sb.rpc('contrato_eventos_token',{p_token:tk}).then(function(r){pdf(c,r.data||[]);});};
});}
function pdf(c,ev){var dt=function(x){return new Date(x).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});};var w=window.open('','_blank');if(!w){alert('Libere as janelas pop-up para baixar o PDF.');return;}
  w.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Contrato assinado — '+e(c.empresa)+'</title><style>body{font:11pt/1.55 Calibri,Arial,sans-serif;max-width:780px;margin:24px auto;padding:0 20px}header{border-bottom:2px solid #2344AC;padding-bottom:6px;margin-bottom:18px}header b{color:#2344AC;font-size:22pt;letter-spacing:3px}header small{display:block;color:#2344AC;font-size:7pt;letter-spacing:3px}pre{white-space:pre-wrap;font:inherit}h1{font-size:14pt;color:#2344AC}table{border-collapse:collapse;width:100%;font-size:9pt}td,th{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}footer{border-top:1px solid #2344AC;margin-top:24px;padding-top:4px;font-size:8pt;color:#555}</style></head><body><header><img src="'+location.origin+'/assets/logo-nexio.png" alt="NEXIO" style="height:52px"></header><pre>'+e(c.texto)+'</pre>'+
  '<div style="page-break-before:always"></div><h1>Certificado de assinatura eletrônica</h1><table><tr><th>Contrato</th><td>'+e(c.id)+'</td></tr><tr><th>Contratante</th><td>'+e(c.empresa)+'</td></tr><tr><th>Signatário</th><td>'+e(c.assinado_nome)+' — CPF/CNPJ '+e(c.assinado_doc)+(c.assinado_email?' — conta do portal '+e(c.assinado_email):'')+'</td></tr><tr><th>Data e hora</th><td>'+dt(c.assinado_em)+' (horário de Brasília)</td></tr><tr><th>IP</th><td>'+e(c.assinado_ip||'—')+'</td></tr><tr><th>Integridade (SHA-256)</th><td style="word-break:break-all">'+e(c.assinado_hash)+'</td></tr></table>'+
  (ev.length?'<h1 style="font-size:12pt">Trilha de auditoria</h1><table><tr><th>Data e hora</th><th>Evento</th><th>IP</th></tr>'+ev.map(function(x){return '<tr><td>'+dt(x.em)+'</td><td>'+e(x.evento)+'</td><td>'+e(x.ip||'')+'</td></tr>';}).join('')+'</table>':'')+
  '<p style="font-size:9pt;color:#555">Assinatura eletrônica nos termos da MP 2.200-2/2001, art. 10, § 2º, e do art. 784, § 4º, do CPC.</p><footer>Nexio Inteligência Contábil Ltda • Av. Brig. Faria Lima, 1811 - CXPST ESC1119 - Jardim Paulistano, São Paulo - SP, 01452-001 • (11) 93956-5190 • contato@nexioic.com.br</footer><script>setTimeout(function(){print()},400)<\/script></body></html>');w.document.close();}
carregar();
})();
</script>
</body>
</html>
