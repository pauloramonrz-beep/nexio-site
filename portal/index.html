<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do Cliente | NEXIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0740EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
</head>
<body>
<div id="root"></div>
<div class="toast" role="status" id="toast"></div>
<div id="printArea"></div>
<dialog id="pdlg" style="border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 32px)"></dialog>
<style>#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;padding:10mm}}</style>
<script src="/assets/store.js"></script>
<script src="/assets/explorer.js"></script>
<script>
(function(){
var db=NX.load(), e=NX.esc, S={cid:null,month:NX.ym(),filtro:'todos'};
try{S.cid=sessionStorage.getItem('nx_client');}catch(x){}
var root=document.getElementById('root');
function me(){return db.clients.filter(function(c){return c.id===S.cid;})[0];}
function persist(){NX.save(db);}
function myFiles(){return db.files.filter(function(f){return f.cliente===S.cid;}).sort(function(a,b){return a.criado<b.criado?1:-1;});}
function unread(){return db.messages.filter(function(m){return m.cliente===S.cid&&m.de==='equipe'&&!m.lida;}).length;}
function novos(){return myFiles().filter(function(f){return f.de==='equipe'&&!f.visto&&visivel(f);}).length;}
function route(){return location.hash.replace('#/','')||'inicio';}

function login(){NX.ensureUsers(db);persist();
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><h1>Portal do Cliente</h1>'+
  '<label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label>'+
  '<button class="btn b-blue">Entrar</button><p class="help" id="err" role="alert"></p>'+
  '<p class="help"><b>Protótipo:</b> entre como um usuário de exemplo:</p><div class="row">'+(db.cusers||[]).slice(0,7).map(function(u){return '<button type="button" class="btn b-line" data-q="'+u.id+'" style="min-height:34px;font-size:12px">'+e(u.nome)+' · '+NX.NIV_CLI[u.nivel].nome+'</button>';}).join('')+'</div>'+
  '<p class="help">Esqueceu a senha? Fale com a NEXIO pelo <a href="https://wa.me/5511939565190">WhatsApp</a>.</p></form></div>';
  function go(u){S.uid=u.id;try{sessionStorage.setItem('nx_cuser',u.id);sessionStorage.removeItem('nx_client');}catch(x){}S.cid=u.empresas.length===1?u.empresas[0]:null;if(S.cid){try{sessionStorage.setItem('nx_client',S.cid);}catch(x){}}
    NX.log(db,{tipo:'cliente',quem:u.nome,nivel:NX.NIV_CLI[u.nivel].nome,acao:'Entrou no portal',cliente:S.cid||u.empresas[0]});persist();location.hash='#/inicio';render();}
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim().toLowerCase(),pw=document.getElementById('lp').value;
    var u=(db.cusers||[]).filter(function(x){return x.email.toLowerCase()===em&&x.senha===pw;})[0];if(!u){document.getElementById('err').textContent='E-mail ou senha incorretos.';return;}go(u);};
  root.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){go(db.cusers.filter(function(x){return x.id===b.getAttribute('data-q');})[0]);};});
}
function enter(id){S.cid=id;try{sessionStorage.setItem('nx_client',id);}catch(x){}location.hash='#/inicio';render();}

function shell(active,html){
  var c=me(),nav=[['inicio','Início',0],['arquivos','Documentos',novos()],['calendario','Obrigações',0],['notas','Notas fiscais',0],['financeiro','Controle financeiro',0],['mensagens','Mensagens',unread()]];
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/inicio"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><div class="role">Portal do cliente</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  
  '<div class="foot"><span>'+e(c.nome)+'</span><a href="https://wa.me/5511939565190">Falar no WhatsApp</a><a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();logCli('Saiu do portal');persist();S.cid=null;S.uid=null;try{sessionStorage.removeItem('nx_client');sessionStorage.removeItem('nx_cuser');}catch(x){}location.hash='';render();};
}
function head(t,sub){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><span class="badge-proto">Protótipo</span></div>';}
function guiaRow(f){var s=NX.statusOf(f);return '<div class="list-item"><div><b>'+e(f.titulo)+(!f.visto&&f.de==='equipe'?'<span class="dot" aria-label="novo"></span>':'')+'</b><small>'+(f.venc?'Vence em '+NX.fdate(f.venc)+' · ':'')+'Competência '+NX.fcomp(f.comp)+'</small></div><div class="row" style="align-items:center"><strong>'+(f.valor?NX.brl(f.valor):'')+'</strong><span class="tag '+s.c+'">'+s.t+'</span><button class="btn b-line" data-dl="'+f.id+'" style="min-height:38px">Ver</button></div></div>';}

function eventosMes(m){var ev=NX.obligationsFor(db,S.cid,m).map(function(o){return {data:o.data,titulo:o.titulo};});
  myFiles().filter(visivel).forEach(function(f){if(f.venc&&f.venc.slice(0,7)===m){var s=NX.statusOf(f);ev.push({data:f.venc,titulo:(f.tipo==='Guia'?'Guia: ':'Vence: ')+f.titulo,cls:s.c==='ok'?'ok':s.c==='bad'?'bad':''});}});
  var norm=function(s){return s.toLowerCase().replace(/^(guia|vence): /,'').replace(/[^a-z0-9]/g,'');};
  var guias=ev.filter(function(x){return /^(Guia|Vence): /.test(x.titulo);});
  return ev.filter(function(x){if(/^(Guia|Vence): /.test(x.titulo))return true;var k=norm(x.titulo);return !guias.some(function(g){return g.data===x.data&&(norm(g.titulo).indexOf(k)>-1||k.indexOf(norm(g.titulo))>-1);});});}
function inicio(){
  var c=me(),t=NX.today(),fs=myFiles();
  var pagar=fs.filter(function(f){return visivel(f)&&f.tipo==='Guia'&&f.status!=='pago'&&nivel()!=='notas';}).sort(function(a,b){return a.venc<b.venc?-1:1;});
  var total=pagar.reduce(function(s,f){return s+(f.valor||0);},0);
  var prox=NX.obligationsFor(db,S.cid,NX.ym()).concat(NX.obligationsFor(db,S.cid,NX.shiftMonth(NX.ym(),1))).filter(function(o){return o.data>=t;}).slice(0,5);
  shell('inicio',head('Olá, '+e(function(n){var p=n.split(' ');return /^dra?\.$/i.test(p[0])?p.slice(0,2).join(' '):p[0];}(c.resp||c.nome)),'Tudo o que você precisa da sua contabilidade, em um só lugar.')+
  avisosAtivos().map(function(a){return '<section class="card" style="border:2px solid var(--blue);margin-bottom:18px"><div class="row between" style="align-items:flex-start"><div><span class="tag info">Comunicado da NEXIO</span><h2 style="margin:8px 0 6px">'+e(a.titulo)+'</h2><p style="margin:0;white-space:pre-line">'+e(a.texto)+'</p></div><button class="btn b-line" data-lido="'+a.id+'">Marcar como lido</button></div></section>';}).join('')+'<div class="kpis"><a class="kpi main" href="#/arquivos"><span>Guias a pagar</span><strong>'+NX.brl(total)+'</strong></a><a class="kpi" href="#/arquivos"><span>Arquivos novos</span><strong>'+novos()+'</strong></a><a class="kpi" href="#/mensagens"><span>Mensagens novas</span><strong>'+unread()+'</strong></a><div class="kpi"><span>Seu plano</span><strong style="font-size:20px">'+e(c.plano)+'</strong></div></div>'+
  '<section class="card" style="margin-bottom:18px"><div class="row between" style="align-items:center;margin-bottom:6px"><h2 style="margin:0">Calendário de vencimentos e obrigações</h2><div class="cal-nav" style="margin:0"><button class="btn b-line" id="ipm" aria-label="Mês anterior">‹</button><strong>'+NX.monthLabel(S.month)+'</strong><button class="btn b-line" id="inm" aria-label="Próximo mês">›</button></div></div>'+NX.calendarHTML(S.month,eventosMes(S.month))+'<p class="help" style="margin-top:10px"><span class="tag info">Obrigação / a pagar</span> <span class="tag bad">Vencida</span> <span class="tag ok">Paga</span></p></section>'+'<div class="cols"><section class="card"><h2>Guias para pagar</h2>'+(pagar.length?pagar.map(guiaRow).join(''):'<p class="empty">Nenhuma guia pendente. Tudo em dia!</p>')+'</section>'+
  '<section class="card"><h2>Próximas obrigações</h2>'+(prox.length?prox.map(function(o){return '<div class="list-item"><div><b>'+e(o.titulo)+'</b><small>'+e(o.desc||'')+'</small></div><span class="tag info">'+NX.fdate(o.data)+'</span></div>';}).join(''):'<p class="empty">Nenhuma obrigação nos próximos dias.</p>')+'<a class="btn b-text" href="#/calendario" style="margin-top:8px">Ver calendário completo</a></section></div>');
  bindDl();
  document.getElementById('ipm').onclick=function(){S.month=NX.shiftMonth(S.month,-1);inicio();};document.getElementById('inm').onclick=function(){S.month=NX.shiftMonth(S.month,1);inicio();};
  root.querySelectorAll('[data-lido]').forEach(function(b){b.onclick=function(){var a=db.avisos.filter(function(x){return x.id===b.getAttribute('data-lido');})[0];a.lidos=a.lidos||{};a.lidos[S.cid]=new Date().toISOString();persist();inicio();};});
}
var RESTRITOS=['Administrativo (interno)'];
function setorOf(f){if(f.setor)return f.setor;if(f.tipo==='Nota fiscal')return 'Notas fiscais';if(f.de==='cliente')return 'Enviados pelo cliente';
  if(f.tipo==='Folha de pagamento'||/fgts|inss|folha|e-?social|dctfweb|f[ée]rias|rescis|pr[óo]-?labore/i.test(f.titulo))return 'Departamento Pessoal';
  if(/cnd|certid/i.test(f.titulo))return 'Certidões';if(f.tipo==='Contrato')return 'Societário';if(f.tipo==='Relatório')return 'Contábil';if(f.tipo==='Guia')return 'Fiscal';return 'Contábil';}
function compOf(f){return f.comp||(f.criado||NX.today()).slice(0,7);}
function visivel(f){return !f.deleted&&(f.de==='cliente'||(f.shared!=null?f.shared:RESTRITOS.indexOf(setorOf(f))<0));}
function hist(f,ev){f.hist=f.hist||[];f.hist.push({em:new Date().toISOString(),ev:ev+(/visualiz|baixad/i.test(ev)?' pelo cliente':''),por:meU().nome});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var FICO='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function folderLevel(files,F,setores){ // devolve {items:[{key,label,n,extra}], level} ou null quando já está no mês
  function pend(l){var p=l.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';}).length;return p?p+' a pagar':'';}
  if(!F.setor)return setores.map(function(s){var l=files.filter(function(f){return setorOf(f)===s;});return {key:s,label:s,n:l.length,extra:pend(l)};});
  var ls=files.filter(function(f){return setorOf(f)===F.setor;});
  if(!F.ano){var an={};ls.forEach(function(f){an[compOf(f).slice(0,4)]=1;});return Object.keys(an).sort().reverse().map(function(a){var l=ls.filter(function(f){return compOf(f).slice(0,4)===a;});return {key:a,label:a,n:l.length,extra:pend(l)};});}
  if(!F.comp){var out=[];for(var i=12;i>=1;i--){var k=F.ano+'-'+String(i).padStart(2,'0'),l=ls.filter(function(f){return compOf(f)===k;});if(l.length)out.push({key:k,label:MESES[i-1],n:l.length,extra:pend(l)});}return out;}
  return null;}
function folderCards(items){return items.length?'<div class="folders">'+items.map(function(it){return '<button class="fold" data-go="'+e(it.key)+'"><span class="fi">'+FICO+'</span><span><b>'+e(it.label)+'</b><small>'+it.n+' documento(s)'+(it.extra?' · '+it.extra:'')+'</small></span></button>';}).join('')+'</div>':'<p class="empty">Pasta vazia.</p>';}
function crumbsHTML(root,F){var c=[['root',root]];if(F.setor)c.push(['setor',F.setor]);if(F.ano)c.push(['ano',F.ano]);if(F.comp)c.push(['comp',MESES[+F.comp.slice(5)-1]]);
  return '<nav class="crumbs" aria-label="Caminho">'+c.map(function(k,i){return i===c.length-1?'<b>'+e(k[1])+'</b>':'<button data-cr="'+k[0]+'">'+e(k[1])+'</button><span aria-hidden="true">›</span>';}).join('')+'</nav>';}
function folderClick(t,F){if(t.hasAttribute('data-go')){var v=t.getAttribute('data-go');if(!F.setor)F.setor=v;else if(!F.ano)F.ano=v;else F.comp=v;return true;}
  if(t.hasAttribute('data-cr')){var lv=t.getAttribute('data-cr');if(lv==='root')F.setor=F.ano=F.comp=null;else if(lv==='setor')F.ano=F.comp=null;else if(lv==='ano')F.comp=null;return true;}return false;}
S.pf=S.pf||{setor:null,ano:null,comp:null,fid:null,vis:'todos',q:''};
try{S.pf.view=localStorage.getItem('nx_docview')||'pastas';}catch(x){S.pf.view='pastas';}
function locKey(L){return [L.setor||'',L.ano||'',L.comp||'',L.fid||''].join('|');}
function myFolders(){db.folders=db.folders||[];return db.folders.filter(function(x){return x.cliente===S.cid;});}
function folderById(id){return (db.folders||[]).filter(function(x){return x.id===id;})[0];}
function folderChain(fid){var out=[],f=folderById(fid);while(f){out.unshift(f);f=folderById(f.parent.fid);}return out;}
function pathOf(f){var p=[setorOf(f)==='__custom'?'':setorOf(f),compOf(f).slice(0,4),MESES[+compOf(f).slice(5)-1]];if(f.folder)folderChain(f.folder).forEach(function(x){p.push(x.nome);});return p.filter(Boolean).join(' › ');}
function inside(f,L){ // arquivo está dentro da localização L (recursivo)?
  if(L.fid){var ch=f.folder?folderChain(f.folder).map(function(x){return x.id;}):[];return ch.indexOf(L.fid)>-1;}
  if(setorOf(f)==='__custom')return !L.setor&&!!f.folder;
  return (!L.setor||setorOf(f)===L.setor)&&(!L.ano||compOf(f).slice(0,4)===L.ano)&&(!L.comp||compOf(f)===L.comp);}
S.xp=S.xp||{};
function arquivos(){
  shell('arquivos',head('Documentos','Suas guias, relatórios e documentos. Clique em um documento para visualizar.')+'<div id="xpRoot"></div>');
  var who=meU().nome;
  function send(files,L,re){var n=0,tot=files.length;files.forEach(function(file){NX.readFile(file,function(r){var pl=NX.placeFor(db,L,'Enviados pelo cliente');
    var f={id:NX.uid(),cliente:S.cid,setor:pl.setor,folder:pl.folder,tipo:'Documento',titulo:r.nome.replace(/\.[^.]+$/,''),comp:pl.comp,venc:'',valor:0,status:'recebido',de:'cliente',por:who,nome:r.nome,data:r.data,size:r.size,criado:NX.today(),visto:false};
    hist(f,'Enviado pelo cliente');db.files.push(f);logCli('Enviou documento',f.titulo);
    if(++n===tot&&persist()!==false){if(!L.fid&&!L.comp){S.xp.L={setor:'Enviados pelo cliente',ano:NX.ym().slice(0,4),comp:NX.ym()};}re();NX.toast(tot+' documento(s) enviado(s) para a NEXIO.');}});});}
  NX.explorer(document.getElementById('xpRoot'),{db:db,cliente:S.cid,role:'cliente',st:S.xp,rootLabel:'Meus documentos',
    setores:['Fiscal','Departamento Pessoal','Contábil','Financeiro','Societário','Certidões','Notas fiscais','Enviados pelo cliente'].filter(function(s){var v=setoresNivel();return !v||v.indexOf(s)>-1;}),readonly:nivel()==='consulta',
    setorOf:setorOf,visible:visivel,
    onOpen:function(f){openDoc(f);},
    onNewFolder:function(L,re){if(NX.newFolder(db,S.cid,L,who)){persist();re();NX.toast('Pasta criada.');}},
    onUpload:function(L,re){var inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.onchange=function(){if(inp.files.length)send([].slice.call(inp.files),L,re);};inp.click();},
    onDropFiles:send});
}
function openDoc(f){var who=meU().nome;
  if(f.de==='equipe'&&!f.visto)f.visto=true;hist(f,'Visualizado');logCli('Visualizou documento',f.titulo);persist();
  var acts=[{label:'Baixar',cls:'b-blue',close:false,fn:function(x){hist(x,'Baixado');logCli('Baixou documento',x.titulo);persist();NX.download(x);}}];
  if(f.tipo==='Guia'&&f.status!=='pago'&&(nivel()==='titular'||nivel()==='financeiro'))acts.push({label:'Já paguei',fn:function(x){x.status='pago';hist(x,'Pagamento informado');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:who,texto:'Informei o pagamento da guia: '+x.titulo+'.',em:new Date().toISOString(),lida:false});logCli('Informou pagamento',x.titulo);persist();NX.toast('Pagamento informado. Obrigado!');}});
  NX.viewer(f,{db:db,me:'cliente',path:NX.xpPath?NX.xpPath(f):pathOf(f),actions:acts,onClose:function(){var r=route();if(r==='arquivos')arquivos();else if(r==='inicio')inicio();},
    onComment:nivel()==='consulta'?null:function(x,t){logCli('Comentou documento',x.titulo);x.coments=x.coments||[];x.coments.push({em:new Date().toISOString(),de:'cliente',autor:who,texto:t});hist(x,'Comentário');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:who,texto:'Comentou no documento "'+x.titulo+'": '+t,em:new Date().toISOString(),lida:false});persist();}});}
function pComment(f){var d=document.getElementById('pdlg');
  d.innerHTML='<form method="dialog" style="padding:24px;display:flex;flex-direction:column;gap:14px"><h2 style="color:var(--blue2);font-size:20px">Comentários</h2><p class="help">'+e(f.titulo)+'</p><div class="chat" style="max-height:260px">'+((f.coments||[]).length?f.coments.map(function(m){return '<div class="msg '+(m.de==='cliente'?'me':'them')+'">'+e(m.texto)+'<small>'+(m.de==='equipe'?e(m.autor)+' · NEXIO':'Você')+' · '+NX.ftime(m.em)+'</small></div>';}).join(''):'<p class="empty">Nenhum comentário ainda.</p>')+'</div><label>Escreva para a equipe<input name="t" placeholder="Ex.: Esse valor está correto?"></label><div class="row between"><button type="button" class="btn b-line" id="pdc">Fechar</button><button class="btn b-blue" type="submit">Enviar</button></div></form>';
  d.querySelector('#pdc').onclick=function(){d.close();};
  d.querySelector('form').onsubmit=function(ev){ev.preventDefault();var t=String(new FormData(ev.target).get('t')||'').trim();if(t){f.coments=f.coments||[];f.coments.push({em:new Date().toISOString(),de:'cliente',autor:meU().nome,texto:t});hist(f,'Comentário do cliente');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:meU().nome,texto:'Comentou no documento "'+f.titulo+'": '+t,em:new Date().toISOString(),lida:false});persist();}d.close();arquivos();};
  d.showModal();}
function avisosAtivos(){var t=NX.today();return (db.avisos||[]).filter(function(a){return (a.clientes[0]==='*'||a.clientes.indexOf(S.cid)>-1)&&(!a.expira||a.expira>=t)&&!(a.lidos&&a.lidos[S.cid]);});}
function bindDl(){root.querySelectorAll('[data-dl]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-dl');var f=db.files.filter(function(x){return x.id===id;})[0];openDoc(f);return;if(f.de==='equipe'&&!f.visto){f.visto=true;persist();}NX.download(f);var r=route();if(r==='arquivos')arquivos();else if(r==='inicio')inicio();};});}
function calendario(){
  var ev=eventosMes(S.month);
  var lista=ev.slice().sort(function(a,b){return a.data<b.data?-1:1;});
  shell('calendario',head('Calendário de obrigações','Prazos de impostos, guias e envio de documentos.')+
  '<section class="card"><div class="cal-nav"><button class="btn b-line" id="pm" aria-label="Mês anterior">‹</button><strong>'+NX.monthLabel(S.month)+'</strong><button class="btn b-line" id="nm" aria-label="Próximo mês">›</button></div>'+NX.calendarHTML(S.month,ev)+'</section>'+
  '<section class="card"><h2>No mês</h2>'+(lista.length?lista.map(function(o){return '<div class="list-item"><b>'+e(o.titulo)+'</b><span class="tag '+(o.cls==='bad'?'bad':o.cls==='ok'?'ok':'info')+'">'+NX.fdate(o.data)+'</span></div>';}).join(''):'<p class="empty">Nada neste mês.</p>')+'</section>');
  document.getElementById('pm').onclick=function(){S.month=NX.shiftMonth(S.month,-1);calendario();};

/* sino de notificações */
function myNotifs(){return (db.notifs||[]).filter(function(n){return n.cliente===S.cid;}).sort(function(a,b){return a.em<b.em?1:-1;});}
function bellHTML(){var n=myNotifs().filter(function(x){return !x.lida;}).length;return '<button class="btn b-line" id="bell" aria-label="Notificações'+(n?' ('+n+' novas)':'')+'" style="position:relative;min-height:40px;padding:0 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>'+(n?'<span style="position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font:700 11px Inter;padding:1px 6px">'+n+'</span>':'')+'</button>';}
function bindBell(){var b=document.getElementById('bell');if(!b)return;b.onclick=function(ev){ev.stopPropagation();var old=document.getElementById('bellp');if(old){old.remove();return;}var l=myNotifs().slice(0,15),p=document.createElement('div');p.id='bellp';
  p.style.cssText='position:absolute;right:0;top:46px;z-index:60;width:min(380px,90vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(14,26,69,.2);padding:10px;max-height:70vh;overflow:auto';
  p.innerHTML='<div class="row between" style="padding:4px 6px 8px"><b>Notificações</b>'+(l.some(function(x){return !x.lida;})?'<button class="btn b-text" id="lerTudo" style="min-height:30px">Marcar todas como lidas</button>':'')+'</div>'+(l.length?l.map(function(n){return '<a href="'+(n.link||'#/inicio')+'" style="display:block;text-decoration:none;color:var(--ink);padding:10px;border-radius:10px;'+(n.lida?'':'background:var(--infob)')+'"><b style="font-size:14px">'+e(n.titulo)+'</b><small style="display:block;color:var(--muted)">'+e(n.texto)+'</small><small style="display:block;color:var(--muted);font-size:11px;margin-top:2px">'+NX.ftime(n.em)+'</small></a>';}).join(''):'<p class="empty">Nenhuma notificação.</p>');
  b.parentNode.style.position='relative';b.parentNode.appendChild(p);
  var lt=document.getElementById('lerTudo');if(lt)lt.onclick=function(e2){e2.stopPropagation();myNotifs().forEach(function(x){x.lida=true;});persist();render();};
  p.querySelectorAll('a').forEach(function(a){a.onclick=function(){myNotifs().forEach(function(x){if(!x.lida&&a.getAttribute('href')===(x.link||'#/inicio'))x.lida=true;});persist();};});
  setTimeout(function(){document.addEventListener('click',function h(e2){if(!p.contains(e2.target)){p.remove();document.removeEventListener('click',h);}});},0);};}
/* ---------- NÍVEIS DO CLIENTE + MULTIEMPRESAS + REGISTRO DE ACESSOS ---------- */
try{S.uid=sessionStorage.getItem('nx_cuser');}catch(x){}
function meU(){return (db.cusers||[]).filter(function(u){return u.id===S.uid;})[0];}
function nivel(){var u=meU();return u?u.nivel:'titular';}
var ROTAS={titular:['inicio','arquivos','calendario','notas','financeiro','mensagens','usuarios','config'],financeiro:['inicio','arquivos','calendario','notas','financeiro','mensagens','config'],rh:['inicio','arquivos','calendario','mensagens'],notas:['inicio','notas','mensagens'],consulta:['inicio','arquivos','calendario']};
function pode(r){return (ROTAS[nivel()]||[]).indexOf(r)>-1;}
function setoresNivel(){var n=nivel();if(n==='rh')return ['Departamento Pessoal','Enviados pelo cliente'];if(n==='notas')return ['Notas fiscais'];if(n==='financeiro')return ['Fiscal','Contábil','Financeiro','Societário','Certidões','Notas fiscais','Enviados pelo cliente'];return null;}
function logCli(acao,alvo){var u=meU();NX.log(db,{tipo:'cliente',quem:u?u.nome:'—',nivel:u?NX.NIV_CLI[u.nivel].nome:'',acao:acao,alvo:alvo||'',cliente:S.cid});}
var _visivel=visivel;visivel=function(f){if(!_visivel(f))return false;var s=setoresNivel();return !s||s.indexOf(setorOf(f))>-1;};
/* menu conforme nível + seletor de empresa */
var _shellP=shell;shell=function(active,html){_shellP(active,html);var u=meU();
  root.querySelectorAll('.side a.nav').forEach(function(a){var r=(a.getAttribute('href')||'').replace('#/','').replace('/financeiro/','financeiro');if(r&&!pode(r))a.remove();});
  var last=[].slice.call(root.querySelectorAll('.side a.nav')).pop();
  [['usuarios','Usuários'],['config','Configurações']].forEach(function(x){if(!pode(x[0])||!last)return;var a=document.createElement('a');a.className='nav';a.href='#/'+x[0];a.textContent=x[1];if(active===x[0])a.setAttribute('aria-current','page');last.parentNode.insertBefore(a,last.nextSibling);last=a;});
  var ph=root.querySelector('.page-h');if(ph){var w=document.createElement('div');w.innerHTML=bellHTML();ph.appendChild(w);bindBell();}
  if(u&&u.empresas.length>1){var role=root.querySelector('.side .role');var w=document.createElement('label');w.style.cssText='color:#fff;margin:0 8px 12px;font-size:12px;gap:4px';w.innerHTML='Empresa<select id="emp" style="min-height:38px;font-size:13px;padding:6px 8px;color:var(--ink)">'+u.empresas.map(function(id){var c=db.clients.filter(function(x){return x.id===id;})[0];return c?'<option value="'+id+'"'+(id===S.cid?' selected':'')+'>'+e(c.nome)+'</option>':'';}).join('')+'</select>';role.parentNode.insertBefore(w,role.nextSibling);
    w.querySelector('select').onchange=function(ev){S.cid=ev.target.value;try{sessionStorage.setItem('nx_client',S.cid);}catch(x){}S.xp={};logCli('Trocou de empresa');persist();location.hash='#/inicio';render();};}
  var ft=root.querySelector('.side .foot span');if(ft&&u)ft.textContent=u.nome+' · '+NX.NIV_CLI[u.nivel].nome;
  NX.applySide();};
/* usuários da empresa (titular) */
function usuariosEmp(){var c=me(),l=(db.cusers||[]).filter(function(u){return u.empresas.indexOf(S.cid)>-1;});
  shell('usuarios',head('Usuários da empresa','Quem da '+e(c.nome)+' acessa o portal e o que cada um pode fazer.')+'<section class="card"><div class="row between" style="margin-bottom:12px"><h2 style="margin:0">Usuários</h2><button class="btn b-blue" id="nu">+ Convidar usuários</button></div>'+
  l.map(function(u){return '<div class="list-item"><div><b>'+e(u.nome)+(u.id===S.uid?' (você)':'')+'</b><small>'+e(u.email)+' · '+NX.NIV_CLI[u.nivel].nome+' — '+NX.NIV_CLI[u.nivel].desc+(u.empresas.length>1?' · acessa '+u.empresas.length+' empresas':'')+'</small></div>'+(u.id===S.uid?'':'<div class="row"><select data-nv="'+u.id+'" aria-label="Nível de '+e(u.nome)+'" style="width:auto;min-height:36px">'+Object.keys(NX.NIV_CLI).map(function(k){return '<option value="'+k+'"'+(u.nivel===k?' selected':'')+'>'+NX.NIV_CLI[k].nome+'</option>';}).join('')+'</select><button class="btn b-text" data-rmu="'+u.id+'" style="color:var(--bad)">Remover acesso</button></div>')+'</div>';}).join('')+'</section>'+
  '<section class="card"><h2>Níveis de acesso</h2>'+Object.keys(NX.NIV_CLI).map(function(k){return '<div class="list-item"><div><b>'+NX.NIV_CLI[k].nome+'</b><small>'+NX.NIV_CLI[k].desc+'</small></div></div>';}).join('')+'</section>');
  root.querySelectorAll('[data-nv]').forEach(function(s){s.onchange=function(){var u=db.cusers.filter(function(x){return x.id===s.getAttribute('data-nv');})[0];u.nivel=s.value;logCli('Alterou nível de usuário',u.nome+' → '+NX.NIV_CLI[u.nivel].nome);persist();NX.toast('Nível atualizado.');};});
  root.querySelectorAll('[data-rmu]').forEach(function(b){b.onclick=function(){var u=db.cusers.filter(function(x){return x.id===b.getAttribute('data-rmu');})[0];if(!confirm('Remover o acesso de '+u.nome+' a esta empresa?'))return;u.empresas=u.empresas.filter(function(id){return id!==S.cid;});if(!u.empresas.length)db.cusers=db.cusers.filter(function(x){return x.id!==u.id;});logCli('Removeu acesso de usuário',u.nome);persist();usuariosEmp();};});
  document.getElementById('nu').onclick=function(){var d=document.getElementById('pdlg'),F=NX.multiUserForm();d.style.maxWidth='860px';
    d.innerHTML='<form style="padding:24px;display:flex;flex-direction:column;gap:14px"><h2 style="color:var(--blue2);font-size:20px">Convidar usuários</h2><p class="help">Cadastre várias pessoas de uma vez e escolha o nível de cada uma.</p>'+F.html+'<div class="row between"><button type="button" class="btn b-line" id="pdc">Cancelar</button><button class="btn b-blue">Salvar</button></div></form>';
    F.bind(d);d.querySelector('#pdc').onclick=function(){d.close();};
    d.querySelector('form').onsubmit=function(ev){ev.preventDefault();var r=F.read(new FormData(ev.target));if(r.erro){NX.toast(r.erro);return;}var s=F.save(db,r.lista,S.cid);
      logCli('Convidou usuários',r.lista.map(function(x){return x.nome+' ('+NX.NIV_CLI[x.nivel].nome+')';}).join(', '));persist();d.close();d.style.maxWidth='';usuariosEmp();NX.toast(s.novos+' usuário(s) criado(s)'+(s.vinc?' e '+s.vinc+' vinculado(s)':'')+'.');};d.showModal();};}
/* escolha de empresa (multiempresas) */
function escolherEmpresa(u){root.innerHTML='<div class="login"><div class="box"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><h1>Olá, '+e(u.nome.split(' ')[0])+'!</h1><p class="help">Você tem acesso a '+u.empresas.length+' empresas. Escolha qual deseja acessar:</p>'+
  u.empresas.map(function(id){var c=db.clients.filter(function(x){return x.id===id;})[0];return c?'<button class="btn b-line" data-ce="'+id+'" style="justify-content:flex-start;text-align:left;min-height:56px"><span><b>'+e(c.nome)+'</b><small style="display:block;color:var(--muted);font-weight:400">'+e(c.doc)+' · '+e(c.plano)+'</small></span></button>':'';}).join('')+'</div></div>';
  root.querySelectorAll('[data-ce]').forEach(function(b){b.onclick=function(){S.cid=b.getAttribute('data-ce');try{sessionStorage.setItem('nx_client',S.cid);}catch(x){}logCli('Entrou no portal (escolheu empresa)');persist();location.hash='#/inicio';render();};});}
function render(){db=NX.load();if(NX.ensureUsers(db))persist();if(NX.runReminders(db))persist();var u=meU();if(!u){login();return;}if(!S.cid||u.empresas.indexOf(S.cid)<0||!me()){if(u.empresas.length===1){S.cid=u.empresas[0];}else{escolherEmpresa(u);return;}}var r=route();if(!pode(r)){location.hash='#/'+(ROTAS[nivel()][0]);return;}if(r==='usuarios'){usuariosEmp();return;}if(r==='config'){config();return;}
  if(r==='arquivos')arquivos();else if(r==='calendario')calendario();else if(r==='mensagens')mensagens();else if(r==='financeiro')financeiro();else if(r==='notas')notas();else inicio();}
window.addEventListener('hashchange',render);
window.NX_onSync=function(){if(route()==='financeiro'||route()==='notas')return;if(document.activeElement.tagName!=='INPUT')render();};
render();
})();
</script>
