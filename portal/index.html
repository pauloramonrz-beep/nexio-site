<script>
(function(){
NX.realMode=true;NX.useKey('nexio_cli_vazio');var db=NX.load(), e=NX.esc, S={cid:null,month:NX.ym(),filtro:'todos'};
try{S.cid=sessionStorage.getItem('nx_client');}catch(x){}
var root=document.getElementById('root');
function me(){return db.clients.filter(function(c){return c.id===S.cid;})[0];}
function persist(){NX.save(db);}
function myFiles(){return db.files.filter(function(f){return f.cliente===S.cid;}).sort(function(a,b){return a.criado<b.criado?1:-1;});}
function unread(){return db.messages.filter(function(m){return m.cliente===S.cid&&m.de==='equipe'&&!m.lida;}).length;}
function novos(){return myFiles().filter(function(f){return f.de==='equipe'&&!f.visto&&visivel(f);}).length;}
function route(){return location.hash.replace('#/','')||'inicio';}

function login(){NX.ensureUsers(db);persist();
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><img src="/assets/logo-nexio.png" alt="NEXIO Inteligência Contábil" style="height:58px;display:block"></a><h1>Portal do Cliente</h1>'+
  '<label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label>'+
  '<button class="btn b-blue">Entrar</button><p class="help" id="err" role="alert"></p>'+
  '<p class="help"><b>Protótipo:</b> entre como um usuário de exemplo:</p><div class="row">'+(db.cusers||[]).slice(0,7).map(function(u){return '<button type="button" class="btn b-line" data-q="'+u.id+'" style="min-height:34px;font-size:12px">'+e(u.nome)+' · '+NX.NIV_CLI[u.nivel].nome+'</button>';}).join('')+'</div>'+
  '<p class="help">Esqueceu a senha? Fale com a NEXIO pelo <a href="https://wa.me/5511930790457">WhatsApp</a>.</p><p class="help" style="color:var(--warn)"><b>Ambiente de demonstração:</b> não insira dados reais de clientes, funcionários ou pacientes.</p><p class="help" style="font-size:12px"><a href="/privacidade/">Política de Privacidade</a> · <a href="/termos/">Termos de Uso</a></p></form></div>';
  function go(u){S.uid=u.id;try{sessionStorage.setItem('nx_cuser',u.id);sessionStorage.removeItem('nx_client');}catch(x){}S.cid=u.empresas.length===1?u.empresas[0]:null;if(S.cid){try{sessionStorage.setItem('nx_client',S.cid);}catch(x){}}
    NX.log(db,{tipo:'cliente',quem:u.nome,nivel:NX.NIV_CLI[u.nivel].nome,acao:'Entrou no portal',cliente:S.cid||u.empresas[0]});persist();location.hash='#/inicio';render();}
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim().toLowerCase(),pw=document.getElementById('lp').value;
    var u=(db.cusers||[]).filter(function(x){return x.email.toLowerCase()===em&&x.senha===pw;})[0];if(!u){document.getElementById('err').textContent='E-mail ou senha incorretos.';return;}go(u);};
  root.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){go(db.cusers.filter(function(x){return x.id===b.getAttribute('data-q');})[0]);};});
}
function enter(id){S.cid=id;try{sessionStorage.setItem('nx_client',id);}catch(x){}location.hash='#/inicio';render();}

function shell(active,html){
  var c=me(),nav=[['inicio','Início',0],['arquivos','Documentos',novos()],['calendario','Obrigações',0],['notas','Notas fiscais',0],['financeiro','Controle financeiro',0],['contrato','Contrato e faturas',0],['mensagens','Mensagens',unread()],['conteudos','Conteúdos',0]];
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/inicio"><img src="/assets/logo-nexio-branco.png" alt="NEXIO Inteligência Contábil" style="width:150px;max-width:100%;display:block"></a><div class="role">Portal do cliente</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  
  '<div class="foot"><span>'+e(c.nome)+'</span><a href="https://wa.me/5511930790457">Falar no WhatsApp</a><a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();
  if(REAL&&REAL.equipe){var mn=root.querySelector('.main');if(mn){var bn=document.createElement('div');bn.style.cssText='background:#FFF4D6;color:#7A4B00;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap';bn.innerHTML='<b>Modo visualização da equipe</b> — você está vendo o portal como o cliente vê. Nada do que fizer aqui é salvo.<a href="/admin/" style="margin-left:auto">Voltar ao painel</a><a href="#" id="trc">Trocar empresa</a>';mn.insertBefore(bn,mn.firstChild);document.getElementById('trc').onclick=function(ev){ev.preventDefault();try{sessionStorage.removeItem('nx_emp');}catch(x){}location.reload();};}}
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();sairReal();};
}
function head(t,sub){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div></div>';}
function guiaRow(f){var s=NX.statusOf(f);return '<div class="list-item"><div><b>'+e(f.titulo)+(!f.visto&&f.de==='equipe'?'<span class="dot" aria-label="novo"></span>':'')+'</b><small>'+(f.venc?'Vence em '+NX.fdate(f.venc)+' · ':'')+'Competência '+NX.fcomp(f.comp)+'</small></div><div class="row" style="align-items:center"><strong>'+(f.valor?NX.brl(f.valor):'')+'</strong><span class="tag '+s.c+'">'+s.t+'</span><button class="btn b-line" data-dl="'+f.id+'" style="min-height:38px">Ver</button></div></div>';}

function eventosMes(m){var ev=NX.obligationsFor(db,S.cid,m).map(function(o){return {data:o.data,titulo:o.titulo};});
  myFiles().filter(visivel).forEach(function(f){if(f.venc&&f.cal!==false&&f.venc.slice(0,7)===m){var s=NX.statusOf(f);ev.push({data:f.venc,titulo:(f.tipo==='Guia'?'Guia: ':'Vence: ')+f.titulo,cls:s.c==='ok'?'ok':s.c==='bad'?'bad':''});}});
  var norm=function(s){return s.toLowerCase().replace(/^(guia|vence): /,'').replace(/[^a-z0-9]/g,'');};
  var guias=ev.filter(function(x){return /^(Guia|Vence): /.test(x.titulo);});
  return ev.filter(function(x){if(/^(Guia|Vence): /.test(x.titulo))return true;var k=norm(x.titulo);return !guias.some(function(g){return g.data===x.data&&(norm(g.titulo).indexOf(k)>-1||k.indexOf(norm(g.titulo))>-1);});});}
function inicio(){
  var c=me(),t=NX.today(),fs=myFiles();
  var pagar=fs.filter(function(f){return visivel(f)&&f.tipo==='Guia'&&f.status!=='pago'&&nivel()!=='notas';}).sort(function(a,b){return a.venc<b.venc?-1:1;});
  var total=pagar.reduce(function(s,f){return s+(f.valor||0);},0);
  var prox=NX.obligationsFor(db,S.cid,NX.ym()).concat(NX.obligationsFor(db,S.cid,NX.shiftMonth(NX.ym(),1))).filter(function(o){return o.data>=t;}).slice(0,5);
  shell('inicio',head('Olá, '+e(function(n){var p=n.split(' ');return /^dra?\.$/i.test(p[0])?p.slice(0,2).join(' '):p[0];}(c.resp||c.nome)),'Tudo o que você precisa da sua contabilidade, em um só lugar.')+
  avisosAtivos().map(function(a){return '<section class="card" style="border:2px solid var(--blue);margin-bottom:18px"><div class="row between" style="align-items:flex-start"><div><span class="tag info">Comunicado da NEXIO</span><h2 style="margin:8px 0 6px">'+e(a.titulo)+'</h2><p style="margin:0;white-space:pre-line">'+e(a.texto)+'</p></div><button class="btn b-line" data-lido="'+a.id+'">Marcar como lido</button></div></section>';}).join('')+'<div class="kpis"><a class="kpi main" href="#/arquivos"><span>Guias a pagar</span><strong>'+NX.brl(total)+'</strong></a><a class="kpi" href="#/arquivos"><span>Arquivos novos</span><strong>'+novos()+'</strong></a><a class="kpi" href="#/mensagens"><span>Mensagens novas</span><strong>'+unread()+'</strong></a><div class="kpi"><span>Seu plano</span><strong style="font-size:20px">'+e(c.plano)+'</strong></div></div>'+
  '<section class="card" style="margin-bottom:18px"><div class="row between" style="align-items:center;margin-bottom:6px"><h2 style="margin:0">Calendário de vencimentos e obrigações</h2><div class="cal-nav" style="margin:0"><button class="btn b-line" id="ipm" aria-label="Mês anterior">‹</button><strong>'+NX.monthLabel(S.month)+'</strong><button class="btn b-line" id="inm" aria-label="Próximo mês">›</button></div></div>'+NX.calendarHTML(S.month,eventosMes(S.month))+'<p class="help" style="margin-top:10px"><span class="tag info">Obrigação / a pagar</span> <span class="tag bad">Vencida</span> <span class="tag ok">Paga</span></p></section>'+'<div class="cols"><section class="card"><h2>Guias para pagar</h2>'+(pagar.length?pagar.map(guiaRow).join(''):'<p class="empty">Nenhuma guia pendente. Tudo em dia!</p>')+'</section>'+
  '<section class="card"><h2>Próximas obrigações</h2>'+(prox.length?prox.map(function(o){return '<div class="list-item"><div><b>'+e(o.titulo)+'</b><small>'+e(o.desc||'')+'</small></div><span class="tag info">'+NX.fdate(o.data)+'</span></div>';}).join(''):'<p class="empty">Nenhuma obrigação nos próximos dias.</p>')+'<a class="btn b-text" href="#/calendario" style="margin-top:8px">Ver calendário completo</a></section></div>');
  bindDl();
  document.getElementById('ipm').onclick=function(){S.month=NX.shiftMonth(S.month,-1);inicio();};document.getElementById('inm').onclick=function(){S.month=NX.shiftMonth(S.month,1);inicio();};
  root.querySelectorAll('[data-lido]').forEach(function(b){b.onclick=function(){var a=db.avisos.filter(function(x){return x.id===b.getAttribute('data-lido');})[0];a.lidos=a.lidos||{};a.lidos[S.cid]=new Date().toISOString();persist();inicio();};});
}
var RESTRITOS=['Administrativo (interno)'];
function setorOf(f){if(f.setor)return f.setor;if(f.tipo==='Nota fiscal')return 'Notas fiscais';if(f.de==='cliente')return 'Enviados pelo cliente';
  if(f.tipo==='Folha de pagamento'||/fgts|inss|folha|e-?social|dctfweb|f[ée]rias|rescis|pr[óo]-?labore/i.test(f.titulo))return 'Departamento Pessoal';
  if(/cnd|certid/i.test(f.titulo))return 'Certidões';if(f.tipo==='Contrato')return 'Societário';if(f.tipo==='Relatório')return 'Contábil';if(f.tipo==='Guia')return 'Fiscal';return 'Contábil';}
function compOf(f){return f.comp||(f.criado||NX.today()).slice(0,7);}
function visivel(f){return !f.deleted&&(f.de==='cliente'||(f.shared!=null?f.shared:RESTRITOS.indexOf(setorOf(f))<0));}
function hist(f,ev){f.hist=f.hist||[];f.hist.push({em:new Date().toISOString(),ev:ev+(/visualiz|baixad/i.test(ev)?' pelo cliente':''),por:meU().nome});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var FICO='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function folderLevel(files,F,setores){ // devolve {items:[{key,label,n,extra}], level} ou null quando já está no mês
  function pend(l){var p=l.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';}).length;return p?p+' a pagar':'';}
  if(!F.setor)return setores.map(function(s){var l=files.filter(function(f){return setorOf(f)===s;});return {key:s,label:s,n:l.length,extra:pend(l)};});
  var ls=files.filter(function(f){return setorOf(f)===F.setor;});
  if(!F.ano){var an={};ls.forEach(function(f){an[compOf(f).slice(0,4)]=1;});return Object.keys(an).sort().reverse().map(function(a){var l=ls.filter(function(f){return compOf(f).slice(0,4)===a;});return {key:a,label:a,n:l.length,extra:pend(l)};});}
  if(!F.comp){var out=[];for(var i=12;i>=1;i--){var k=F.ano+'-'+String(i).padStart(2,'0'),l=ls.filter(function(f){return compOf(f)===k;});if(l.length)out.push({key:k,label:MESES[i-1],n:l.length,extra:pend(l)});}return out;}
  return null;}
function folderCards(items){return items.length?'<div class="folders">'+items.map(function(it){return '<button class="fold" data-go="'+e(it.key)+'"><span class="fi">'+FICO+'</span><span><b>'+e(it.label)+'</b><small>'+it.n+' documento(s)'+(it.extra?' · '+it.extra:'')+'</small></span></button>';}).join('')+'</div>':'<p class="empty">Pasta vazia.</p>';}
function crumbsHTML(root,F){var c=[['root',root]];if(F.setor)c.push(['setor',F.setor]);if(F.ano)c.push(['ano',F.ano]);if(F.comp)c.push(['comp',MESES[+F.comp.slice(5)-1]]);
  return '<nav class="crumbs" aria-label="Caminho">'+c.map(function(k,i){return i===c.length-1?'<b>'+e(k[1])+'</b>':'<button data-cr="'+k[0]+'">'+e(k[1])+'</button><span aria-hidden="true">›</span>';}).join('')+'</nav>';}
function folderClick(t,F){if(t.hasAttribute('data-go')){var v=t.getAttribute('data-go');if(!F.setor)F.setor=v;else if(!F.ano)F.ano=v;else F.comp=v;return true;}
  if(t.hasAttribute('data-cr')){var lv=t.getAttribute('data-cr');if(lv==='root')F.setor=F.ano=F.comp=null;else if(lv==='setor')F.ano=F.comp=null;else if(lv==='ano')F.comp=null;return true;}return false;}
S.pf=S.pf||{setor:null,ano:null,comp:null,fid:null,vis:'todos',q:''};
try{S.pf.view=localStorage.getItem('nx_docview')||'pastas';}catch(x){S.pf.view='pastas';}
function locKey(L){return [L.setor||'',L.ano||'',L.comp||'',L.fid||''].join('|');}
function myFolders(){db.folders=db.folders||[];return db.folders.filter(function(x){return x.cliente===S.cid;});}
function folderById(id){return (db.folders||[]).filter(function(x){return x.id===id;})[0];}
function folderChain(fid){var out=[],f=folderById(fid);while(f){out.unshift(f);f=folderById(f.parent.fid);}return out;}
function pathOf(f){var p=[setorOf(f)==='__custom'?'':setorOf(f),compOf(f).slice(0,4),MESES[+compOf(f).slice(5)-1]];if(f.folder)folderChain(f.folder).forEach(function(x){p.push(x.nome);});return p.filter(Boolean).join(' › ');}
function inside(f,L){ // arquivo está dentro da localização L (recursivo)?
  if(L.fid){var ch=f.folder?folderChain(f.folder).map(function(x){return x.id;}):[];return ch.indexOf(L.fid)>-1;}
  if(setorOf(f)==='__custom')return !L.setor&&!!f.folder;
  return (!L.setor||setorOf(f)===L.setor)&&(!L.ano||compOf(f).slice(0,4)===L.ano)&&(!L.comp||compOf(f)===L.comp);}
S.xp=S.xp||{};
function arquivos(){
  shell('arquivos',head('Documentos','Suas guias, relatórios e documentos. Para enviar arquivos para a NEXIO, clique em “Enviar documentos” ou arraste os arquivos para cá; eles ficam em “Enviados pelo cliente”.')+'<div id="xpRoot"></div>');
  var who=meU().nome;
  function send(files,L,re){var n=0,tot=files.length;files.forEach(function(file){NX.readFile(file,function(r){var pl=NX.placeFor(db,L,'Enviados pelo cliente');
    var f={id:NX.uid(),cliente:S.cid,setor:pl.setor,folder:pl.folder,tipo:'Documento',titulo:r.nome.replace(/\.[^.]+$/,''),comp:pl.comp,venc:'',valor:0,status:'recebido',de:'cliente',por:who,nome:r.nome,data:r.data,size:r.size,criado:NX.today(),visto:false};
    hist(f,'Enviado pelo cliente');db.files.push(f);logCli('Enviou documento',f.titulo);
    if(++n===tot&&persist()!==false){if(!L.fid&&!L.comp){S.xp.L={setor:'Enviados pelo cliente',ano:NX.ym().slice(0,4),comp:NX.ym()};}re();NX.toast(tot+' documento(s) enviado(s) para a NEXIO.');}});});}
  NX.explorer(document.getElementById('xpRoot'),{db:db,cliente:S.cid,role:'cliente',st:S.xp,rootLabel:'Meus documentos',onGuia:(nivel()==='titular'||nivel()==='financeiro')?function(f,re){var pago=f.status==='pago';if(!confirm(pago?'Marcar "'+f.titulo+'" como NÃO paga?':'Confirmar que você pagou "'+f.titulo+'"?'))return;f.status=pago?'':'pago';f.situacao='';hist(f,pago?'Cliente marcou como não paga':'Pagamento informado');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:meU().nome,texto:(pago?'Marquei a guia como não paga: ':'Informei o pagamento da guia: ')+f.titulo+'.',em:new Date().toISOString(),lida:false});logCli(pago?'Marcou guia como não paga':'Informou pagamento',f.titulo);persist();re();NX.toast(pago?'Guia marcada como não paga.':'Pagamento informado. Obrigado!');}:null,uploadSetor:'Enviados pelo cliente',showAll:true,flat:['Societário'],
    setores:['Fiscal','Departamento Pessoal','Contábil','Financeiro','Societário','Certidões','Notas fiscais','Enviados pelo cliente'].filter(function(s){var v=setoresNivel();return !v||v.indexOf(s)>-1;}),readonly:nivel()==='consulta',
    setorOf:setorOf,visible:visivel,
    onOpen:function(f){openDoc(f);},
    onUpload:function(L,re){var inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.onchange=function(){if(inp.files.length)send([].slice.call(inp.files),L,re);};inp.click();},
    onDropFiles:send});
}
function openDoc(f){var who=meU().nome;
  if(f.de==='equipe'&&!f.visto)f.visto=true;hist(f,'Visualizado');logCli('Visualizou documento',f.titulo);persist();
  var acts=[{label:'Baixar',cls:'b-blue',close:false,fn:function(x){hist(x,'Baixado');logCli('Baixou documento',x.titulo);persist();NX.download(x);}}];
  if(f.tipo==='Guia'&&f.status==='pago'&&(nivel()==='titular'||nivel()==='financeiro'))acts.push({label:'Marcar como não paga',fn:function(x){x.status='';x.situacao='';hist(x,'Cliente marcou como não paga');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:who,texto:'Marquei a guia como não paga: '+x.titulo+'.',em:new Date().toISOString(),lida:false});logCli('Marcou guia como não paga',x.titulo);persist();NX.toast('Guia marcada como não paga.');}});
  if(f.tipo==='Guia'&&f.status!=='pago'&&(nivel()==='titular'||nivel()==='financeiro'))acts.push({label:'Já paguei',fn:function(x){x.status='pago';hist(x,'Pagamento informado');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:who,texto:'Informei o pagamento da guia: '+x.titulo+'.',em:new Date().toISOString(),lida:false});logCli('Informou pagamento',x.titulo);persist();NX.toast('Pagamento informado. Obrigado!');}});
  NX.viewer(f,{db:db,me:'cliente',path:NX.xpPath?NX.xpPath(f):pathOf(f),actions:acts,onClose:function(){var r=route();if(r==='arquivos')arquivos();else if(r==='inicio')inicio();},

function contratoPg(){var brl=function(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});},fd=function(d){return d?NX.fdate(String(d).slice(0,10)):'—';};

    var card=k?'<section class="card" style="margin-bottom:18px"><div class="row between" style="align-items:flex-start"><div><h2 style="margin:0">Contrato de prestação de serviços</h2><p class="help">'+e(k.plano||'')+' · honorários de '+brl(k.valor)+' por mês, vencimento todo dia '+k.dia_venc+'</p></div>'+
      ({assinado:'<span class="tag ok">Assinado</span>',enviado:'<span class="tag warn">Aguardando sua assinatura</span>',encerrado:'<span class="tag">Encerrado</span>'})[k.status]+'</div>'+

      (k.fidelidade_meses?'<p class="help" style="margin-top:10px">Fidelidade de '+k.fidelidade_meses+' meses a partir de '+fd(k.inicio)+'.</p>':'')+'<div class="row" style="margin-top:12px">'+(k.status==='enviado'?'<button class="btn b-blue" id="lerc">Ler e assinar o contrato</button>':'<a class="btn b-line" href="/contrato/?t='+k.token+'" target="_blank" rel="noopener">Ver contrato e certificado</a>')+(k.assinado_em?'<span class="help">Assinado por '+e(k.assinado_nome||'')+' em '+new Date(k.assinado_em).toLocaleString('pt-BR')+'</span>':'')+'</div></section>'
      :'<section class="card" style="margin-bottom:18px"><p class="empty">Seu contrato ainda não foi disponibilizado aqui. Fale com a gente em Mensagens.</p></section>';
    el.innerHTML=card+'<div class="kpis" style="margin-bottom:18px"><div class="kpi main"><span>Próximo vencimento</span><strong>'+(prox?fd(prox.vencimento):'—')+'</strong></div><div class="kpi"><span>Em aberto</span><strong>'+brl(abertas.reduce(function(s,f){return s+Number(f.valor);},0))+'</strong></div><div class="kpi"><span>Vencidas</span><strong style="color:var(--bad)">'+abertas.filter(function(f){return f.vencimento<hoje;}).length+'</strong></div></div>'+
      '<section class="card"><h2>Faturas</h2><p class="help" style="margin-bottom:12px"><b>Programa Cliente Pontual NEXIO:</b> pagando a mensalidade até o vencimento, você ganha 10% de desconto na mensalidade do mês seguinte. Pagamento por boleto ou PIX.</p>'+(ft.length?'<div class="tbl"><table><thead><tr><th>Competência</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Situação</th><th>Pagamento</th></tr></thead><tbody>'+ft.map(function(f){var atr=f.status==='aberta'&&f.vencimento<hoje;
        return '<tr><td>'+NX.fcomp(f.competencia)+'</td><td>'+e(f.descricao)+'</td><td>'+brl(f.valor)+'</td><td>'+fd(f.vencimento)+'</td><td>'+(f.status==='paga'?'<span class="tag ok">Paga'+(f.pago_em?' em '+fd(f.pago_em):'')+'</span>':atr?'<span class="tag bad">Vencida</span>':'<span class="tag warn">Em aberto</span>')+'</td><td style="white-space:nowrap">'+(f.status==='aberta'?(f.boleto_url?'<a class="btn b-text" href="'+e(f.boleto_url)+'" target="_blank" rel="noopener">Boleto</a>':'')+(f.linha?'<button class="btn b-text" data-cp="'+e(f.linha)+'">Copiar linha</button>':'')+(f.pix?'<button class="btn b-text" data-cp="'+e(f.pix)+'">Copiar PIX</button>':'')+(function(){var bf=myFiles().filter(function(d){return /^Boleto/.test(d.titulo||'')&&d.venc===f.vencimento&&/13º/.test(d.titulo||'')===/13º/.test(f.descricao||'');})[0];return bf?'<button class="btn b-text" data-bol="'+bf.id+'">Ver boleto</button>':'';})()+(!f.boleto_url&&!f.linha&&!f.pix&&!myFiles().some(function(d){return /^Boleto/.test(d.titulo||'')&&d.venc===f.vencimento&&/13º/.test(d.titulo||'')===/13º/.test(f.descricao||'');})?'<span class="help">Em emissão</span>':''):'')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="empty">Nenhuma fatura ainda.</p>')+'</section>';
    el.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){navigator.clipboard.writeText(b.getAttribute('data-cp')).then(function(){NX.toast('Copiado.');});};});
    el.querySelectorAll('[data-bol]').forEach(function(b){b.onclick=function(){var d=myFiles().filter(function(x){return x.id===b.getAttribute('data-bol');})[0];if(d)NX.viewer(d,{db:db,me:'cliente',actions:[{label:'Baixar',cls:'b-blue',close:false,fn:function(x){NX.download(x);}}]});};});
    var lb=document.getElementById('lerc');if(lb)lb.onclick=function(){NXA.sb.rpc('contrato_por_token',{p_token:k.token}).then(function(r){if(r.error||!r.data){NX.toast('Contrato indisponível.');return;}
      var box=document.createElement('section');box.className='card';box.style.marginBottom='18px';
      box.innerHTML='<h2>Contrato para assinatura</h2><pre style="white-space:pre-wrap;font:15px/1.6 Calibri,Arial,sans-serif;max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:16px">'+e(r.data.texto)+'</pre>'+
      '<form id="fsg" class="grid" style="margin-top:14px"><label>Nome completo do responsável<input name="nome" required value="'+e((meU()||{}).nome||'')+'"></label><label>CPF do responsável<input name="doc" required inputmode="numeric"></label>'+
      '<label style="grid-column:1/-1;flex-direction:row;align-items:flex-start;gap:8px;font-weight:500"><input type="checkbox" name="ok" required style="width:auto;min-height:auto;margin-top:4px"> Li e concordo com todas as cláusulas'+(k.fidelidade_meses?', inclusive a de fidelidade de '+k.fidelidade_meses+' meses e a multa por saída antecipada,':'')+' e declaro ter poderes para assinar em nome da empresa.</label>'+
      '<p class="help" style="grid-column:1/-1">A assinatura fica vinculada à sua conta do portal e registra data, hora, IP, dispositivo e código de integridade do texto.</p><button class="btn b-blue" type="submit">Assinar contrato</button><p class="help" id="sgm" style="color:var(--bad)"></p></form>';
      el.insertBefore(box,el.firstChild.nextSibling);box.scrollIntoView({behavior:'smooth'});
      box.querySelector('#fsg').onsubmit=function(ev){ev.preventDefault();var d=new FormData(ev.target),cpf=String(d.get('doc')).replace(/\D/g,'');if(cpf.length!==11&&cpf.length!==14){box.querySelector('#sgm').textContent='Informe um CPF válido.';return;}
        NXA.sb.rpc('assinar_contrato',{p_token:k.token,p_nome:d.get('nome'),p_doc:cpf,p_ua:navigator.userAgent}).then(function(x){if(x.error){box.querySelector('#sgm').textContent='Não foi possível assinar: '+x.error.message;return;}
          NXA.acesso('Assinou contrato','',S.cid);NX.toast('Contrato assinado. Obrigado!');contratoPg();});};});};});}

function primeiroAcessoR(recuperacao){var p=REAL.perfil,precisa=!p.aceite_versao||p.aceite_versao!==TERMOS_V;
  boxR('<h1>'+(recuperacao?'Nova senha':'Bem-vindo(a) ao Portal NEXIO')+'</h1>'+(precisa?'<p class="help" style="font-size:15px;color:var(--ink)">Leia e aceite os documentos abaixo. Eles explicam como protegemos os seus dados e os da sua empresa.</p><p><a href="/termos/" target="_blank" rel="noopener">Termos de Uso (versão '+TERMOS_V+')</a><br><a href="/privacidade/" target="_blank" rel="noopener">Política de Privacidade (versão '+TERMOS_V+')</a></p>':'')+
  '<form id="pf">'+(precisa?'<label style="flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-weight:500"><input type="checkbox" id="pac" required style="width:auto;min-height:auto;margin-top:5px">Li e aceito os Termos de Uso e estou ciente da Política de Privacidade.</label><label style="flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-weight:500"><input type="checkbox" id="pmkr" style="width:auto;min-height:auto;margin-top:5px">Quero receber conteúdos e novidades da NEXIO por e-mail (opcional).</label>':'')+
  '<p class="help" style="color:var(--ink)">Crie sua senha: pelo menos 8 caracteres.</p><label>Senha<input type="password" id="ps1" minlength="8" required autocomplete="new-password"></label><label>Repita a senha<input type="password" id="ps2" minlength="8" required autocomplete="new-password"></label><button class="btn b-blue">Salvar e entrar</button><p class="help" id="perr" role="alert" style="color:var(--bad)"></p></form>');
  document.getElementById('pf').onsubmit=function(ev){ev.preventDefault();var a=document.getElementById('ps1').value,b=document.getElementById('ps2').value,er=document.getElementById('perr');if(a!==b){er.textContent='As senhas não conferem.';return;}if(a.length<8){er.textContent='Use pelo menos 8 caracteres.';return;}er.textContent='Salvando…';
    sbp.auth.updateUser({password:a}).then(function(r){if(r.error){er.textContent='Não foi possível salvar: '+r.error.message;return;}
      var fim=function(){NXA.tipoLink=null;history.replaceState(null,'','/portal/');NXA.acesso(recuperacao?'Redefiniu a senha':'Primeiro acesso: criou a senha');bootReal();};

function bootReal(){
  if(!NXA.ok){boxR('<h1>Portal do Cliente</h1><p class="help" style="font-size:15px;color:var(--ink)">Não foi possível carregar o serviço de login. Verifique sua internet e recarregue a página.</p>');return;}
  if(NXA.erroLink){boxR('<h1>Link inválido ou expirado</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(NXA.erroLink)+'. Peça um novo convite à NEXIO ou use "Esqueci minha senha".</p><button class="btn b-blue" id="vb">Ir para o login</button>');NXA.erroLink=null;history.replaceState(null,'','/portal/');document.getElementById('vb').onclick=bootReal;return;}
  boxR('<h1>Portal do Cliente</h1><p class="help">Carregando…</p>');

    NXA.perfil().then(function(p){if(!p){NXA.sair().then(telaLoginR);return;}REAL.perfil=p;

          boxR('<h1>Olá, '+e(p.nome.split(' ')[0])+'!</h1><p class="help">Você é da equipe NEXIO. Pode ir para o painel ou ver o portal exatamente como um cliente vê (modo visualização, sem alterar nada).</p><a class="btn b-blue" href="/admin/">Ir para o painel da equipe</a><h2 style="font-size:16px;margin-top:8px">Ver o portal como o cliente:</h2>'+REAL.emps.map(function(x){return '<button class="btn b-line" data-ce="'+x.id+'" style="justify-content:flex-start;text-align:left;min-height:52px"><span><b>'+e(x.fantasia||x.razao_social)+'</b></span></button>';}).join('')+'<button class="btn b-text" id="sx">Sair</button>');
          root.querySelectorAll('[data-ce]').forEach(function(b){b.onclick=function(){abrirEmpresa(REAL.emps.filter(function(x){return x.id===b.getAttribute('data-ce');})[0]);};});document.getElementById('sx').onclick=sairReal;});return;}
      sbp.from('empresa_usuarios').select('nivel, empresas(id,razao_social,fantasia,documento)').eq('usuario_id',p.id).then(function(q){if(q.error){boxR('<h1>Erro</h1><p class="help">'+e(q.error.message)+'</p>');return;}
        REAL.emps=(q.data||[]).filter(function(x){return x.empresas;}).map(function(x){return Object.assign({nivel:x.nivel},x.empresas);});
        if(!REAL.emps.length){boxR('<h1>Acesso em liberação</h1><p class="help" style="font-size:15px;color:var(--ink)">Seu usuário foi criado, mas ainda não está ligado a nenhuma empresa. A NEXIO vai liberar em breve.</p><button class="btn b-line" id="sx">Sair</button>');document.getElementById('sx').onclick=sairReal;return;}
        var salvo=null;try{salvo=sessionStorage.getItem('nx_emp');}catch(x){}

        if(!atual){escolherR();return;}abrirEmpresa(atual);});});});}

  shell('usuarios',head('Usuários da empresa','Quem da '+e(c.nome)+' acessa o portal e o que cada um pode fazer.')+'<section class="card"><h2>Convidar usuário</h2><form id="cuf" class="grid"><label>Nome<input id="cun" required></label><label>E-mail<input id="cue" type="email" required></label><label>Nível<select id="cuv">'+Object.keys(NX.NIV_CLI).map(function(k){return '<option value="'+k+'"'+(k==='consulta'?' selected':'')+'>'+NX.NIV_CLI[k].nome+'</option>';}).join('')+'</select></label><div><button class="btn b-blue">Enviar convite</button></div><p class="help" id="cust" style="grid-column:1/-1">A pessoa recebe um e-mail com o link de acesso. No primeiro acesso aceita os termos e cria a senha.</p></form></section>'+
  '<section class="card" id="cul"><p class="help">Carregando…</p></section><section class="card"><h2>Níveis de acesso</h2>'+Object.keys(NX.NIV_CLI).map(function(k){return '<div class="list-item"><div><b>'+NX.NIV_CLI[k].nome+'</b><small>'+NX.NIV_CLI[k].desc+'</small></div></div>';}).join('')+'</section>');
  sbp.rpc('usuarios_da_empresa',{p_empresa:S.cid}).then(function(r){var L=r.data||[];document.getElementById('cul').innerHTML='<h2>Usuários ('+L.length+')</h2>'+L.map(function(u){return '<div class="list-item"><div><b>'+e(u.nome)+(u.id===S.uid?' (você)':'')+'</b><small>'+e(u.email)+' · '+NX.NIV_CLI[u.nivel].nome+(u.aceite_em?'':' · convite pendente')+'</small></div>'+(u.id===S.uid?'':'<div class="row"><select data-nv="'+u.id+'" data-em="'+e(u.email)+'" data-nm="'+e(u.nome)+'" aria-label="Nível">'+Object.keys(NX.NIV_CLI).map(function(k){return '<option value="'+k+'"'+(u.nivel===k?' selected':'')+'>'+NX.NIV_CLI[k].nome+'</option>';}).join('')+'</select><button class="btn b-text" data-rmu="'+u.id+'" style="color:var(--bad)">Remover</button></div>')+'</div>';}).join('');
    root.querySelectorAll('[data-nv]').forEach(function(s){s.onchange=function(){sbp.rpc('vincular_usuario',{p_empresa:S.cid,p_email:s.getAttribute('data-em'),p_nivel:s.value,p_nome:''}).then(function(x){if(x.error){NX.toast('Erro: '+x.error.message);return;}logCli('Alterou nível de usuário',s.getAttribute('data-nm')+' → '+NX.NIV_CLI[s.value].nome);NX.toast('Nível atualizado.');});};});
    root.querySelectorAll('[data-rmu]').forEach(function(b){b.onclick=function(){if(!confirm('Remover o acesso deste usuário a esta empresa?'))return;sbp.rpc('desvincular_usuario',{p_empresa:S.cid,p_usuario:b.getAttribute('data-rmu')}).then(function(x){if(x.error){NX.toast('Erro: '+x.error.message);return;}logCli('Removeu acesso de usuário');usuariosEmp();});};});});
  document.getElementById('cuf').onsubmit=function(ev){ev.preventDefault();var nm=document.getElementById('cun').value.trim(),em=document.getElementById('cue').value.trim().toLowerCase(),nv=document.getElementById('cuv').value,st=document.getElementById('cust');st.textContent='Enviando convite…';
    NXA.convite(em,nm,'https://nexioic.com.br/portal/').then(function(o){if(o.error){st.textContent='Erro no convite: '+(/rate|limit|seconds/i.test(o.error.message)?'limite de e-mails atingido, tente em alguns minutos.':o.error.message);return;}
      setTimeout(function(){sbp.rpc('vincular_usuario',{p_empresa:S.cid,p_email:em,p_nivel:nv,p_nome:nm}).then(function(x){if(x.error){st.textContent='Convite enviado, mas não consegui vincular: '+x.error.message;return;}logCli('Convidou usuário',nm+' ('+NX.NIV_CLI[nv].nome+')');NX.toast('Convite enviado para '+em+'.');usuariosEmp();});},1500);});};}
window.addEventListener('focus',function(){if(NXS.modo&&!document.querySelector('dialog[open]')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))NXS.atualizar(function(){render();});});

render();
})();
</script>
</body>
