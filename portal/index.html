<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do Cliente | NEXIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0740EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
</head>
<body>
<div id="root"></div>
<div class="toast" role="status" id="toast"></div>
<div id="printArea"></div>
<dialog id="pdlg" style="border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 32px)"></dialog>
<style>#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;padding:10mm}}</style>
<script src="/assets/store.js"></script>
<script>
(function(){
var db=NX.load(), e=NX.esc, S={cid:null,month:NX.ym(),filtro:'todos'};
try{S.cid=sessionStorage.getItem('nx_client');}catch(x){}
var root=document.getElementById('root');
function me(){return db.clients.filter(function(c){return c.id===S.cid;})[0];}
function persist(){NX.save(db);}
function myFiles(){return db.files.filter(function(f){return f.cliente===S.cid;}).sort(function(a,b){return a.criado<b.criado?1:-1;});}
function unread(){return db.messages.filter(function(m){return m.cliente===S.cid&&m.de==='equipe'&&!m.lida;}).length;}
function novos(){return myFiles().filter(function(f){return f.de==='equipe'&&!f.visto&&visivel(f);}).length;}
function route(){return location.hash.replace('#/','')||'inicio';}

function login(){
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><h1>Portal do Cliente</h1>'+
  '<label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label>'+
  '<button class="btn b-blue">Entrar</button><p class="help" id="err" role="alert"></p>'+
  '<p class="help"><b>Protótipo:</b> entre com um cliente de exemplo:</p><div class="row">'+db.clients.slice(0,3).map(function(c){return '<button type="button" class="btn b-line" data-q="'+c.id+'" style="min-height:36px;font-size:13px">'+e(c.nome)+'</button>';}).join('')+'</div>'+
  '<p class="help">Esqueceu a senha? Fale com a NEXIO pelo <a href="https://wa.me/5511939565190">WhatsApp</a>.</p></form></div>';
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim().toLowerCase(),pw=document.getElementById('lp').value;
    var c=db.clients.filter(function(x){return (x.email||'').toLowerCase()===em&&x.senha===pw;})[0];
    if(!c){document.getElementById('err').textContent='E-mail ou senha incorretos.';return;}enter(c.id);};
  root.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){enter(b.getAttribute('data-q'));};});
}
function enter(id){S.cid=id;try{sessionStorage.setItem('nx_client',id);}catch(x){}location.hash='#/inicio';render();}

function shell(active,html){
  var c=me(),nav=[['inicio','Início',0],['arquivos','Documentos',novos()],['calendario','Obrigações',0],['notas','Notas fiscais',0],['financeiro','Controle financeiro',0],['mensagens','Mensagens',unread()]];
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/inicio"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><div class="role">Portal do cliente</div>'+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  
  '<div class="foot"><span>'+e(c.nome)+'</span><a href="https://wa.me/5511939565190">Falar no WhatsApp</a><a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();S.cid=null;try{sessionStorage.removeItem('nx_client');}catch(x){}location.hash='';render();};
}
function head(t,sub){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><span class="badge-proto">Protótipo</span></div>';}
function guiaRow(f){var s=NX.statusOf(f);return '<div class="list-item"><div><b>'+e(f.titulo)+(!f.visto&&f.de==='equipe'?'<span class="dot" aria-label="novo"></span>':'')+'</b><small>'+(f.venc?'Vence em '+NX.fdate(f.venc)+' · ':'')+'Competência '+NX.fcomp(f.comp)+'</small></div><div class="row" style="align-items:center"><strong>'+(f.valor?NX.brl(f.valor):'')+'</strong><span class="tag '+s.c+'">'+s.t+'</span><button class="btn b-line" data-dl="'+f.id+'" style="min-height:38px">Baixar</button></div></div>';}

function inicio(){
  var c=me(),t=NX.today(),fs=myFiles();
  var pagar=fs.filter(function(f){return visivel(f)&&f.tipo==='Guia'&&f.status!=='pago';}).sort(function(a,b){return a.venc<b.venc?-1:1;});
  var total=pagar.reduce(function(s,f){return s+(f.valor||0);},0);
  var prox=NX.obligationsFor(db,S.cid,NX.ym()).concat(NX.obligationsFor(db,S.cid,NX.shiftMonth(NX.ym(),1))).filter(function(o){return o.data>=t;}).slice(0,5);
  shell('inicio',head('Olá, '+e(function(n){var p=n.split(' ');return /^dra?\.$/i.test(p[0])?p.slice(0,2).join(' '):p[0];}(c.resp||c.nome)),'Tudo o que você precisa da sua contabilidade, em um só lugar.')+
  avisosAtivos().map(function(a){return '<section class="card" style="border:2px solid var(--blue);margin-bottom:18px"><div class="row between" style="align-items:flex-start"><div><span class="tag info">Comunicado da NEXIO</span><h2 style="margin:8px 0 6px">'+e(a.titulo)+'</h2><p style="margin:0;white-space:pre-line">'+e(a.texto)+'</p></div><button class="btn b-line" data-lido="'+a.id+'">Marcar como lido</button></div></section>';}).join('')+'<div class="kpis"><a class="kpi main" href="#/arquivos"><span>Guias a pagar</span><strong>'+NX.brl(total)+'</strong></a><a class="kpi" href="#/arquivos"><span>Arquivos novos</span><strong>'+novos()+'</strong></a><a class="kpi" href="#/mensagens"><span>Mensagens novas</span><strong>'+unread()+'</strong></a><div class="kpi"><span>Seu plano</span><strong style="font-size:20px">'+e(c.plano)+'</strong></div></div>'+
  '<div class="cols"><section class="card"><h2>Guias para pagar</h2>'+(pagar.length?pagar.map(guiaRow).join(''):'<p class="empty">Nenhuma guia pendente. Tudo em dia!</p>')+'</section>'+
  '<section class="card"><h2>Próximas obrigações</h2>'+(prox.length?prox.map(function(o){return '<div class="list-item"><div><b>'+e(o.titulo)+'</b><small>'+e(o.desc||'')+'</small></div><span class="tag info">'+NX.fdate(o.data)+'</span></div>';}).join(''):'<p class="empty">Nenhuma obrigação nos próximos dias.</p>')+'<a class="btn b-text" href="#/calendario" style="margin-top:8px">Ver calendário completo</a></section></div>');
  bindDl();
  root.querySelectorAll('[data-lido]').forEach(function(b){b.onclick=function(){var a=db.avisos.filter(function(x){return x.id===b.getAttribute('data-lido');})[0];a.lidos=a.lidos||{};a.lidos[S.cid]=new Date().toISOString();persist();inicio();};});
}
var RESTRITOS=['Administrativo (interno)'];
function setorOf(f){if(f.setor)return f.setor;if(f.tipo==='Nota fiscal')return 'Notas fiscais';if(f.de==='cliente')return 'Enviados pelo cliente';
  if(f.tipo==='Folha de pagamento'||/fgts|inss|folha|e-?social|dctfweb|f[ée]rias|rescis|pr[óo]-?labore/i.test(f.titulo))return 'Departamento Pessoal';
  if(/cnd|certid/i.test(f.titulo))return 'Certidões';if(f.tipo==='Contrato')return 'Societário';if(f.tipo==='Relatório')return 'Contábil';if(f.tipo==='Guia')return 'Fiscal';return 'Contábil';}
function compOf(f){return f.comp||(f.criado||NX.today()).slice(0,7);}
function visivel(f){return !f.deleted&&(f.de==='cliente'||(f.shared!=null?f.shared:RESTRITOS.indexOf(setorOf(f))<0));}
function hist(f,ev){f.hist=f.hist||[];f.hist.push({em:new Date().toISOString(),ev:ev,por:me().resp||me().nome});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
S.pf=S.pf||{setor:null,vis:'todos',q:''};
function arquivos(){
  var P=S.pf,fs=myFiles().filter(visivel),setores={};fs.forEach(function(f){setores[setorOf(f)]=(setores[setorOf(f)]||0)+1;});
  var l=fs.filter(function(f){return !P.setor||setorOf(f)===P.setor;});
  if(P.vis!=='todos')l=l.filter(function(f){return f.de==='equipe'&&(P.vis==='nao'?!f.visto:f.visto);});
  if(P.q){var q=P.q.toLowerCase();l=l.filter(function(f){return (f.titulo+' '+f.nome).toLowerCase().indexOf(q)>-1;});}
  l.sort(function(a,b){return (compOf(b)+b.criado)<(compOf(a)+a.criado)?-1:1;});
  var groups={};l.forEach(function(f){var k=compOf(f);(groups[k]=groups[k]||[]).push(f);});
  shell('arquivos',head('Documentos','Suas guias, relatórios e documentos, organizados por setor e competência.')+
  '<section class="card"><div class="row between" style="align-items:center"><div><h2 style="margin:0">Enviar documento para a NEXIO</h2><p class="help">Extratos, notas fiscais, comprovantes, contratos…</p></div><div class="row" style="align-items:center"><label class="btn b-blue" style="display:inline-flex;flex-direction:row;color:#fff">Escolher arquivos<input type="file" id="fi" multiple style="display:none"></label></div></div><div class="drop" id="dz" style="margin-top:12px;padding:14px">ou arraste os arquivos aqui (até 1,5 MB cada no protótipo)</div></section>'+
  '<section class="card"><div style="display:flex;flex-wrap:wrap;gap:18px">'+
  '<nav aria-label="Setores" style="flex:0 0 220px;display:flex;flex-direction:column;gap:2px"><button class="btn b-text" data-ps="" style="justify-content:space-between;color:'+(!P.setor?'var(--blue)':'var(--ink)')+';font-weight:'+(!P.setor?700:500)+'">Todos os documentos<span style="color:var(--muted)">'+fs.length+'</span></button>'+
    Object.keys(setores).sort().map(function(s){var on=P.setor===s;return '<button class="btn b-text" data-ps="'+e(s)+'" style="justify-content:space-between;color:'+(on?'var(--blue)':'var(--ink)')+';font-weight:'+(on?700:500)+'">'+e(s)+'<span style="color:var(--muted)">'+setores[s]+'</span></button>';}).join('')+'</nav>'+
  '<div style="flex:999 1 460px;min-width:0"><div class="row" style="margin-bottom:12px;align-items:center"><div style="display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden" role="group" aria-label="Filtro">'+[['todos','Todos'],['nao','Não visualizados'],['sim','Visualizados']].map(function(o){return '<button data-pv="'+o[0]+'" aria-pressed="'+(P.vis===o[0])+'" style="border:0;padding:0 12px;min-height:38px;font:600 13px Inter,sans-serif;cursor:pointer;background:'+(P.vis===o[0]?'var(--blue)':'#fff')+';color:'+(P.vis===o[0]?'#fff':'var(--muted)')+'">'+o[1]+'</button>';}).join('')+'</div><label class="sr" for="pq">Pesquisar</label><input id="pq" placeholder="Pesquisar…" value="'+e(P.q)+'" style="width:200px;min-height:38px"></div>'+
  (l.length?Object.keys(groups).sort().reverse().map(function(k){return '<h3 style="font-size:15px;color:var(--blue2);margin:14px 0 6px">'+MESES[+k.slice(5)-1]+' de '+k.slice(0,4)+'</h3>'+groups[k].map(function(f){var s=NX.statusOf(f),nc=(f.coments||[]).length;
    return '<div class="list-item"><div><b>'+e(f.titulo)+(!f.visto&&f.de==='equipe'?'<span class="dot" aria-label="não visualizado"></span>':'')+'</b><small>'+e(setorOf(f))+(f.venc?' · vence '+NX.fdate(f.venc):'')+(f.valor?' · '+NX.brl(f.valor):'')+'</small></div><div class="row" style="align-items:center"><span class="tag '+s.c+'">'+s.t+'</span><button class="btn b-text" data-cm="'+f.id+'">Comentários'+(nc?' ('+nc+')':'')+'</button>'+(f.tipo==='Guia'&&f.status!=='pago'?'<button class="btn b-text" data-pay="'+f.id+'">Já paguei</button>':'')+'<button class="btn b-line" data-dl="'+f.id+'" style="min-height:38px">Baixar</button></div></div>';}).join('');}).join(''):'<p class="empty">Nenhum documento encontrado.</p>')+
  '</div></div></section>');
  var main=root.querySelector('.main');
  main.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;var id,f;
    if(t.hasAttribute('data-ps')){P.setor=t.getAttribute('data-ps')||null;arquivos();return;}
    if(t.hasAttribute('data-pv')){P.vis=t.getAttribute('data-pv');arquivos();return;}
    var get=function(a){var i=t.getAttribute(a);return i&&db.files.filter(function(x){return x.id===i;})[0];};
    if(f=get('data-dl')){if(f.de==='equipe'&&!f.visto){f.visto=true;hist(f,'Visualizado pelo cliente');}else hist(f,'Baixado pelo cliente');persist();NX.download(f);arquivos();}
    if(f=get('data-pay')){f.status='pago';hist(f,'Pagamento informado pelo cliente');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:me().resp||me().nome,texto:'Informei o pagamento da guia: '+f.titulo+'.',em:new Date().toISOString(),lida:false});persist();arquivos();NX.toast('Pagamento informado. Obrigado!');}
    if(f=get('data-cm'))pComment(f);});
  var pq=document.getElementById('pq');pq.oninput=function(){P.q=pq.value;clearTimeout(pq._t);pq._t=setTimeout(function(){arquivos();var x=document.getElementById('pq');x.focus();x.setSelectionRange(x.value.length,x.value.length);},350);};
  function send(files){var n=0,tot=files.length;files.forEach(function(file){NX.readFile(file,function(r){var f={id:NX.uid(),cliente:S.cid,tipo:'Documento',titulo:r.nome.replace(/\.[^.]+$/,''),comp:NX.ym(),venc:'',valor:0,status:'recebido',de:'cliente',nome:r.nome,data:r.data,size:r.size,criado:NX.today(),visto:false};hist(f,'Enviado pelo cliente');db.files.push(f);if(++n===tot&&persist()!==false){P.setor='Enviados pelo cliente';arquivos();NX.toast(tot+' documento(s) enviado(s) para a NEXIO.');}});});}
  document.getElementById('fi').onchange=function(ev){if(ev.target.files.length)send([].slice.call(ev.target.files));};
  var z=document.getElementById('dz');z.ondragover=function(ev){ev.preventDefault();z.classList.add('over');};z.ondragleave=function(){z.classList.remove('over');};z.ondrop=function(ev){ev.preventDefault();z.classList.remove('over');if(ev.dataTransfer.files.length)send([].slice.call(ev.dataTransfer.files));};
}
function pComment(f){var d=document.getElementById('pdlg');
  d.innerHTML='<form method="dialog" style="padding:24px;display:flex;flex-direction:column;gap:14px"><h2 style="color:var(--blue2);font-size:20px">Comentários</h2><p class="help">'+e(f.titulo)+'</p><div class="chat" style="max-height:260px">'+((f.coments||[]).length?f.coments.map(function(m){return '<div class="msg '+(m.de==='cliente'?'me':'them')+'">'+e(m.texto)+'<small>'+(m.de==='equipe'?e(m.autor)+' · NEXIO':'Você')+' · '+NX.ftime(m.em)+'</small></div>';}).join(''):'<p class="empty">Nenhum comentário ainda.</p>')+'</div><label>Escreva para a equipe<input name="t" placeholder="Ex.: Esse valor está correto?"></label><div class="row between"><button type="button" class="btn b-line" id="pdc">Fechar</button><button class="btn b-blue" type="submit">Enviar</button></div></form>';
  d.querySelector('#pdc').onclick=function(){d.close();};
  d.querySelector('form').onsubmit=function(ev){ev.preventDefault();var t=String(new FormData(ev.target).get('t')||'').trim();if(t){f.coments=f.coments||[];f.coments.push({em:new Date().toISOString(),de:'cliente',autor:me().resp||me().nome,texto:t});hist(f,'Comentário do cliente');db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:me().resp||me().nome,texto:'Comentou no documento "'+f.titulo+'": '+t,em:new Date().toISOString(),lida:false});persist();}d.close();arquivos();};
  d.showModal();}
function avisosAtivos(){var t=NX.today();return (db.avisos||[]).filter(function(a){return (a.clientes[0]==='*'||a.clientes.indexOf(S.cid)>-1)&&(!a.expira||a.expira>=t)&&!(a.lidos&&a.lidos[S.cid]);});}
function bindDl(){root.querySelectorAll('[data-dl]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-dl');var f=db.files.filter(function(x){return x.id===id;})[0];if(f.de==='equipe'&&!f.visto){f.visto=true;persist();}NX.download(f);var r=route();if(r==='arquivos')arquivos();else if(r==='inicio')inicio();};});}
function calendario(){
  var ev=NX.obligationsFor(db,S.cid,S.month).map(function(o){return {data:o.data,titulo:o.titulo};});
  myFiles().forEach(function(f){if(f.tipo==='Guia'&&f.venc&&f.venc.slice(0,7)===S.month){var s=NX.statusOf(f);ev.push({data:f.venc,titulo:'Guia: '+f.titulo,cls:s.c==='ok'?'ok':s.c==='bad'?'bad':''});}});
  var lista=ev.slice().sort(function(a,b){return a.data<b.data?-1:1;});
  shell('calendario',head('Calendário de obrigações','Prazos de impostos, guias e envio de documentos.')+
  '<section class="card"><div class="cal-nav"><button class="btn b-line" id="pm" aria-label="Mês anterior">‹</button><strong>'+NX.monthLabel(S.month)+'</strong><button class="btn b-line" id="nm" aria-label="Próximo mês">›</button></div>'+NX.calendarHTML(S.month,ev)+'</section>'+
  '<section class="card"><h2>No mês</h2>'+(lista.length?lista.map(function(o){return '<div class="list-item"><b>'+e(o.titulo)+'</b><span class="tag '+(o.cls==='bad'?'bad':o.cls==='ok'?'ok':'info')+'">'+NX.fdate(o.data)+'</span></div>';}).join(''):'<p class="empty">Nada neste mês.</p>')+'</section>');
  document.getElementById('pm').onclick=function(){S.month=NX.shiftMonth(S.month,-1);calendario();};
  document.getElementById('nm').onclick=function(){S.month=NX.shiftMonth(S.month,1);calendario();};
}
function mensagens(){
  db.messages.forEach(function(m){if(m.cliente===S.cid&&m.de==='equipe')m.lida=true;});persist();
  var ms=db.messages.filter(function(m){return m.cliente===S.cid;}).sort(function(a,b){return a.em<b.em?-1:1;});
  shell('mensagens',head('Mensagens','Fale com a equipe da NEXIO. Respondemos em horário comercial.')+'<section class="card"><div class="chat" id="chat">'+
  (ms.length?ms.map(function(m){return '<div class="msg '+(m.de==='cliente'?'me':'them')+'">'+e(m.texto)+'<small>'+(m.de==='equipe'?e(m.autor)+' · NEXIO':'Você')+' · '+NX.ftime(m.em)+'</small></div>';}).join(''):'<p class="empty">Envie sua primeira mensagem.</p>')+
  '</div><form class="chat-form" id="cf"><label class="sr" for="ct">Mensagem</label><input id="ct" placeholder="Escreva sua mensagem…" required><button class="btn b-blue">Enviar</button></form></section>');
  var ch=document.getElementById('chat');ch.scrollTop=ch.scrollHeight;
  document.getElementById('cf').onsubmit=function(ev){ev.preventDefault();var t=document.getElementById('ct').value.trim();if(!t)return;db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:me().resp||me().nome,texto:t,em:new Date().toISOString(),lida:false});persist();mensagens();};
}
/* ---------- NOTAS FISCAIS (simulação) ---------- */
var SERV=[['04.01','Medicina e biomedicina'],['04.12','Odontologia'],['04.08','Fisioterapia, terapia ocupacional e fonoaudiologia'],['04.16','Psicologia'],['04.09','Terapias de qualquer espécie'],['04.03','Hospitais, clínicas, laboratórios e congêneres'],['17.01','Assessoria ou consultoria'],['17.19','Contabilidade'],['01.07','Suporte técnico em informática'],['outro','Outro serviço']];
function onlyDig(s){return String(s||'').replace(/\D/g,'');}
function fmtDoc(d){d=onlyDig(d);return d.length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d;}
function myNotas(){db.notas=db.notas||[];return db.notas.filter(function(n){return n.cliente===S.cid;}).sort(function(a,b){return a.num<b.num?1:-1;});}
function tomadores(){var seen={},out=[];myNotas().forEach(function(n){var k=onlyDig(n.tom.doc);if(k&&!seen[k]){seen[k]=1;out.push(n.tom);}});return out;}
function notas(){
  var ns=myNotas(),mes=NX.ym(),tot=ns.filter(function(n){return n.status==='autorizada'&&n.emissao.slice(0,7)===mes;}).reduce(function(s,n){return s+n.valor;},0);
  var toms=tomadores();
  shell('notas',head('Notas fiscais','Emita notas fiscais de serviço (NFS-e) e acompanhe as notas emitidas.')+
  '<div class="kpis"><div class="kpi main"><span>Faturado no mês</span><strong>'+NX.brl(tot)+'</strong></div><div class="kpi"><span>Notas emitidas no mês</span><strong>'+ns.filter(function(n){return n.emissao.slice(0,7)===mes&&n.status==='autorizada';}).length+'</strong></div><div class="kpi"><span>Total de notas</span><strong>'+ns.length+'</strong></div></div>'+
  '<section class="card"><h2>Emitir nova nota</h2><form id="nf"><div class="grid">'+
  '<label style="grid-column:1/-1">Tomador já cadastrado<select id="ntom"><option value="">— novo tomador —</option>'+toms.map(function(t,i){return '<option value="'+i+'">'+e(t.nome)+' · '+e(fmtDoc(t.doc))+'</option>';}).join('')+'</select></label>'+
  '<label>CPF ou CNPJ do tomador<input name="doc" id="tdoc" required inputmode="numeric" placeholder="Somente números"></label>'+
  '<label>Nome / razão social<input name="nome" id="tnome" required></label>'+
  '<label>E-mail do tomador<input name="email" id="temail" type="email" placeholder="Para enviar a nota"></label>'+
  '<label>Município do tomador<input name="mun" id="tmun" placeholder="Ex.: São Paulo/SP"></label>'+
  '<label style="grid-column:1/-1">Serviço (item da LC 116)<select name="serv">'+SERV.map(function(s){return '<option value="'+s[0]+'">'+(s[0]==='outro'?'':s[0]+' – ')+s[1]+'</option>';}).join('')+'</select></label>'+
  '<label style="grid-column:1/-1">Descrição do serviço<textarea name="desc" required placeholder="Ex.: Consulta médica realizada em 10/11/2026"></textarea></label>'+
  '<label>Valor do serviço (R$)<input name="valor" id="nval" required inputmode="decimal" placeholder="0,00"></label>'+
  '<label>Competência<input name="comp" type="date" value="'+NX.today()+'" required></label>'+
  '<label style="flex-direction:row;align-items:center;gap:8px;align-self:end;min-height:44px"><input type="checkbox" name="ret" id="nret" style="width:auto;min-height:auto"> ISS retido pelo tomador</label>'+
  '<label id="lal" style="display:none">Alíquota ISS (%)<input name="aliq" id="nal" inputmode="decimal" value="2"></label>'+
  '</div><div class="row between" style="margin-top:16px;align-items:center"><p class="help" id="nliq">Valor líquido: R$ 0,00</p><button class="btn b-blue" type="submit">Emitir nota fiscal</button></div>'+
  '<p class="help" style="margin-top:8px"><b>Protótipo:</b> a emissão é simulada — nenhuma nota é enviada à Prefeitura ou ao Emissor Nacional.</p></form></section>'+
  '<section class="card"><h2>Notas emitidas</h2><div class="tbl"><table><thead><tr><th>Nº</th><th>Emissão</th><th>Tomador</th><th>Serviço</th><th>Valor</th><th>Situação</th><th><span class="sr">Ações</span></th></tr></thead><tbody>'+
  (ns.length?ns.map(function(n){return '<tr><td><b>'+n.num+'</b></td><td>'+NX.fdate(n.emissao)+'</td><td>'+e(n.tom.nome)+'<small style="display:block;color:var(--muted)">'+e(fmtDoc(n.tom.doc))+'</small></td><td>'+e(n.serv)+'</td><td>'+NX.brl(n.valor)+'</td><td><span class="tag '+(n.status==='autorizada'?'ok':'bad')+'">'+(n.status==='autorizada'?'Autorizada (simulação)':'Cancelada')+'</span></td><td style="white-space:nowrap"><button class="btn b-text" data-pdf="'+n.id+'">PDF</button><button class="btn b-text" data-xml="'+n.id+'">XML</button>'+(n.status==='autorizada'?'<button class="btn b-danger" data-cancel="'+n.id+'">Cancelar</button>':'')+'</td></tr>';}).join(''):'<tr><td colspan="7" class="empty">Nenhuma nota emitida ainda.</td></tr>')+'</tbody></table></div></section>');
  var f=document.getElementById('nf');
  function liq(){var v=num(document.getElementById('nval').value),r=document.getElementById('nret').checked,a=num(document.getElementById('nal').value);document.getElementById('lal').style.display=r?'':'none';document.getElementById('nliq').textContent='Valor líquido: '+NX.brl(r?v-v*a/100:v)+(r?' (ISS retido: '+NX.brl(v*a/100)+')':'');}
  f.oninput=liq;f.onchange=liq;
  document.getElementById('ntom').onchange=function(ev){var t=toms[ev.target.value];if(!t)return;document.getElementById('tdoc').value=t.doc;document.getElementById('tnome').value=t.nome;document.getElementById('temail').value=t.email||'';document.getElementById('tmun').value=t.mun||'';};
  f.onsubmit=function(ev){ev.preventDefault();var fd=new FormData(f),d=onlyDig(fd.get('doc'));
    if(d.length!==11&&d.length!==14){NX.toast('CPF ou CNPJ do tomador inválido.');return;}
    var v=num(fd.get('valor'));if(!(v>0)){NX.toast('Informe o valor do serviço.');return;}
    var sv=SERV.filter(function(s){return s[0]===fd.get('serv');})[0],ret=!!fd.get('ret'),al=ret?num(fd.get('aliq')):0;
    if(!confirm('Emitir nota de '+NX.brl(v)+' para '+fd.get('nome')+'?'))return;
    var c=me(),seq=(db.notas||[]).filter(function(n){return n.cliente===S.cid;}).length+1;
    var n={id:NX.uid(),cliente:S.cid,num:String(seq).padStart(6,'0'),emissao:NX.today(),comp:fd.get('comp'),status:'autorizada',
      tom:{doc:d,nome:fd.get('nome'),email:fd.get('email'),mun:fd.get('mun')},serv:(sv[0]==='outro'?'':sv[0]+' – ')+sv[1],desc:fd.get('desc'),valor:v,ret:ret,aliq:al,iss:ret?v*al/100:0,
      chave:'SIMULACAO'+Date.now()+Math.floor(Math.random()*1e6),prest:{nome:c.nome,doc:c.doc}};
    db.notas.push(n);
    var xml=notaXML(n);db.files.push({id:NX.uid(),cliente:S.cid,tipo:'Nota fiscal',titulo:'NFS-e nº '+n.num+' — '+n.tom.nome,comp:n.comp.slice(0,7),venc:'',valor:v,status:'emitida',de:'cliente',nome:'NFSe_'+n.num+'.xml',data:'data:application/xml;base64,'+btoa(unescape(encodeURIComponent(xml))),size:xml.length,criado:NX.today(),visto:false});
    if(persist()===false)return;notas();NX.toast('Nota nº '+n.num+' emitida (simulação).');};
  root.querySelector('.main').addEventListener('click',function(ev){var t=ev.target,id,n;
    if(id=t.getAttribute('data-pdf')){n=db.notas.filter(function(x){return x.id===id;})[0];printNota(n);}
    if(id=t.getAttribute('data-xml')){n=db.notas.filter(function(x){return x.id===id;})[0];var x=notaXML(n),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/xml'}));a.download='NFSe_'+n.num+'.xml';document.body.appendChild(a);a.click();a.remove();}
    if(id=t.getAttribute('data-cancel')){var m=prompt('Motivo do cancelamento (obrigatório):');if(!m||m.trim().length<15){if(m!==null)NX.toast('Descreva o motivo com pelo menos 15 caracteres.');return;}
      db.notas.forEach(function(x){if(x.id===id){x.status='cancelada';x.motivo=m.trim();}});
      db.messages.push({id:NX.uid(),cliente:S.cid,de:'cliente',autor:me().resp||me().nome,texto:'Cancelei a NFS-e nº '+db.notas.filter(function(x){return x.id===id;})[0].num+'. Motivo: '+m.trim(),em:new Date().toISOString(),lida:false});
      persist();notas();NX.toast('Nota cancelada (simulação).');}});
}
function num(v){v=String(v||'').trim();if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,'').replace(',','.');else v=v.replace(/,/g,'');var n=parseFloat(v);return isNaN(n)?0:n;}
function xe(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function notaXML(n){return '<?xml version="1.0" encoding="UTF-8"?>\n<!-- PROTÓTIPO NEXIO: documento simulado, sem validade fiscal -->\n<NFSe><infNFSe><nNFSe>'+n.num+'</nNFSe><chave>'+n.chave+'</chave><dhEmi>'+n.emissao+'</dhEmi><situacao>'+n.status+'</situacao>'+
  '<prest><CNPJ>'+onlyDig(n.prest.doc)+'</CNPJ><xNome>'+xe(n.prest.nome)+'</xNome></prest><toma><doc>'+n.tom.doc+'</doc><xNome>'+xe(n.tom.nome)+'</xNome><email>'+xe(n.tom.email)+'</email><mun>'+xe(n.tom.mun)+'</mun></toma>'+
  '<serv><item>'+xe(n.serv)+'</item><xDescServ>'+xe(n.desc)+'</xDescServ><dCompet>'+n.comp+'</dCompet></serv><valores><vServ>'+n.valor.toFixed(2)+'</vServ><ISSRetido>'+(n.ret?1:2)+'</ISSRetido><pAliq>'+n.aliq.toFixed(2)+'</pAliq><vISSRet>'+n.iss.toFixed(2)+'</vISSRet><vLiq>'+(n.valor-n.iss).toFixed(2)+'</vLiq></valores></infNFSe></NFSe>\n';}
function printNota(n){var p=document.getElementById('printArea');
  p.innerHTML='<div style="border:2px solid #2344AC;padding:18px;font:11pt Arial,sans-serif;color:#000">'+(n.status!=='autorizada'?'<p style="color:#B42318;font-weight:700;font-size:16pt;text-align:center">NOTA CANCELADA</p>':'')+
  '<p style="text-align:center;color:#B42318;font-weight:700">DOCUMENTO DE SIMULAÇÃO — SEM VALOR FISCAL</p><h1 style="font-size:16pt;color:#2344AC;margin:0 0 6px">DANFSe — Nota Fiscal de Serviço Eletrônica</h1>'+
  '<p>Número: <b>'+n.num+'</b> · Emissão: <b>'+NX.fdate(n.emissao)+'</b> · Competência: <b>'+NX.fdate(n.comp)+'</b><br>Chave: '+n.chave+'</p><hr>'+
  '<p><b>PRESTADOR</b><br>'+e(n.prest.nome)+'<br>'+e(n.prest.doc)+'</p><p><b>TOMADOR</b><br>'+e(n.tom.nome)+'<br>'+e(fmtDoc(n.tom.doc))+(n.tom.mun?'<br>'+e(n.tom.mun):'')+(n.tom.email?'<br>'+e(n.tom.email):'')+'</p><hr>'+
  '<p><b>SERVIÇO</b><br>'+e(n.serv)+'<br>'+e(n.desc)+'</p><hr><table style="width:100%;font-size:11pt"><tr><td>Valor do serviço</td><td style="text-align:right">'+NX.brl(n.valor)+'</td></tr><tr><td>ISS retido ('+n.aliq.toFixed(2)+'%)</td><td style="text-align:right">'+NX.brl(n.iss)+'</td></tr><tr><td><b>Valor líquido</b></td><td style="text-align:right"><b>'+NX.brl(n.valor-n.iss)+'</b></td></tr></table>'+
  (n.motivo?'<p><b>Motivo do cancelamento:</b> '+e(n.motivo)+'</p>':'')+'</div>';
  window.print();}

function financeiro(){
  shell('financeiro',head('Controle financeiro','Lance entradas e saídas, importe o extrato do banco e exporte para a contabilidade.')+
  '<iframe src="/financeiro/" title="Controle financeiro" style="width:100%;height:calc(100vh - 150px);min-height:720px;border:0;border-radius:16px;background:transparent"></iframe>');
}
function render(){db=NX.load();if(!S.cid||!me()){login();return;}var r=route();
  if(r==='arquivos')arquivos();else if(r==='calendario')calendario();else if(r==='mensagens')mensagens();else if(r==='financeiro')financeiro();else if(r==='notas')notas();else inicio();}
window.addEventListener('hashchange',render);
window.NX_onSync=function(){if(route()==='financeiro'||route()==='notas')return;if(document.activeElement.tagName!=='INPUT')render();};
render();
})();
</script>
</body>
</html>
