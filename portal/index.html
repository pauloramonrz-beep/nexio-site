<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do Cliente | NEXIO</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0740EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
</head>
<body>
<div id="root"></div>
<div class="toast" role="status" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function(){
var e=NX.esc,root=document.getElementById('root'),sb=NXA.sb,TERMOS_V='1.0';
var S={perfil:null,emp:null,emps:[],docs:[],msgs:[],notifs:[],filtro:{setor:'',ano:''}};

function box(inner){root.innerHTML='<div class="login"><div class="box" style="max-width:460px"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a>'+inner+'</div></div>';}
function toast(t){NX.toast(t);}
function erro(r){if(r&&r.error){toast('Erro: '+r.error.message);return true;}return false;}
function acesso(a,alvo){NXA.acesso(a,alvo,S.emp&&S.emp.id);}

/* ---------- entrada ---------- */
function telaLogin(){
  box('<h1>Portal do Cliente</h1><form id="lf"><label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn b-blue">Entrar</button><p class="help" id="lerr" role="alert" style="color:var(--bad)"></p></form>'+
  '<p class="help"><a href="#" id="esq">Esqueci minha senha</a></p><p class="help">Primeiro acesso? Use o link do convite que chegou no seu e-mail.</p><p class="help" style="font-size:12px"><a href="/privacidade/">Política de Privacidade</a> · <a href="/termos/">Termos de Uso</a></p>');
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var er=document.getElementById('lerr');er.textContent='Entrando…';
    sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value}).then(function(r){if(r.error){er.textContent=/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar: '+r.error.message;return;}iniciar();});};
  document.getElementById('esq').onclick=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim(),er=document.getElementById('lerr');if(!em){er.textContent='Digite seu e-mail acima e clique de novo em "Esqueci minha senha".';return;}
    sb.auth.resetPasswordForEmail(em,{redirectTo:'https://nexioic.com.br/portal/'}).then(function(){er.style.color='var(--ok)';er.textContent='Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.';});};
}
function telaPrimeiroAcesso(recuperacao){
  var precisaAceite=!S.perfil.aceite_versao||S.perfil.aceite_versao!==TERMOS_V;
  box('<h1>'+(recuperacao?'Nova senha':'Bem-vindo(a) ao Portal NEXIO')+'</h1>'+(precisaAceite?'<p class="help" style="font-size:15px;color:var(--ink)">Leia e aceite os documentos abaixo. Eles explicam como protegemos os seus dados e os da sua empresa.</p><p><a href="/termos/" target="_blank" rel="noopener">Termos de Uso (versão '+TERMOS_V+')</a><br><a href="/privacidade/" target="_blank" rel="noopener">Política de Privacidade (versão '+TERMOS_V+')</a></p>':'')+
  '<form id="pf">'+(precisaAceite?'<label style="flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-weight:500"><input type="checkbox" id="pac" required style="width:auto;min-height:auto;margin-top:5px">Li e aceito os Termos de Uso e estou ciente da Política de Privacidade.</label>':'')+
  '<p class="help" style="color:var(--ink)">Crie sua senha: pelo menos 10 caracteres, com letras, números e símbolos.</p><label>Senha<input type="password" id="ps1" minlength="10" required autocomplete="new-password"></label><label>Repita a senha<input type="password" id="ps2" minlength="10" required autocomplete="new-password"></label><button class="btn b-blue">Salvar e entrar</button><p class="help" id="perr" role="alert" style="color:var(--bad)"></p></form>');
  document.getElementById('pf').onsubmit=function(ev){ev.preventDefault();var a=document.getElementById('ps1').value,b=document.getElementById('ps2').value,er=document.getElementById('perr');if(a!==b){er.textContent='As senhas não conferem.';return;}if(a.length<10){er.textContent='Use pelo menos 10 caracteres.';return;}er.textContent='Salvando…';
    sb.auth.updateUser({password:a}).then(function(r){if(r.error){er.textContent='Não foi possível salvar: '+r.error.message;return;}
      var fim=function(){NXA.tipoLink=null;history.replaceState(null,'','/portal/');acesso(recuperacao?'Redefiniu a senha':'Primeiro acesso: criou a senha');iniciar();};
      if(precisaAceite)sb.from('perfis').update({aceite_versao:TERMOS_V,aceite_em:new Date().toISOString()}).eq('id',S.perfil.id).then(function(u){if(u.error){er.textContent='Erro ao registrar o aceite: '+u.error.message;return;}acesso('Aceitou Termos de Uso e Política de Privacidade','versão '+TERMOS_V);fim();});else fim();});};
}
function iniciar(){
  if(!NXA.ok){box('<h1>Portal do Cliente</h1><p class="help" style="font-size:15px;color:var(--ink)">Não foi possível carregar o serviço de login. Verifique sua internet e recarregue a página.</p>');return;}
  if(NXA.erroLink){box('<h1>Link inválido ou expirado</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(NXA.erroLink)+'. Peça um novo convite à NEXIO ou use "Esqueci minha senha".</p><button class="btn b-blue" id="vb">Ir para o login</button>');NXA.erroLink=null;history.replaceState(null,'','/portal/');document.getElementById('vb').onclick=iniciar;return;}
  box('<h1>Portal do Cliente</h1><p class="help">Carregando…</p>');
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(!s){telaLogin();return;}
    NXA.perfil().then(function(p){if(!p){NXA.sair().then(telaLogin);return;}S.perfil=p;
      if(NXA.tipoLink==='recovery'){telaPrimeiroAcesso(true);return;}
      if(NXA.tipoLink==='invite'||NXA.tipoLink==='magiclink'||NXA.tipoLink==='signup'||!p.aceite_versao||p.aceite_versao!==TERMOS_V){telaPrimeiroAcesso(false);return;}
      if(p.tipo==='equipe'){location.replace('/admin/');return;}
      sb.from('empresa_usuarios').select('nivel, empresas(id,razao_social,fantasia,documento)').eq('usuario_id',p.id).then(function(q){if(erro(q))return;
        S.emps=(q.data||[]).filter(function(x){return x.empresas;}).map(function(x){return Object.assign({nivel:x.nivel},x.empresas);});
        if(!S.emps.length){box('<h1>Acesso em liberação</h1><p class="help" style="font-size:15px;color:var(--ink)">Seu usuário foi criado, mas ainda não está ligado a nenhuma empresa. A NEXIO vai liberar em breve.</p><button class="btn b-line" id="sx">Sair</button>');document.getElementById('sx').onclick=sair;return;}
        var salvo=null;try{salvo=sessionStorage.getItem('nx_emp');}catch(x){}
        S.emp=S.emps.filter(function(x){return x.id===salvo;})[0]||(S.emps.length===1?S.emps[0]:null);
        if(!S.emp){escolher();return;}
        entrar();});});});
}
function escolher(){box('<h1>Olá, '+e(S.perfil.nome.split(' ')[0])+'</h1><p class="help">Escolha a empresa:</p>'+S.emps.map(function(x){return '<button class="btn b-line" data-ce="'+x.id+'" style="justify-content:flex-start;text-align:left">'+e(x.fantasia||x.razao_social)+'<small style="display:block;color:var(--muted);font-weight:400">'+NXA.NIVEIS[x.nivel]+'</small></button>';}).join(''));
  root.querySelectorAll('[data-ce]').forEach(function(b){b.onclick=function(){S.emp=S.emps.filter(function(x){return x.id===b.getAttribute('data-ce');})[0];entrar();};});}
function entrar(){try{sessionStorage.setItem('nx_emp',S.emp.id);}catch(x){}acesso('Entrou no portal');carregar().then(function(){if(!location.hash||location.hash.indexOf('access_token')>-1)location.hash='#/inicio';render();});}
function sair(){acesso('Saiu do portal');try{sessionStorage.removeItem('nx_emp');}catch(x){}NXA.sair().then(function(){S={perfil:null,emp:null,emps:[],docs:[],msgs:[],notifs:[],filtro:{setor:'',ano:''}};location.hash='';telaLogin();});}

/* ---------- dados ---------- */
function carregar(){var id=S.emp.id;return Promise.all([
  sb.from('documentos').select('*').eq('empresa_id',id).is('excluido_em',null).order('enviado_em',{ascending:false}),
  sb.from('mensagens').select('*').eq('empresa_id',id).order('em',{ascending:true}),
  sb.from('notificacoes').select('*').eq('empresa_id',id).order('em',{ascending:false}).limit(30)
]).then(function(r){S.docs=r[0].data||[];S.msgs=r[1].data||[];S.notifs=r[2].data||[];});}
function pode(acao){var n=S.emp.nivel;if(acao==='enviar')return ['titular','financeiro','rh'].indexOf(n)>-1;if(acao==='msg')return n!=='consulta';return true;}

/* ---------- layout ---------- */
function route(){return (location.hash.replace('#/','')||'inicio').split('/')[0];}
function head(t,sub){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div></div>';}
function shell(active,html){var naoLidas=S.msgs.filter(function(m){return m.de==='equipe'&&!m.lida;}).length,novos=S.docs.filter(function(d){return d.setor!=='Enviados pelo cliente'&&!d.visto_em;}).length;
  var nav=[['inicio','Início',0],['documentos','Documentos',novos]].concat(pode('enviar')?[['enviar','Enviar documentos',0]]:[]).concat(pode('msg')?[['mensagens','Mensagens',naoLidas]]:[]).concat([['privacidade','Privacidade e meus dados',0]]);
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/inicio"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><div class="role">Portal do cliente</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  '<div class="foot"><span>'+e(S.perfil.nome)+'<br><small style="opacity:.8">'+e(S.emp.fantasia||S.emp.razao_social)+' · '+NXA.NIVEIS[S.emp.nivel]+'</small></span>'+(S.emps.length>1?'<a href="#" id="troca">Trocar de empresa</a>':'')+'<a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();document.getElementById('logout').onclick=function(ev){ev.preventDefault();sair();};
  var t=document.getElementById('troca');if(t)t.onclick=function(ev){ev.preventDefault();try{sessionStorage.removeItem('nx_emp');}catch(x){}S.emp=null;escolher();};}
function render(){if(!S.emp){iniciar();return;}var r=route();({inicio:inicio,documentos:documentos,enviar:enviar,mensagens:mensagens,privacidade:privacidade}[r]||inicio)();}
window.addEventListener('hashchange',function(){if(S.emp)render();});

/* ---------- telas ---------- */
function docRow(d){var guia=d.tipo==='Guia',venc=d.vencimento,late=guia&&venc&&venc<NX.today();
  return '<tr><td><b>'+e(d.titulo)+'</b>'+(!d.visto_em&&d.setor!=='Enviados pelo cliente'?' <span class="tag info">Novo</span>':'')+'<small style="display:block;color:var(--muted)">'+e(d.nome_arquivo||'')+'</small></td><td>'+e(d.setor)+'</td><td>'+(d.competencia?NX.fcomp(d.competencia):'—')+'</td><td'+(late?' class="late"':'')+'>'+(venc?NX.fdate(venc):'—')+'</td><td>'+(d.valor?NX.brl(+d.valor):'—')+'</td><td style="white-space:nowrap">'+NX.fdate(d.enviado_em.slice(0,10))+'</td><td><button class="btn b-line" data-ab="'+d.id+'" style="min-height:38px">Abrir</button></td></tr>';}
function tabelaDocs(l){return l.length?'<div class="tbl"><table><thead><tr><th>Documento</th><th>Setor</th><th>Competência</th><th>Vencimento</th><th>Valor</th><th>Enviado em</th><th><span class="sr">Ações</span></th></tr></thead><tbody>'+l.map(docRow).join('')+'</tbody></table></div>':'<p class="empty">Nenhum documento por aqui ainda.</p>';}
function bindAbrir(){root.querySelectorAll('[data-ab]').forEach(function(b){b.onclick=function(){var d=S.docs.filter(function(x){return x.id===b.getAttribute('data-ab');})[0];var w=window.open('about:blank','_blank');
  sb.storage.from('documentos').createSignedUrl(d.storage_path,300).then(function(r){if(r.error){if(w)w.close();toast('Não foi possível abrir: '+r.error.message);return;}if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl;
    if(!d.visto_em&&d.setor!=='Enviados pelo cliente'){sb.rpc('marcar_visto',{p_doc:d.id});d.visto_em=new Date().toISOString();}acesso('Abriu documento',d.titulo);});};});}
function inicio(){var hoje=NX.today(),guias=S.docs.filter(function(d){return d.tipo==='Guia'&&d.vencimento&&d.vencimento>=hoje;}).sort(function(a,b){return a.vencimento<b.vencimento?-1:1;}),
  novos=S.docs.filter(function(d){return d.setor!=='Enviados pelo cliente'&&!d.visto_em;}),nl=S.msgs.filter(function(m){return m.de==='equipe'&&!m.lida;}).length,av=S.notifs.filter(function(n){return !n.lida;});
  shell('inicio',head('Olá, '+e(S.perfil.nome.split(' ')[0]),e(S.emp.razao_social)+' · CNPJ '+e(NX.fmtDoc?NX.fmtDoc(S.emp.documento):S.emp.documento))+
  '<div class="kpis"><div class="kpi main"><span>Documentos novos</span><strong>'+novos.length+'</strong></div><div class="kpi"><span>Guias a vencer</span><strong>'+guias.length+'</strong></div><div class="kpi"><span>Mensagens não lidas</span><strong>'+nl+'</strong></div></div>'+
  (av.length?'<section class="card"><h2>Avisos</h2>'+av.map(function(n){return '<div class="list-item"><div><b>'+e(n.titulo)+'</b><small>'+e(n.texto||'')+' · '+NX.ftime(n.em)+'</small></div></div>';}).join('')+'<button class="btn b-text" id="lidos">Marcar avisos como lidos</button></section>':'')+
  '<section class="card"><h2>Guias a vencer</h2>'+tabelaDocs(guias.slice(0,8))+'</section><section class="card"><h2>Recebidos recentemente</h2>'+tabelaDocs(S.docs.filter(function(d){return d.setor!=='Enviados pelo cliente';}).slice(0,8))+'</section>');
  bindAbrir();var l=document.getElementById('lidos');if(l)l.onclick=function(){sb.from('notificacoes').update({lida:true}).eq('empresa_id',S.emp.id).eq('lida',false).then(function(){S.notifs.forEach(function(n){n.lida=true;});inicio();});};}
function documentos(){var f=S.filtro,anos={};S.docs.forEach(function(d){var a=(d.competencia||d.enviado_em).slice(0,4);anos[a]=1;});
  var l=S.docs.filter(function(d){return (!f.setor||d.setor===f.setor)&&(!f.ano||(d.competencia||d.enviado_em).slice(0,4)===f.ano);});
  shell('documentos',head('Documentos','Guias, relatórios e documentos enviados pela NEXIO, e o que você nos enviou.')+
  '<section class="card"><div class="row" style="margin-bottom:12px;flex-wrap:wrap"><label>Setor<select id="fs"><option value="">Todos</option>'+NXA.SETORES.map(function(s){return '<option'+(f.setor===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></label><label>Ano<select id="fa"><option value="">Todos</option>'+Object.keys(anos).sort().reverse().map(function(a){return '<option'+(f.ano===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select></label></div>'+tabelaDocs(l)+'</section>');
  document.getElementById('fs').onchange=function(ev){f.setor=ev.target.value;documentos();};document.getElementById('fa').onchange=function(ev){f.ano=ev.target.value;documentos();};bindAbrir();}
function enviar(){if(!pode('enviar')){location.hash='#/inicio';return;}
  shell('enviar',head('Enviar documentos','Extratos, notas, comprovantes e documentos para a contabilidade. Não envie prontuários nem dados clínicos de pacientes.')+
  '<section class="card"><form id="uf" class="grid"><label style="grid-column:1/-1">Arquivos (até 20 MB cada)<input type="file" id="uarq" multiple required></label><label>Do que se trata<select id="utp"><option>Extrato bancário</option><option>Notas fiscais</option><option>Comprovantes de pagamento</option><option>Documentos de funcionário</option><option>Contrato / documento societário</option><option>Outro</option></select></label><label>Competência<input type="month" id="ucp" value="'+NX.shiftMonth(NX.ym(),-1)+'"></label><label style="grid-column:1/-1">Observação (opcional)<input id="uobs"></label><div><button class="btn b-blue">Enviar</button></div><p class="help" id="ust" style="grid-column:1/-1"></p></form></section>'+
  '<section class="card"><h2>Enviados por você</h2>'+tabelaDocs(S.docs.filter(function(d){return d.setor==='Enviados pelo cliente';}))+'</section>');bindAbrir();
  document.getElementById('uf').onsubmit=function(ev){ev.preventDefault();var fs=[].slice.call(document.getElementById('uarq').files),st=document.getElementById('ust'),tp=document.getElementById('utp').value,cp=document.getElementById('ucp').value,obs=document.getElementById('uobs').value;
    if(fs.some(function(x){return x.size>20*1024*1024;})){st.textContent='Algum arquivo passa de 20 MB.';return;}var ok=0;st.textContent='Enviando…';
    (function prox(i){if(i>=fs.length){st.textContent=ok+' arquivo(s) enviado(s).';acesso('Enviou documentos',ok+' arquivo(s)');carregar().then(enviar);toast(ok+' arquivo(s) enviados para a NEXIO.');return;}
      var file=fs[i],path=S.emp.id+'/cliente/'+NXA.uuid()+'-'+NXA.nomeSeguro(file.name);st.textContent='Enviando '+(i+1)+' de '+fs.length+': '+file.name;
      sb.storage.from('documentos').upload(path,file,{contentType:file.type||'application/octet-stream'}).then(function(u){if(u.error){st.textContent='Erro em '+file.name+': '+u.error.message;return;}
        sb.from('documentos').insert({empresa_id:S.emp.id,setor:'Enviados pelo cliente',tipo:tp,titulo:tp+(obs?' — '+obs:''),competencia:cp||null,storage_path:path,nome_arquivo:file.name,tamanho:file.size}).then(function(r){if(r.error){st.textContent='Erro ao registrar '+file.name+': '+r.error.message;return;}ok++;prox(i+1);});});})(0);};}
function mensagens(){if(!pode('msg')){location.hash='#/inicio';return;}
  shell('mensagens',head('Mensagens','Converse com a equipe NEXIO.')+'<section class="card"><div id="thread" style="display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;padding:4px">'+
  (S.msgs.length?S.msgs.map(function(m){var eu=m.de==='cliente';return '<div style="align-self:'+(eu?'flex-end':'flex-start')+';max-width:75%;background:'+(eu?'var(--blue)':'var(--soft)')+';color:'+(eu?'#fff':'var(--ink)')+';padding:10px 14px;border-radius:14px"><div style="white-space:pre-wrap">'+e(m.texto)+'</div><small style="opacity:.75;font-size:11px">'+(eu?'Você':'NEXIO')+' · '+NX.ftime(m.em)+'</small></div>';}).join(''):'<p class="empty">Nenhuma mensagem ainda.</p>')+
  '</div><form id="mf" style="margin-top:12px;display:flex;gap:8px"><label class="sr" for="mt">Mensagem</label><textarea id="mt" required placeholder="Escreva sua mensagem" style="flex:1;min-height:60px"></textarea><button class="btn b-blue">Enviar</button></form></section>');
  var th=document.getElementById('thread');th.scrollTop=th.scrollHeight;
  var nl=S.msgs.filter(function(m){return m.de==='equipe'&&!m.lida;});if(nl.length)sb.from('mensagens').update({lida:true}).in('id',nl.map(function(m){return m.id;})).then(function(){nl.forEach(function(m){m.lida=true;});});
  document.getElementById('mf').onsubmit=function(ev){ev.preventDefault();var t=document.getElementById('mt').value.trim();if(!t)return;sb.from('mensagens').insert({empresa_id:S.emp.id,de:'cliente',texto:t}).then(function(r){if(erro(r))return;acesso('Enviou mensagem');carregar().then(mensagens);});};}
function privacidade(){var p=S.perfil;
  sb.from('lgpd_solicitacoes').select('*').eq('usuario_id',p.id).order('em',{ascending:false}).then(function(q){var R=q.data||[];
  shell('privacidade',head('Privacidade e meus dados','Seus direitos pela LGPD.')+'<section class="card"><p class="help">Você aceitou os <a href="/termos/" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="/privacidade/" target="_blank" rel="noopener">Política de Privacidade</a> (versão '+e(p.aceite_versao||'—')+') em '+(p.aceite_em?NX.ftime(p.aceite_em):'—')+'.</p>'+
  '<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;margin:10px 0"><input type="checkbox" id="pmk" '+(p.marketing?'checked':'')+' style="width:auto;min-height:auto">Receber conteúdos e novidades da NEXIO por e-mail</label>'+
  '<div class="row" style="margin:6px 0 16px"><button class="btn b-line" id="pexp">Baixar meus dados</button></div>'+
  '<form id="lf2" class="grid"><label>Quero solicitar<select id="ltp"><option>Acesso aos meus dados</option><option>Correção de dados</option><option>Exclusão de dados</option><option>Portabilidade</option><option>Informação sobre compartilhamento</option><option>Outro assunto de privacidade</option></select></label><label style="grid-column:1/-1">Detalhes<textarea id="ltx" required></textarea></label><div><button class="btn b-blue">Enviar solicitação</button></div></form><p class="help">Respondemos em até 15 dias. Encarregado: Paulo Ramon Zani Batista · contato@nexioic.com.br</p>'+
