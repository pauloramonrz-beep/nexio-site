<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · NEXIO Inteligência Contábil</title>
<meta name="description" content="Conteúdos da NEXIO Inteligência Contábil sobre impostos, Simples Nacional, MEI, departamento pessoal e gestão para empresas e profissionais.">
<meta property="og:title" content="Blog · NEXIO Inteligência Contábil">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root{--blue:#0740EF;--blue2:#2344AC;--ink:#0E1A45;--muted:#4A5A86;--line:#DDE3F2;--soft:#F4F7FD}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:#F4F7FD}
header{background:#fff;border-bottom:1px solid var(--line)}header .w{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;max-width:1100px;margin:auto;gap:12px;flex-wrap:wrap}
header nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}header nav a{color:var(--blue2);text-decoration:none;font-weight:600;font-size:15px}
header a.bt{background:var(--blue);color:#fff;padding:9px 18px;border-radius:999px}
main{max-width:1100px;margin:auto;padding:36px 24px 80px}
h1{font:700 clamp(30px,5vw,46px)/1.1 'Space Grotesk',Inter,system-ui,sans-serif;color:var(--blue2);margin:0 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 26px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filtros button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Inter,sans-serif;color:var(--blue2);cursor:pointer}.filtros button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
article{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;max-width:820px;margin:auto}
article .capa{aspect-ratio:16/7;background:#2344AC center/cover no-repeat}article .in{padding:28px clamp(18px,4vw,44px) 36px}
article .meta{color:var(--muted);font-size:14px;margin-bottom:18px}article .ct{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.voltar{display:inline-block;margin-bottom:18px;color:var(--blue2);font-weight:600;text-decoration:none}
.cta{margin-top:30px;background:var(--blue2);color:#fff;border-radius:16px;padding:20px 24px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.cta a{background:#fff;color:var(--blue2);padding:10px 18px;border-radius:999px;font-weight:700;text-decoration:none}
.vazio{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
footer{background:var(--ink);color:#C9D2EA;font-size:14px}footer .w{max-width:1100px;margin:auto;padding:22px 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}footer a{color:#fff}
</style>
</head>
<body>
<header><div class="w"><a href="/"><img src="/assets/logo-nexio.png" alt="NEXIO Inteligência Contábil" style="height:46px;display:block"></a>
<nav aria-label="Principal"><a href="/">Início</a><a href="/#planos">Planos</a><a href="/blog/">Blog</a><a class="bt" href="/portal/">Área do cliente</a></nav></div></header>
<main id="app"><p class="lead">Carregando…</p></main>
<footer><div class="w"><span>© NEXIO Inteligência Contábil Ltda · CNPJ 67.828.768/0001-29</span><span><a href="/privacidade/">Privacidade</a> · <a href="/termos/">Termos</a> · <a href="/">nexioic.com.br</a></span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/blog.js"></script>
<script>
(function(){
document.head.insertAdjacentHTML('beforeend','<style>'+NXB.CSS+'</style>');
var app=document.getElementById('app'),e=NXB.esc,cat='';
var sb=window.supabase.createClient('https://pctwjndleohoidikiwcv.supabase.co','sb_publishable_U8jK8tPwRuQ4xQGARUHHWg_UWz8Potv',{auth:{persistSession:false}});
var slug=new URLSearchParams(location.search).get('p');
function erro(){app.innerHTML='<h1>Blog</h1><div class="vazio">Não foi possível carregar os conteúdos agora. Tente novamente em instantes.</div>';}
if(slug){sb.from('posts').select('titulo,slug,resumo,conteudo,categoria,capa,publicado_em,autor_nome').eq('slug',slug).maybeSingle().then(function(r){
  if(r.error)return erro();var p=r.data;if(!p){app.innerHTML='<a class="voltar" href="/blog/">← Todos os conteúdos</a><div class="vazio">Conteúdo não encontrado.</div>';return;}
  document.title=p.titulo+' · Blog NEXIO';var md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',p.resumo||p.titulo);
  app.innerHTML='<a class="voltar" href="/blog/">← Todos os conteúdos</a><article>'+(p.capa?'<div class="capa" style="background-image:url('+p.capa+')"></div>':'')+'<div class="in"><span class="ct">'+e(p.categoria)+'</span><h1>'+e(p.titulo)+'</h1><div class="meta">'+NXB.data(p.publicado_em)+(p.autor_nome?' · por '+e(p.autor_nome):'')+' · '+NXB.tempo(p.conteudo)+'</div><div class="nxb-art">'+NXB.md(p.conteudo)+'</div>'+
  '<div class="cta"><span><b>Quer uma contabilidade simples e 100% digital?</b><br>Conheça os planos da NEXIO.</span><a href="/#planos">Ver planos</a></div></div></article>';});return;}
sb.from('posts').select('titulo,slug,resumo,categoria,capa,publicado_em').order('publicado_em',{ascending:false}).limit(200).then(function(r){
  if(r.error)return erro();var l=r.data||[],cats=[];l.forEach(function(p){if(cats.indexOf(p.categoria)<0)cats.push(p.categoria);});
  var desenha=function(){var v=l.filter(function(p){return !cat||p.categoria===cat;});
    app.innerHTML='<h1>Blog da NEXIO</h1><p class="lead">Impostos, Simples Nacional, MEI, departamento pessoal e gestão — explicados sem complicação.</p>'+
    (cats.length>1?'<div class="filtros"><button data-c="" aria-pressed="'+!cat+'">Todos</button>'+cats.map(function(c){return '<button data-c="'+e(c)+'" aria-pressed="'+(cat===c)+'">'+e(c)+'</button>';}).join('')+'</div>':'')+
    (v.length?'<div class="nxb-grid">'+v.map(function(p){return NXB.card(p,'/blog/?p='+encodeURIComponent(p.slug));}).join('')+'</div>':'<div class="vazio">Em breve, novos conteúdos por aqui.</div>');
    app.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){cat=b.getAttribute('data-c');desenha();};});};
  desenha();});
})();
</script>
</body>
</html>
