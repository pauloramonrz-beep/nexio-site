<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Equipe | NEXIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0740EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
</head>
<body>
<div id="root"></div>
<div class="toast" role="status" id="toast"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/explorer.js"></script>
<script>
(function(){
var db=NX.load(), e=NX.esc, S={sel:null,tab:'arquivos',month:NX.ym(),user:null};
try{S.user=JSON.parse(sessionStorage.getItem('nx_staff')||'null');}catch(x){}if(S.user&&!S.user.real&&!/[?&]demo=1/.test(location.search)&&window.NXA&&NXA.ok)S.user=null;
if(S.user&&S.user.real&&window.NXA&&NXA.ok)NXA.sb.auth.getSession().then(function(r){if(!(r.data&&r.data.session)){S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}render();}});
var root=document.getElementById('root');
function persist(){try{autoNotify();}catch(x){}return NX.save(db);}
function cli(id){return db.clients.filter(function(c){return c.id===id;})[0];}
function unread(cid){return db.messages.filter(function(m){return m.de==='cliente'&&!m.lida&&(!cid||m.cliente===cid);}).length;}
function newDocs(cid){return db.files.filter(function(f){return !f.deleted&&f.de==='cliente'&&!f.visto&&(!cid||f.cliente===cid);}).length;}
function route(){return (location.hash.replace('#/','')||'painel').split('/');}

/* ---------- LOGIN (real, Supabase) ---------- */
var DEMO=/[?&]demo=1/.test(location.search);
function loginBox(inner){root.innerHTML='<div class="login"><div class="box" style="max-width:440px"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a>'+inner+'</div></div>';}
function entrarComPerfil(p){if(!p||p.tipo!=='equipe'||!p.ativo){NXA.sair();loginBox('<h1>Acesso não liberado</h1><p class="help" style="font-size:15px;color:var(--ink)">Seu usuário ainda não tem acesso ao Painel da Equipe. Fale com o Administrador.</p><button class="btn b-blue" onclick="location.href=\'/admin/\'">Voltar</button>');return;}
  NX.ensureUsers(db);var st=db.staff.filter(function(s){return String(s.email).toLowerCase()===String(p.email).toLowerCase();})[0];
  if(!st){st={id:'eq_'+p.id.slice(0,8),nome:p.nome,email:p.email,nivel:p.nivel_eq||'analista',setor:p.setor_eq||'',diretor:p.nivel_eq==='admin'};db.staff.push(st);}else{st.nivel=p.nivel_eq||st.nivel;st.nome=p.nome||st.nome;}
  S.user={id:st.id,nome:st.nome,email:st.email,real:true};NX.log(db,{tipo:'equipe',quem:st.nome,nivel:NX.NIV_EQ[st.nivel].nome,acao:'Entrou no painel (login real)'});persist();NXA.acesso('Entrou no painel');
  try{sessionStorage.setItem('nx_staff',JSON.stringify(S.user));}catch(x){}history.replaceState(null,'','/admin/#/painel');render();}
function telaSenhaNova(tipo){loginBox('<h1>'+(tipo==='recovery'?'Nova senha':'Crie sua senha')+'</h1><p class="help" style="font-size:15px;color:var(--ink)">Use pelo menos 10 caracteres, misturando letras, números e símbolos. Não reutilize senhas de outros serviços.</p><form id="nsf"><label>Nova senha<input type="password" id="ns1" minlength="10" required autocomplete="new-password"></label><label>Repita a senha<input type="password" id="ns2" minlength="10" required autocomplete="new-password"></label><button class="btn b-blue">Salvar senha e entrar</button><p class="help" id="nserr" role="alert" style="color:var(--bad)"></p></form>');
  document.getElementById('nsf').onsubmit=function(ev){ev.preventDefault();var a=document.getElementById('ns1').value,b=document.getElementById('ns2').value,er=document.getElementById('nserr');if(a!==b){er.textContent='As senhas não conferem.';return;}if(a.length<10){er.textContent='Use pelo menos 10 caracteres.';return;}
    er.textContent='Salvando…';NXA.sb.auth.updateUser({password:a}).then(function(r){if(r.error){er.textContent='Não foi possível salvar: '+r.error.message;return;}NXA.acesso(tipo==='recovery'?'Redefiniu a senha':'Criou a senha (convite)');NXA.tipoLink=null;NXA.perfil().then(entrarComPerfil);});};}
function login(){
  if(DEMO){return loginDemo();}
  if(!NXA.ok){loginBox('<h1>Painel da equipe</h1><p class="help" style="font-size:15px;color:var(--ink)">Não foi possível carregar o serviço de login. Verifique sua internet e recarregue a página.</p>');return;}
  if(NXA.erroLink){loginBox('<h1>Link inválido</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(NXA.erroLink)+'. Links de convite e de senha valem por tempo limitado. Peça um novo ou use "Esqueci minha senha".</p><button class="btn b-blue" id="vb">Voltar ao login</button>');NXA.erroLink=null;history.replaceState(null,'','/admin/');document.getElementById('vb').onclick=function(){render();};return;}
  loginBox('<h1>Painel da equipe</h1><p class="help">Carregando…</p>');
  NXA.sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
    if(s&&(NXA.tipoLink==='invite'||NXA.tipoLink==='recovery'||NXA.tipoLink==='signup')){telaSenhaNova(NXA.tipoLink);return;}
    if(s){NXA.perfil().then(entrarComPerfil);return;}
    loginBox('<h1>Painel da equipe</h1><form id="lf"><label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn b-blue" type="submit">Entrar</button><p class="help" id="lerr" role="alert" style="color:var(--bad)"></p></form><p class="help"><a href="#" id="esq">Esqueci minha senha</a></p><p class="help" style="font-size:12px">Acesso restrito à equipe NEXIO. Acessos são registrados. · <a href="/privacidade/">Privacidade</a></p>');
    document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var er=document.getElementById('lerr');er.textContent='Entrando…';
      NXA.sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value}).then(function(r){if(r.error){er.textContent=/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar: '+r.error.message;return;}NXA.perfil().then(entrarComPerfil);});};
    document.getElementById('esq').onclick=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim();if(!em){document.getElementById('lerr').textContent='Digite seu e-mail acima e clique de novo em "Esqueci minha senha".';return;}
      NXA.sb.auth.resetPasswordForEmail(em,{redirectTo:'https://nexioic.com.br/admin/'}).then(function(){document.getElementById('lerr').style.color='var(--ok)';document.getElementById('lerr').textContent='Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.';});};
  });
}

/* ---------- LOGIN DEMONSTRAÇÃO (?demo=1) ---------- */
function loginDemo(){
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><h1>Painel da equipe</h1>'+
  '<label>E-mail<input id="le" type="email" required value="paulo@nexioic.com.br" autocomplete="username"></label>'+
  '<label>Senha<input id="lp" type="password" required value="demo" autocomplete="current-password"></label>'+
  '<button class="btn b-blue" type="submit">Entrar</button><p class="help">Protótipo: qualquer senha entra. Na versão final, cada funcionário terá login próprio.</p></form></div>';
  NX.ensureUsers(db);persist();var box=document.getElementById('lf');var hp=document.createElement('div');hp.innerHTML='<p class="help"><b>Protótipo</b> — entrar como:</p><div class="row">'+db.staff.map(function(s){return '<button type="button" class="btn b-line" data-qs="'+s.email+'" style="min-height:34px;font-size:12px">'+e(s.nome)+' · '+NX.NIV_EQ[s.nivel].nome+'</button>';}).join('')+'</div>';box.appendChild(hp);
  hp.querySelectorAll('[data-qs]').forEach(function(b){b.onclick=function(){document.getElementById('le').value=b.getAttribute('data-qs');box.requestSubmit();};});
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value;var st=db.staff.filter(function(s){return s.email===em;})[0];if(!st){NX.toast('Usuário não encontrado.');return;}S.user={id:st.id,nome:st.nome,email:st.email};NX.log(db,{tipo:'equipe',quem:st.nome,nivel:NX.NIV_EQ[st.nivel].nome,acao:'Entrou no painel'});persist();try{sessionStorage.setItem('nx_staff',JSON.stringify(st));}catch(x){}render();};
}

/* ---------- LAYOUT ---------- */
function shell(active,html){
  var nav=[['painel','Painel',0],['clientes','Clientes',newDocs()],['processos','Processos',0],['contabil','Controle contábil',0],['documentos','Documentos',0],['mensagens','Mensagens',unread()],['comunicacoes','Comunicações',0],['lote','Guias em lote',0],['notificacoes','Notificações',0],['lgpd','Privacidade (LGPD)',(db.lgpd||[]).filter(function(r){return r.status!=='concluida';}).length],['agenda','Agenda da equipe',0],['obrigacoes','Obrigações',0]];
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/painel"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><div class="role">Painel da equipe</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  '<div class="foot"><span>'+e(S.user.nome)+'</span><a href="/portal/" target="_blank" rel="noopener">Ver portal do cliente</a><a href="#" id="reset">Restaurar dados de exemplo</a><a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();logEq('Saiu do painel');persist();if(S.user&&S.user.real)NXA.acesso('Saiu do painel');S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}NXA.sair().then(function(){render();});};
  document.getElementById('reset').onclick=function(ev){ev.preventDefault();if(confirm('Apagar tudo e restaurar os dados de exemplo?')){db=NX.seed();persist();render();NX.toast('Dados de exemplo restaurados.');}};
}
function head(t,sub,right){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="row">'+(right||'')+'<span class="badge-proto">Protótipo</span></div></div>';}

/* ---------- PAINEL ---------- */
function painel(){
  var t=NX.today(),in7=new Date();in7.setDate(in7.getDate()+7);in7=in7.toISOString().slice(0,10);
  var guias=db.files.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';});
  var venc=guias.filter(function(f){return f.venc&&f.venc<t;}), prox=guias.filter(function(f){return f.venc>=t&&f.venc<=in7;});
  var naoVistas=db.files.filter(function(f){return f.de==='equipe'&&!f.visto;}).length;
  var h=head('Olá, '+e(S.user.nome),'Resumo do dia — '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))+
  '<div class="kpis"><a class="kpi main" href="#/clientes"><span>Clientes ativos</span><strong>'+db.clients.length+'</strong></a>'+
  '<a class="kpi" href="#/mensagens"><span>Mensagens não lidas</span><strong>'+unread()+'</strong></a>'+
  '<a class="kpi" href="#/clientes"><span>Documentos novos de clientes</span><strong>'+newDocs()+'</strong></a>'+
  '<div class="kpi"><span>Notas emitidas pelos clientes no mês</span><strong>'+(db.notas||[]).filter(function(n){return n.status==='autorizada'&&n.emissao.slice(0,7)===NX.ym();}).length+'</strong></div>'+
  '<div class="kpi"><span>Guias vencidas sem baixa</span><strong style="color:var(--bad)">'+venc.length+'</strong></div></div>'+
  (function(){ensureProc();var t0=NX.today(),mine=db.tasks.filter(function(t){return t.resp===S.user.id&&t.status!=='ok'&&((t.tipo==='pessoal'?t.data:(t.meta||t.venc))||'9')<=t0;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Minhas tarefas para hoje e atrasadas</h2><a class="btn b-text" href="#/processos" data-ag>Abrir processos</a></div>'+(mine.length?mine.slice(0,6).map(function(t){var c=cli(t.cliente);return '<div class="list-item"><div><b>'+e(t.titulo)+'</b><small>'+(t.tipo==='cliente'?e(c?c.nome:'')+' · vence '+NX.fdate(t.venc):'Tarefa pessoal · '+NX.fdate(t.data))+'</small></div><span class="pill '+stInfo(t.status)[2]+'" style="cursor:default">'+stInfo(t.status)[1]+'</span></div>';}).join(''):'<p class="empty">Nada pendente para hoje.</p>')+'</section>';})()+(function(){ensureAgenda();var hj=db.meetings.filter(function(m){return m.data===NX.today();}).sort(function(x,y){return x.ini<y.ini?-1:1;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Reuniões de hoje</h2><a class="btn b-text" href="#/agenda">Abrir agenda</a></div>'+(hj.length?hj.map(function(m){return '<div class="list-item"><div><b>'+m.ini+'–'+m.fim+' · '+e(m.titulo)+'</b><small>'+m.part.map(function(id){var s=staffBy(id);return s?e(s.nome):'';}).join(', ')+(m.cliente&&cli(m.cliente)?' · Cliente: '+e(cli(m.cliente).nome):'')+'</small></div><span class="tag info">'+e(m.local||'')+'</span></div>';}).join(''):'<p class="empty">Nenhuma reunião hoje.</p>')+'</section>';})()+(function(){var L=[];db.clients.forEach(function(c){(c.licencas||[]).concat(c.cert?[{tipo:'Certificado digital',validade:c.cert.validade}]:[]).forEach(function(l){var s=NX.licStatus(l.validade);if(s.c==='warn'||s.c==='bad')L.push({c:c,l:l,s:s});});});if(!L.length)return '';return '<section class="card" style="margin-bottom:18px;border-left:5px solid var(--bad)"><h2>Licenças e certificados vencendo</h2>'+L.map(function(x){return '<div class="list-item"><div><b>'+e(x.c.nome)+'</b><small>'+e(x.l.tipo)+(x.l.numero?' nº '+e(x.l.numero):'')+' · validade '+NX.fdate(x.l.validade)+'</small></div><div class="row"><span class="tag '+x.s.c+'">'+x.s.t+'</span><a class="btn b-text" href="#/clientes/'+x.c.id+'" data-fic>Abrir ficha</a></div></div>';}).join('')+'</section>';})()+'<div class="cols"><section class="card"><h2>Guias vencendo em 7 dias</h2>'+(prox.length?prox.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(f.titulo)+'</b><small>'+e(c?c.nome:'')+' · vence '+NX.fdate(f.venc)+'</small></div><strong>'+NX.brl(f.valor)+'</strong></div>';}).join(''):'<p class="empty">Nenhuma guia vencendo nos próximos 7 dias.</p>')+'</section>'+
  '<section class="card"><h2>Pendências</h2>'+
  (venc.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(c?c.nome:'')+'</b><small>'+e(f.titulo)+' venceu em '+NX.fdate(f.venc)+' e não foi marcada como paga</small></div><a class="btn b-text" href="#/clientes/'+f.cliente+'">Abrir</a></div>';}).join('')||'')+
  db.clients.filter(function(c){return unread(c.id)||newDocs(c.id);}).map(function(c){return '<div class="list-item"><div><b>'+e(c.nome)+'</b><small>'+(unread(c.id)?unread(c.id)+' mensagem(ns) nova(s) ':'')+(newDocs(c.id)?newDocs(c.id)+' documento(s) enviado(s)':'')+'</small></div><a class="btn b-text" href="#/clientes/'+c.id+'">Abrir</a></div>';}).join('')+
  '<p class="help" style="margin-top:12px">'+naoVistas+' arquivo(s) enviados pela equipe ainda não foram abertos pelos clientes.</p></section></div>';
  shell('painel',h);
}

/* ---------- CLIENTES ---------- */
function clientes(id){
  if(id&&!cli(id))id=null; S.sel=id||S.sel; if(S.sel&&!cli(S.sel))S.sel=null;
  var list='<section class="card" style="flex:1 1 280px;max-width:360px"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Clientes</h2><button class="btn b-blue" id="addc">+ Novo</button></div>'+
  '<label class="sr" for="q">Buscar cliente</label><input id="q" placeholder="Buscar cliente…" style="margin-bottom:10px"><nav class="client-list" id="cl"></nav></section>';
  var det='<section class="card" style="flex:999 1 520px" id="det"></section>';
  shell('clientes',head('Clientes','Envie guias e arquivos, acompanhe obrigações e converse com cada cliente.')+'<div class="cols">'+list+det+'</div>');
  function drawList(q){q=(q||'').toLowerCase();document.getElementById('cl').innerHTML=myClients().filter(function(c){return !q||(c.nome+c.doc).toLowerCase().indexOf(q)>-1;}).map(function(c){var n=unread(c.id)+newDocs(c.id);return '<a href="#/clientes/'+c.id+'"'+(c.id===S.sel?' aria-current="true"':'')+'><span><b>'+e(c.nome)+'</b><small style="display:block;color:var(--muted);font-size:12px">'+e(c.plano)+'</small></span>'+(n?'<span class="tag info">'+n+' novo(s)</span>':'')+'</a>';}).join('')||'<p class="empty">Nenhum cliente.</p>';}
  drawList();document.getElementById('q').oninput=function(ev){drawList(ev.target.value);};
  document.getElementById('addc').onclick=function(){clientDialog();};
  var el=document.getElementById('det');
  if(!S.sel){el.innerHTML='<p class="empty">Selecione um cliente na lista ou cadastre um novo.</p>';return;}
  var c=cli(S.sel);
  var tabs=[['arquivos','Documentos'],['obrigacoes','Obrigações'],['mensagens','Mensagens'+(unread(c.id)?' ('+unread(c.id)+')':'')],['usuarios','Usuários do portal'],['dados','Ficha do cliente']].filter(function(t){return t[0]==='usuarios'?can('clientesEdit'):t[0]==='arquivos'?can('docs'):t[0]==='obrigacoes'?can('obrig'):t[0]==='dados'?can('clientesEdit'):true;});if(!tabs.some(function(t){return t[0]===S.tab;}))S.tab=tabs[0][0];
  el.innerHTML='<div class="row between" style="margin-bottom:12px"><div><h2 style="margin:0">'+e(c.nome)+'</h2><p class="help">'+e(c.doc)+' · '+e(c.plano)+' · '+e(c.resp)+'</p></div></div>'+
  '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div><div id="tabc"></div>';
  el.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){S.tab=b.getAttribute('data-t');clientes(S.sel);};});
  ({arquivos:tabArquivos,obrigacoes:tabObrig,mensagens:tabMsgs,dados:tabFicha,usuarios:tabUsers})[S.tab](c,document.getElementById('tabc'));
}
/* ---------- DOCUMENTOS (espelhado no Onvio Documentos) ---------- */
var SETORES=['Fiscal','Departamento Pessoal','Contábil','Financeiro','Societário','Certidões','Notas fiscais','Enviados pelo cliente','Administrativo (interno)'];
var RESTRITOS=['Administrativo (interno)'];
function setorOf(f){if(f.setor==='__custom')return 'Enviados pelo cliente';if(f.setor)return f.setor;if(f.tipo==='Nota fiscal')return 'Notas fiscais';if(f.de==='cliente')return 'Enviados pelo cliente';
  if(f.tipo==='Folha de pagamento'||/fgts|inss|folha|e-?social|dctfweb|f[ée]rias|rescis|pr[óo]-?labore/i.test(f.titulo))return 'Departamento Pessoal';
  if(/cnd|certid/i.test(f.titulo))return 'Certidões';if(f.tipo==='Contrato')return 'Societário';if(f.tipo==='Relatório')return 'Contábil';if(f.tipo==='Guia')return 'Fiscal';return 'Contábil';}
function compOf(f){return f.comp||(f.criado||NX.today()).slice(0,7);}
function shared(f){return f.shared!=null?f.shared:RESTRITOS.indexOf(setorOf(f))<0;}
function hist(f,ev){f.hist=f.hist||[];f.hist.push({em:new Date().toISOString(),ev:ev,por:S.user?S.user.nome:''});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var ICO_F='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
var ICO_S='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Compartilhado com o cliente" role="img"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var ICO_L='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A5300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Restrito à equipe" role="img"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
S.dv=S.dv||{vis:'todos',q:''};
function liveFiles(cid){return db.files.filter(function(f){return f.cliente===cid&&!f.deleted;});}

function folderLevel(files,F,setores){ // devolve {items:[{key,label,n,extra}], level} ou null quando já está no mês
  function pend(l){var p=l.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';}).length;return p?p+' a pagar':'';}
  if(!F.setor)return setores.map(function(s){var l=files.filter(function(f){return setorOf(f)===s;});return {key:s,label:s,n:l.length,extra:pend(l)};});
  var ls=files.filter(function(f){return setorOf(f)===F.setor;});
  if(!F.ano){var an={};ls.forEach(function(f){an[compOf(f).slice(0,4)]=1;});return Object.keys(an).sort().reverse().map(function(a){var l=ls.filter(function(f){return compOf(f).slice(0,4)===a;});return {key:a,label:a,n:l.length,extra:pend(l)};});}
  if(!F.comp){var out=[];for(var i=12;i>=1;i--){var k=F.ano+'-'+String(i).padStart(2,'0'),l=ls.filter(function(f){return compOf(f)===k;});if(l.length)out.push({key:k,label:MESES[i-1],n:l.length,extra:pend(l)});}return out;}
  return null;}

var ETAPAS=[['docs','Extratos e documentos recebidos'],['concil','Conciliação bancária'],['lanc','Lançamentos contábeis'],['folha','Integração da folha'],['fiscal','Integração fiscal'],['balanc','Balancete conferido'],['revisao','Revisão e fechamento']];

function contabOf(cid,comp){db.contab=db.contab||{};db.contab[cid]=db.contab[cid]||{};return db.contab[cid][comp];}

  if(done===v.length)return {k:'ok',t:'Fechado',c:'#00A36C',fg:'#fff',pct:100};if(v.indexOf('agu')>-1)return {k:'agu',t:'Aguardando cliente',c:'#7B3FE4',fg:'#fff',pct:pct};if(done>0)return {k:'and',t:'Em andamento',c:'#0740EF',fg:'#fff',pct:pct};return {k:'pend',t:'Não iniciado',c:'#EEF1F8',fg:'#4A5A86',pct:0};}

  for(var m=1;m<cur;m++){var k=y+'-'+String(m).padStart(2,'0'),et={};ETAPAS.forEach(function(e2,i){et[e2[0]]=m<cur-2?'ok':(m===cur-2?(i<5?'ok':'pend'):(i===0?'agu':'pend'));});if(m<cur-2)et.folha='ok';db.contab[c.id]=db.contab[c.id]||{};db.contab[c.id][k]={et:et,obs:'',por:'Paulo',em:new Date().toISOString()};}persist();}

function aplica(tp,comp){var m=+comp.slice(5);if(tp.per==='trimestral')return m%3===0;if(tp.per==='anual')return nextMonthNum(comp)===tp.mes;return true;}

function obrigDoCliente(c){if(c.obrig)return db.procT.filter(function(tp){return c.obrig.indexOf(tp.id)>-1;});return db.procT.filter(function(tp){return (tp.planos||[]).indexOf(planoKey(c))>-1;});}

function dayIn(m,d){var last=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return m+'-'+String(Math.min(d,last)).padStart(2,'0');}
function ensureProc(){

    db.procT=catalogoPadrao();db.catV=1;
    gerarDemandas(NX.shiftMonth(NX.ym(),-1),true);gerarDemandas(NX.ym(),true);
    var me=db.staff[0].id,t=NX.today();
    [['Ligar para cliente novo (onboarding)',0,'alta'],['Revisar contratos do mês',1,'media'],['Estudar mudanças da Reforma Tributária',3,'baixa']].forEach(function(x){var d=new Date();d.setDate(d.getDate()+x[1]);db.tasks.push({id:NX.uid(),tipo:'pessoal',owner:me,resp:me,titulo:x[0],data:d.toISOString().slice(0,10),status:'nao',prio:x[2],criado:t});});

function demoProc(){if(db.procDemo)return;db.procDemo=1;var prev=NX.shiftMonth(NX.ym(),-1),i=0,ks=['ok','ok','and','agu','ok','nao','ok'];
  db.tasks.forEach(function(t){if(t.tipo==='cliente'&&t.comp===prev){var k=ks[i%ks.length];t.status=k;if(k==='ok'){var d=new Date();d.setDate(d.getDate()-(i*4)%32);t.concluido=d.toISOString().slice(0,10);if(i%3===0)t.resp=db.staff[i%db.staff.length].id;}i++;}});

function gerarDemandas(comp,silent){var n=0;
  db.clients.forEach(function(c){obrigDoCliente(c).forEach(function(tp){if(!aplica(tp,comp))return;
    if(db.tasks.some(function(t){return t.tipo==='cliente'&&t.cliente===c.id&&t.tpl===tp.id&&t.comp===comp;}))return;
    var vm=nextMonth(comp);db.tasks.push({id:NX.uid(),tipo:'cliente',cliente:c.id,tpl:tp.id,titulo:tp.titulo,setor:tp.setor,comp:comp,meta:dayIn(vm,tp.meta),venc:dayIn(vm,tp.venc),multa:tp.multa,resp:(c.obrigResp&&c.obrigResp[tp.id])||tp.resp,status:'nao',prio:tp.multa?'alta':'media',criado:NX.today(),log:[{em:new Date().toISOString(),ev:'Demanda criada automaticamente',por:'Sistema'}]});n++;});});
  if(!silent){persist();NX.toast(n+' demanda(s) criada(s) para '+NX.fcomp(comp)+'.');}return n;}

  if(U.tab==='eq'){el.innerHTML='<div class="tbl"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Setor</th><th>Carteira de clientes</th><th></th></tr></thead><tbody>'+db.staff.map(function(s){return '<tr><td>'+av(s.id)+' <b>'+e(s.nome)+'</b></td><td>'+e(s.email)+'</td><td><span class="tag info">'+e((NX.NIV_EQ[s.nivel]||{}).nome||'—')+'</span></td><td>'+e(s.setor||'Todos')+'</td><td>'+(s.carteira&&s.carteira.length?s.carteira.length+' cliente(s)':'Todos')+'</td><td><button class="btn b-text" data-eu="'+s.id+'">Editar</button></td></tr>';}).join('')+'</tbody></table></div>';}
  else if(U.tab==='cli'){el.innerHTML='<p class="help" style="margin-bottom:10px">Um mesmo usuário pode ter acesso a <b>várias empresas</b> (multiempresas) e troca entre elas no portal.</p><div class="tbl"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Empresas</th><th></th></tr></thead><tbody>'+(db.cusers||[]).map(function(u){return '<tr><td><b>'+e(u.nome)+'</b></td><td>'+e(u.email)+'</td><td><span class="tag info">'+e((NX.NIV_CLI[u.nivel]||{}).nome||'—')+'</span></td><td style="font-size:13px">'+u.empresas.map(function(id){var c=cli(id);return c?e(c.nome):'';}).filter(Boolean).join('<br>')+(u.empresas.length>1?' <span class="tag ok">Multiempresas</span>':'')+'</td><td><button class="btn b-text" data-cu="'+u.id+'">Editar</button></td></tr>';}).join('')+'</tbody></table></div>';}
  else{el.innerHTML='<div class="cols"><section><h3 style="font-size:16px;color:var(--blue2);margin-bottom:8px">Escritório</h3>'+Object.keys(NX.NIV_EQ).map(function(k){return '<div class="list-item"><div><b>'+NX.NIV_EQ[k].nome+'</b><small>'+NX.NIV_EQ[k].desc+'</small></div></div>';}).join('')+'</section><section><h3 style="font-size:16px;color:var(--blue2);margin-bottom:8px">Clientes</h3>'+Object.keys(NX.NIV_CLI).map(function(k){return '<div class="list-item"><div><b>'+NX.NIV_CLI[k].nome+'</b><small>'+NX.NIV_CLI[k].desc+'</small></div></div>';}).join('')+'</section></div>';}
  document.getElementById('addu').onclick=function(){if(U.tab==='cli')cuserDialog({id:'',nome:'',email:'',senha:'1234',nivel:'titular',empresas:[]});else staffLvlDialog({id:'',nome:'',email:'',nivel:'analista',setor:'',carteira:[],cor:'#0740EF'});};
  el.onclick=function(ev){var id;if(id=ev.target.getAttribute('data-eu'))staffLvlDialog(staffBy(id));if(id=ev.target.getAttribute('data-cu'))cuserDialog(db.cusers.filter(function(u){return u.id===id;})[0]);};
}
function chkList(name,sel){return '<div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px">'+db.clients.map(function(c){return '<label style="flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)"><input type="checkbox" name="'+name+c.id+'" '+(sel.indexOf(c.id)>-1?'checked':'')+' style="width:auto;min-height:auto">'+e(c.nome)+'</label>';}).join('')+'</div>';}
function staffLvlDialog(s){var isNew=!s.id;
  openDlg('<h2>'+(isNew?'Novo usuário do escritório':'Editar '+e(s.nome))+'</h2><div class="grid"><label>Nome<input name="nome" required value="'+e(s.nome)+'"></label><label>E-mail<input name="email" type="email" required value="'+e(s.email)+'"></label>'+
  '<label>Nível<select name="nivel">'+Object.keys(NX.NIV_EQ).map(function(k){return '<option value="'+k+'"'+(s.nivel===k?' selected':'')+'>'+NX.NIV_EQ[k].nome+'</option>';}).join('')+'</select></label>'+
  '<label>Setor<select name="setor"><option value="">Todos</option>'+DEPTO.map(function(d){return '<option'+(s.setor===d?' selected':'')+'>'+d+'</option>';}).join('')+'</select></label></div>'+
  '<p class="help">Carteira de clientes (para Analista e Assistente). Nenhum marcado = todos.</p>'+chkList('k_',s.carteira||[]),
  function(fd){var o=isNew?{id:NX.uid(),cor:'#0740EF',diretor:false,gcal:''}:s;o.nome=fd.get('nome');o.email=fd.get('email');o.nivel=fd.get('nivel');o.setor=fd.get('setor');o.carteira=db.clients.filter(function(c){return fd.get('k_'+c.id);}).map(function(c){return c.id;});
    if(o.id===meStaff().id&&o.nivel!=='admin'&&!db.staff.some(function(x){return x.id!==o.id&&x.nivel==='admin';})){NX.toast('Precisa existir pelo menos um Administrador.');return false;}
    if(isNew)db.staff.push(o);logEq(isNew?'Criou usuário da equipe':'Alterou usuário da equipe',o.nome+' ('+NX.NIV_EQ[o.nivel].nome+')');persist();usuarios();NX.toast('Usuário salvo.');});}
function cuserDialog(u){var isNew=!u.id;
  openDlg('<h2>'+(isNew?'Novo usuário de cliente':'Editar '+e(u.nome))+'</h2><div class="grid"><label>Nome<input name="nome" required value="'+e(u.nome)+'"></label><label>E-mail (login)<input name="email" type="email" required value="'+e(u.email)+'"></label><label>Senha (protótipo)<input name="senha" required value="'+e(u.senha)+'"></label>'+
  '<label>Nível<select name="nivel">'+Object.keys(NX.NIV_CLI).map(function(k){return '<option value="'+k+'"'+(u.nivel===k?' selected':'')+'>'+NX.NIV_CLI[k].nome+'</option>';}).join('')+'</select></label></div><p class="help">Empresas que este usuário acessa (marque várias para multiempresas):</p>'+chkList('e_',u.empresas)+(isNew?'':'<button type="button" class="btn b-danger" id="rmu" style="align-self:flex-start">Remover usuário</button>'),
  function(fd){var emp=db.clients.filter(function(c){return fd.get('e_'+c.id);}).map(function(c){return c.id;});if(!emp.length){NX.toast('Marque pelo menos uma empresa.');return false;}
    var em=String(fd.get('email')).toLowerCase();if(db.cusers.some(function(x){return x.id!==u.id&&x.email.toLowerCase()===em;})){NX.toast('Já existe um usuário com esse e-mail.');return false;}
    var o=isNew?{id:NX.uid()}:u;o.nome=fd.get('nome');o.email=fd.get('email');o.senha=fd.get('senha');o.nivel=fd.get('nivel');o.empresas=emp;if(isNew)db.cusers.push(o);
    logEq(isNew?'Criou usuário de cliente':'Alterou usuário de cliente',o.nome+' ('+NX.NIV_CLI[o.nivel].nome+')',emp[0]);persist();usuarios();NX.toast('Usuário salvo.');});
  var r=document.getElementById('rmu');if(r)r.onclick=function(){if(confirm('Remover o acesso de '+u.nome+'?')){db.cusers=db.cusers.filter(function(x){return x.id!==u.id;});logEq('Removeu usuário de cliente',u.nome);persist();dlg.close();usuarios();}};}

/* ---- Registro de acessos (admin) ---- */
S.ac=S.ac||{tipo:'',q:'',de:''};
function acessos(){var A=S.ac,l=(db.acessos||[]).slice().reverse().filter(function(x){return (!A.tipo||x.tipo===A.tipo)&&(!A.de||x.em.slice(0,10)>=A.de)&&(!A.q||(x.quem+' '+x.acao+' '+x.alvo+' '+((cli(x.cliente)||{}).nome||'')).toLowerCase().indexOf(A.q.toLowerCase())>-1);});
  shell('acessos',head('Registro de acessos','Quem entrou, quando, e o que viu, baixou, enviou ou alterou (equipe e clientes).','<button class="btn b-line" id="csv">Exportar CSV</button>')+
  '<section class="card"><div class="row" style="margin-bottom:14px;align-items:flex-end"><label>Origem<select id="at"><option value="">Todos</option><option value="equipe"'+(A.tipo==='equipe'?' selected':'')+'>Equipe</option><option value="cliente"'+(A.tipo==='cliente'?' selected':'')+'>Clientes</option></select></label><label>A partir de<input type="date" id="ad" value="'+A.de+'"></label><label>Buscar<input id="aq" value="'+e(A.q)+'" placeholder="Usuário, ação, cliente…"></label></div>'+
  '<div class="tbl"><table><thead><tr><th>Data e hora</th><th>Origem</th><th>Usuário</th><th>Ação</th><th>Item</th><th>Cliente</th></tr></thead><tbody>'+(l.length?l.slice(0,300).map(function(x){return '<tr><td style="white-space:nowrap;font-size:13px">'+NX.ftime(x.em)+'</td><td><span class="tag '+(x.tipo==='equipe'?'info':'ok')+'">'+(x.tipo==='equipe'?'Equipe':'Cliente')+'</span></td><td><b>'+e(x.quem)+'</b><small style="display:block;color:var(--muted)">'+e(x.nivel||'')+'</small></td><td>'+e(x.acao)+'</td><td style="font-size:13px">'+e(x.alvo||'')+'</td><td style="font-size:13px">'+e((cli(x.cliente)||{}).nome||'')+'</td></tr>';}).join(''):'<tr><td colspan="6" class="empty">Nenhum registro.</td></tr>')+'</tbody></table></div><p class="help" style="margin-top:8px">'+l.length+' registro(s)'+(l.length>300?' · mostrando os 300 mais recentes':'')+'</p></section>');
  document.getElementById('at').onchange=function(ev){A.tipo=ev.target.value;acessos();};document.getElementById('ad').onchange=function(ev){A.de=ev.target.value;acessos();};
  var q=document.getElementById('aq');q.oninput=function(){A.q=q.value;clearTimeout(q._t);q._t=setTimeout(function(){acessos();var y=document.getElementById('aq');y.focus();y.setSelectionRange(y.value.length,y.value.length);},350);};
  document.getElementById('csv').onclick=function(){var s='Data;Origem;Usuario;Nivel;Acao;Item;Cliente\r\n'+l.map(function(x){return [NX.ftime(x.em),x.tipo,x.quem,x.nivel||'',x.acao,x.alvo||'',(cli(x.cliente)||{}).nome||''].map(function(v){return String(v).replace(/;/g,',');}).join(';');}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+s],{type:'text/csv'}));a.download='registro_acessos.csv';a.click();};}

/* ---------- ROTEADOR ---------- */
function seedFicha(){if(db.fichaV)return;db.fichaV=1;var c=db.clients[0],d=function(n){var x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
  if(c){c.fantasia=c.fantasia||'Clínica Exemplo';c.cnae=c.cnae||'8630-5/03';c.natureza=c.natureza||'LTDA';c.porte=c.porte||'ME';c.cidade=c.cidade||'Manaus/AM';
    c.trib=c.trib||{regime:'SN',anexo:'III',fatorR:true,rbt12:480000,folha12:150000,iss:2,issRet:false,lc116:'04.03',codmun:'',mun:'Manaus/AM',uniprof:false};
    c.insc=c.insc||{im:'123456-7',conselho:'CRM-PJ 9999'};c.licencas=c.licencas||[{tipo:'Alvará de funcionamento',numero:'2026/001',orgao:'Prefeitura',emissao:d(-160),validade:d(205)},{tipo:'Alvará sanitário (Vigilância Sanitária)',numero:'VS-4521',orgao:'Vigilância Sanitária',emissao:d(-345),validade:d(20)},{tipo:'Registro no conselho de classe (CRM/CRO/CREFITO)',numero:'CRM-PJ 9999',orgao:'CRM',emissao:d(-300),validade:d(400)}];
    c.socios=c.socios||[{nome:'Ana Souza',cpf:'123.456.789-09',part:'100',adm:true}];}
  var c2=db.clients[1];if(c2)c2.trib=c2.trib||{regime:'MEI',anexo:'III',fatorR:false,rbt12:0,folha12:0,iss:0,issRet:false,lc116:'',mun:'Manaus/AM'};
  var c3=db.clients[2];if(c3)c3.trib=c3.trib||{regime:'PF',anexo:'III',fatorR:false,rbt12:0,folha12:0,iss:0,lc116:'04.01',mun:'Manaus/AM'};persist();}
document.addEventListener('click',function(ev){if(ev.target.closest&&ev.target.closest('[data-fic]'))S.tab='dados';},true);
function render(){db=NX.load();if(NX.ensureUsers(db))persist();if(purgeLixeira())persist();seedFicha();if(!S.user){login();return;}if(!staffBy(S.user.id)){S.user=null;login();return;}var r=route();if(!navAllowed(r[0]||'painel')&&r[0]){location.hash='#/painel';return;}
  if(r[0]==='usuarios'){usuarios();return;}if(r[0]==='contabil'){contabil();return;}if(r[0]==='lote'){lote();return;}if(r[0]==='lgpd'){lgpd();return;}if(r[0]==='notificacoes'){notificacoes();return;}if(r[0]==='acessos'){acessos();return;}
  if(r[0]==='clientes')clientes(r[1]);else if(r[0]==='mensagens')mensagens();else if(r[0]==='obrigacoes')obrigacoes();else if(r[0]==='agenda')agenda();else if(r[0]==='documentos')documentos();else if(r[0]==='processos')processos();else if(r[0]==='comunicacoes')comunicacoes();else painel();}
window.addEventListener('hashchange',render);
window.NX_onSync=function(){if(!dlg.open&&document.activeElement.tagName!=='INPUT')render();};
render();
})();
</script>
