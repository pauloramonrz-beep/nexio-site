<script>
(function(){
var db=NX.load(), e=NX.esc, S={sel:null,tab:'arquivos',month:NX.ym(),user:null};
try{S.user=JSON.parse(sessionStorage.getItem('nx_staff')||'null');}catch(x){}if(S.user&&!S.user.real&&!/[?&]demo=1/.test(location.search)&&window.NXA&&NXA.ok)S.user=null;if(S.user&&S.user.real){NX.realMode=true;NX.useKey('nexio_real_'+S.user.id);}
if(S.user&&S.user.real&&window.NXA&&NXA.ok)NXA.sb.auth.getSession().then(function(r){if(!(r.data&&r.data.session)){S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}render();}});
var root=document.getElementById('root');
function persist(){try{autoNotify();}catch(x){}return NX.save(db);}
function cli(id){return db.clients.filter(function(c){return c.id===id;})[0];}
function unread(cid){return db.messages.filter(function(m){return m.de==='cliente'&&!m.lida&&(!cid||m.cliente===cid);}).length;}
function newDocs(cid){return db.files.filter(function(f){return !f.deleted&&f.de==='cliente'&&!f.visto&&(!cid||f.cliente===cid);}).length;}
function route(){return (location.hash.replace('#/','')||'painel').split('/');}

/* ---------- LOGIN (real, Supabase) ---------- */
var DEMO=/[?&]demo=1/.test(location.search);
function loginBox(inner){root.innerHTML='<div class="login"><div class="box" style="max-width:440px"><a class="logo" href="/"><img src="/assets/logo-nexio.png" alt="NEXIO Inteligência Contábil" style="height:58px;display:block"></a>'+inner+'</div></div>';}
function entrarComPerfil(p){if(p&&p.tipo==='cliente'){location.replace('/portal/');return;}if(!p||p.tipo!=='equipe'||!p.ativo){NXA.sair();loginBox('<h1>Acesso não liberado</h1><p class="help" style="font-size:15px;color:var(--ink)">Seu usuário ainda não tem acesso ao Painel da Equipe. Fale com o Administrador.</p><button class="btn b-blue" onclick="location.href=\'/admin/\'">Voltar</button>');return;}
  S.user={id:p.id,nome:p.nome,email:p.email,real:true};try{sessionStorage.setItem('nx_staff',JSON.stringify(S.user));}catch(x){}
  NXA.acesso('Entrou no painel');history.replaceState(null,'','/admin/#/painel');abrirReal();}
function abrirReal(){loginBox('<h1>Painel da equipe</h1><p class="help">Carregando dados do escritório…</p>');
  NXS.carregarEquipe().then(function(d){NXS.iniciar('nexio_real_'+S.user.id,d);db=NX.load();
    if(!staffBy(S.user.id)){loginBox('<h1>Acesso não liberado</h1><p class="help">Seu usuário não está ativo na equipe.</p>');return;}
    var novo=!db.procT;ensureProc();if(novo)db.tasks=db.tasks.filter(function(t){return t.tipo==='cliente';});persist();render();
  }).catch(function(err){loginBox('<h1>Erro ao carregar</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(String(err.message||err))+'</p><button class="btn b-blue" onclick="location.reload()">Tentar de novo</button>');});}
window.addEventListener('focus',function(){if(S.user&&S.user.real&&NXS.modo&&!document.querySelector('dialog[open]')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))NXS.atualizar(function(){render();});});
function telaSenhaNova(tipo){loginBox('<h1>'+(tipo==='recovery'?'Nova senha':'Crie sua senha')+'</h1><p class="help" style="font-size:15px;color:var(--ink)">Use pelo menos 8 caracteres. Evite reutilizar senhas de outros serviços.</p><form id="nsf"><label>Nova senha<input type="password" id="ns1" minlength="8" required autocomplete="new-password"></label><label>Repita a senha<input type="password" id="ns2" minlength="8" required autocomplete="new-password"></label><button class="btn b-blue">Salvar senha e entrar</button><p class="help" id="nserr" role="alert" style="color:var(--bad)"></p></form>');
  document.getElementById('nsf').onsubmit=function(ev){ev.preventDefault();var a=document.getElementById('ns1').value,b=document.getElementById('ns2').value,er=document.getElementById('nserr');if(a!==b){er.textContent='As senhas não conferem.';return;}if(a.length<8){er.textContent='Use pelo menos 8 caracteres.';return;}
    er.textContent='Salvando…';NXA.sb.auth.updateUser({password:a}).then(function(r){if(r.error){er.textContent='Não foi possível salvar: '+r.error.message;return;}NXA.acesso(tipo==='recovery'?'Redefiniu a senha':'Criou a senha (convite)');NXA.tipoLink=null;NXA.perfil().then(entrarComPerfil);});};}
function login(){
  if(DEMO){return loginDemo();}
  if(!NXA.ok){loginBox('<h1>Painel da equipe</h1><p class="help" style="font-size:15px;color:var(--ink)">Não foi possível carregar o serviço de login. Verifique sua internet e recarregue a página.</p>');return;}
  if(NXA.erroLink){loginBox('<h1>Link inválido</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(NXA.erroLink)+'. Links de convite e de senha valem por tempo limitado. Peça um novo ou use "Esqueci minha senha".</p><button class="btn b-blue" id="vb">Voltar ao login</button>');NXA.erroLink=null;history.replaceState(null,'','/admin/');document.getElementById('vb').onclick=function(){render();};return;}
  loginBox('<h1>Painel da equipe</h1><p class="help">Carregando…</p>');
  NXA.sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
    if(s&&(NXA.tipoLink==='invite'||NXA.tipoLink==='recovery'||NXA.tipoLink==='signup')){telaSenhaNova(NXA.tipoLink);return;}
    if(s){NXA.perfil().then(entrarComPerfil);return;}
    loginBox('<h1>Painel da equipe</h1><form id="lf"><label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn b-blue" type="submit">Entrar</button><p class="help" id="lerr" role="alert" style="color:var(--bad)"></p></form><p class="help"><a href="#" id="esq">Esqueci minha senha</a></p><p class="help" style="font-size:12px">Acesso restrito à equipe NEXIO. Acessos são registrados. · <a href="/privacidade/">Privacidade</a></p>');
    document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var er=document.getElementById('lerr');er.textContent='Entrando…';
      NXA.sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value}).then(function(r){if(r.error){er.textContent=/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar: '+r.error.message;return;}NXA.perfil().then(entrarComPerfil);});};
    document.getElementById('esq').onclick=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim();if(!em){document.getElementById('lerr').textContent='Digite seu e-mail acima e clique de novo em "Esqueci minha senha".';return;}
      NXA.sb.auth.resetPasswordForEmail(em,{redirectTo:'https://nexioic.com.br/admin/'}).then(function(){document.getElementById('lerr').style.color='var(--ok)';document.getElementById('lerr').textContent='Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.';});};
  });
}

/* ---------- LOGIN DEMONSTRAÇÃO (?demo=1) ---------- */
function loginDemo(){
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><img src="/assets/logo-nexio.png" alt="NEXIO Inteligência Contábil" style="height:58px;display:block"></a><h1>Painel da equipe</h1>'+
  '<label>E-mail<input id="le" type="email" required value="paulo@nexioic.com.br" autocomplete="username"></label>'+
  '<label>Senha<input id="lp" type="password" required value="demo" autocomplete="current-password"></label>'+
  '<button class="btn b-blue" type="submit">Entrar</button><p class="help">Protótipo: qualquer senha entra. Na versão final, cada funcionário terá login próprio.</p></form></div>';
  NX.ensureUsers(db);persist();var box=document.getElementById('lf');var hp=document.createElement('div');hp.innerHTML='<p class="help"><b>Protótipo</b> — entrar como:</p><div class="row">'+db.staff.map(function(s){return '<button type="button" class="btn b-line" data-qs="'+s.email+'" style="min-height:34px;font-size:12px">'+e(s.nome)+' · '+NX.NIV_EQ[s.nivel].nome+'</button>';}).join('')+'</div>';box.appendChild(hp);
  hp.querySelectorAll('[data-qs]').forEach(function(b){b.onclick=function(){document.getElementById('le').value=b.getAttribute('data-qs');box.requestSubmit();};});
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value;var st=db.staff.filter(function(s){return s.email===em;})[0];if(!st){NX.toast('Usuário não encontrado.');return;}S.user={id:st.id,nome:st.nome,email:st.email};NX.log(db,{tipo:'equipe',quem:st.nome,nivel:NX.NIV_EQ[st.nivel].nome,acao:'Entrou no painel'});persist();try{sessionStorage.setItem('nx_staff',JSON.stringify(st));}catch(x){}render();};
}

/* ---------- LAYOUT ---------- */
function shell(active,html){
  var nav=([['painel','Painel',0],['clientes','Clientes',newDocs()],['processos','Processos',0],['contabil','Controle contábil',0],['documentos','Documentos',0],['mensagens','Mensagens',unread()],['comunicacoes','Comunicações',0],['lote','Guias em lote',0],['notificacoes','Notificações',0],['lgpd','Privacidade (LGPD)',(db.lgpd||[]).filter(function(r){return r.status!=='concluida';}).length],['agenda','Agenda da equipe',0],['obrigacoes','Obrigações',0]]);
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/painel"><img src="/assets/logo-nexio-branco.png" alt="NEXIO Inteligência Contábil" style="width:150px;max-width:100%;display:block"></a><div class="role">Painel da equipe</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  '<div class="foot"><span>'+e(S.user.nome)+'</span>'+(S.user.real?'<a href="/portal/" target="_blank" rel="noopener">Abrir portal do cliente</a>':'<a href="/portal/demo/" target="_blank" rel="noopener">Ver portal do cliente (demo)</a><a href="#" id="reset">Restaurar dados de exemplo</a>')+'<a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();logEq('Saiu do painel');persist();if(S.user&&S.user.real)NXA.acesso('Saiu do painel');S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}NXA.sair().then(function(){render();});};
  var rs=document.getElementById('reset');if(rs)rs.onclick=function(ev){ev.preventDefault();if(confirm('Apagar tudo e restaurar os dados de exemplo?')){db=NX.seed();persist();render();NX.toast('Dados de exemplo restaurados.');}};
}
function head(t,sub,right){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="row">'+(right||'')+(S.user&&S.user.real?'':'<span class="badge-proto">Protótipo</span>')+'</div></div>';}

/* ---------- PAINEL ---------- */
function painel(){
  var t=NX.today(),in7=new Date();in7.setDate(in7.getDate()+7);in7=in7.toISOString().slice(0,10);
  var VV=vencidosInfo(),guias=db.files.filter(function(f){return guiaAberta(f);});
  var venc=guias.filter(function(f){return f.venc&&f.venc<t;}), prox=guias.filter(function(f){return f.venc>=t&&f.venc<=in7;});
  var naoVistas=db.files.filter(function(f){return f.de==='equipe'&&!f.visto;}).length;
  var h=head('Olá, '+e(S.user.nome),'Resumo do dia — '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))+
  '<div class="kpis"><a class="kpi main" href="#/clientes"><span>Clientes ativos</span><strong>'+db.clients.length+'</strong></a>'+
  '<a class="kpi" href="#/mensagens"><span>Mensagens não lidas</span><strong>'+unread()+'</strong></a>'+
  '<a class="kpi" href="#/clientes"><span>Documentos novos de clientes</span><strong>'+newDocs()+'</strong></a>'+
  '<div class="kpi"><span>Notas emitidas pelos clientes no mês</span><strong>'+(db.notas||[]).filter(function(n){return n.status==='autorizada'&&n.emissao.slice(0,7)===NX.ym();}).length+'</strong></div>'+
  '<a class="kpi" href="#/documentos"><span>Guias de impostos vencidas</span><strong style="color:var(--bad)">'+venc.length+'</strong><small style="color:var(--muted)">dos clientes · '+prox.length+' vencem em 7 dias</small></a>'+
  '<a class="kpi" href="#/contratos"><span>Honorários em atraso</span><strong style="color:var(--bad)">'+VV.hon.length+'</strong><small style="color:var(--muted)">faturas da NEXIO · '+NX.brl(VV.hon.reduce(function(a,x){return a+(+x.valor||0);},0))+'</small></a>'+
  '<a class="kpi" href="#/licencas"><span>Licenças e certificados vencidos</span><strong style="color:var(--bad)">'+(VV.lic.length+VV.cert.length)+'</strong><small style="color:var(--muted)">'+(VV.licP.length+VV.certP.length)+' vencem em 30 dias</small></a></div>'+
  (function(){ensureProc();var t0=NX.today(),mine=db.tasks.filter(function(t){return t.resp===S.user.id&&t.status!=='ok'&&((t.tipo==='pessoal'?t.data:(t.meta||t.venc))||'9')<=t0;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Minhas tarefas para hoje e atrasadas</h2><a class="btn b-text" href="#/processos" data-ag>Abrir processos</a></div>'+(mine.length?mine.slice(0,6).map(function(t){var c=cli(t.cliente);return '<div class="list-item"><div><b>'+e(t.titulo)+'</b><small>'+(t.tipo==='cliente'?e(c?c.nome:'')+' · vence '+NX.fdate(t.venc):'Tarefa pessoal · '+NX.fdate(t.data))+'</small></div><span class="pill '+stInfo(t.status)[2]+'" style="cursor:default">'+stInfo(t.status)[1]+'</span></div>';}).join(''):'<p class="empty">Nada pendente para hoje.</p>')+'</section>';})()+(function(){ensureAgenda();var hj=db.meetings.filter(function(m){return m.data===NX.today();}).sort(function(x,y){return x.ini<y.ini?-1:1;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Reuniões de hoje</h2><a class="btn b-text" href="#/agenda">Abrir agenda</a></div>'+(hj.length?hj.map(function(m){return '<div class="list-item"><div><b>'+m.ini+'–'+m.fim+' · '+e(m.titulo)+'</b><small>'+m.part.map(function(id){var s=staffBy(id);return s?e(s.nome):'';}).join(', ')+(m.cliente&&cli(m.cliente)?' · Cliente: '+e(cli(m.cliente).nome):'')+'</small></div><span class="tag info">'+e(m.local||'')+'</span></div>';}).join(''):'<p class="empty">Nenhuma reunião hoje.</p>')+'</section>';})()+(function(){var L=[];db.clients.forEach(function(c){(c.licencas||[]).concat(c.cert?[{tipo:'Certificado digital',validade:c.cert.validade}]:[]).forEach(function(l){var s=NX.licStatus(l.validade);if(s.c==='warn'||s.c==='bad')L.push({c:c,l:l,s:s});});});if(!L.length)return '';return '<section class="card" style="margin-bottom:18px;border-left:5px solid var(--bad)"><h2>Licenças e certificados vencendo</h2>'+L.map(function(x){return '<div class="list-item"><div><b>'+e(x.c.nome)+'</b><small>'+e(x.l.tipo)+(x.l.numero?' nº '+e(x.l.numero):'')+' · validade '+NX.fdate(x.l.validade)+'</small></div><div class="row"><span class="tag '+x.s.c+'">'+x.s.t+'</span><a class="btn b-text" href="#/clientes/'+x.c.id+'" data-fic>Abrir ficha</a></div></div>';}).join('')+'</section>';})()+'<div class="cols"><section class="card"><h2>Guias vencendo em 7 dias</h2>'+(prox.length?prox.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(f.titulo)+'</b><small>'+e(c?c.nome:'')+' · vence '+NX.fdate(f.venc)+'</small></div><strong>'+NX.brl(f.valor)+'</strong></div>';}).join(''):'<p class="empty">Nenhuma guia vencendo nos próximos 7 dias.</p>')+'</section>'+
  '<section class="card"><h2>Pendências</h2>'+
  (venc.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b><span class="tag bad">Guia de imposto</span> '+e(c?c.nome:'')+'</b><small>'+e(f.titulo)+' venceu em '+NX.fdate(f.venc)+' e não foi marcada como paga</small></div><a class="btn b-text" href="#/clientes/'+f.cliente+'">Abrir</a></div>';}).join('')||'')+
  VV.hon.map(function(x){var c=cli(x.cliente);return '<div class="list-item"><div><b><span class="tag warn">Honorários</span> '+e(c?c.nome:'')+'</b><small>'+e(x.descricao||'')+' · '+NX.brl(+x.valor||0)+' venceu em '+NX.fdate(x.vencimento)+'</small></div><a class="btn b-text" href="#/contratos">Abrir</a></div>';}).join('')+
  VV.lic.map(function(x){return '<div class="list-item"><div><b><span class="tag bad">Licença</span> '+e(x.c.nome)+'</b><small>'+e(x.l.tipo||'')+(x.l.numero?' nº '+e(x.l.numero):'')+' venceu em '+NX.fdate(x.l.validade)+'</small></div><a class="btn b-text" href="#/licencas">Abrir</a></div>';}).join('')+
  VV.cert.map(function(c){return '<div class="list-item"><div><b><span class="tag bad">Certificado digital</span> '+e(c.nome)+'</b><small>venceu em '+NX.fdate(c.cert.validade)+'</small></div><a class="btn b-text" href="#/licencas">Abrir</a></div>';}).join('')+
  db.clients.filter(function(c){return unread(c.id)||newDocs(c.id);}).map(function(c){return '<div class="list-item"><div><b>'+e(c.nome)+'</b><small>'+(unread(c.id)?unread(c.id)+' mensagem(ns) nova(s) ':'')+(newDocs(c.id)?newDocs(c.id)+' documento(s) enviado(s)':'')+'</small></div><a class="btn b-text" href="#/clientes/'+c.id+'">Abrir</a></div>';}).join('')+
  '<p class="help" style="margin-top:12px">'+naoVistas+' arquivo(s) enviados pela equipe ainda não foram abertos pelos clientes.</p></section></div>';
  shell('painel',h);
}

/* ---------- CLIENTES ---------- */
/* código do cliente (ordem de cadastro) e situação ativo/inativo */
function cliCod(c){return c&&c.codigo?String(c.codigo).padStart(4,'0'):'—';}
function cliAtivo(c){return !c||c.situacaoCad!=='inativo';}
function garantirCodigos(){var sem=db.clients.filter(function(c){return !c.codigo;});if(!sem.length)return false;var mx=db.clients.reduce(function(m,c){return Math.max(m,+c.codigo||0);},0);
  sem.sort(function(a,b){var x=a.criadoEm||a.criado||'',y=b.criadoEm||b.criado||'';return x<y?-1:x>y?1:(a.nome<b.nome?-1:1);}).forEach(function(c){c.codigo=++mx;});return true;}
var CLF={sit:'ativos'};
function clientes(id){
  if(id&&!cli(id))id=null; S.sel=id||S.sel; if(S.sel&&!cli(S.sel))S.sel=null;
  if(can('clientesEdit')&&garantirCodigos())persist();
  var list='<section class="card" style="flex:1 1 280px;max-width:360px"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Clientes</h2><button class="btn b-blue" id="addc">+ Novo</button></div>'+
  '<div class="row" style="gap:6px;margin-bottom:8px;flex-wrap:wrap">'+[['ativos','Ativos'],['inativos','Inativos'],['todos','Todos']].map(function(x){var n=myClients().filter(function(c){return x[0]==='todos'||(x[0]==='ativos')===cliAtivo(c);}).length;return '<button class="btn '+(CLF.sit===x[0]?'b-blue':'b-line')+'" data-clf="'+x[0]+'" style="min-height:32px;padding:3px 10px;font-size:13px">'+x[1]+' ('+n+')</button>';}).join('')+'</div>'+
  '<label class="sr" for="q">Buscar cliente</label><input id="q" placeholder="Buscar por nome, CNPJ ou nº…" style="margin-bottom:10px"><nav class="client-list" id="cl"></nav></section>';

  shell('documentos',head('Documentos','Todos os documentos por cliente, setor, ano e competência.')+'<section class="card"><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-dt="'+t[0]+'" aria-selected="'+(S.dtab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div><div id="dc"></div></section>');
  root.querySelectorAll('[data-dt]').forEach(function(b){b.onclick=function(){S.dtab=b.getAttribute('data-dt');documentos();};});
  var el=document.getElementById('dc');
  if(S.dtab==='cli'){var mc=myClients();if(!mc.some(function(c){return c.id===S.docCli;}))S.docCli=mc[0]&&mc[0].id;
    el.innerHTML='<label style="max-width:420px;margin-bottom:16px">Cliente<select id="dcs">'+mc.map(function(c){return '<option value="'+c.id+'"'+(c.id===S.docCli?' selected':'')+'>'+e(c.nome)+'</option>';}).join('')+'</select></label><div id="dca"></div>';
    document.getElementById('dcs').onchange=function(ev){S.docCli=ev.target.value;documentos();};
    var c=cli(S.docCli);if(c)tabArquivos(c,document.getElementById('dca'),function(){documentos();});}
  else if(S.dtab==='lix'){var del=db.files.filter(function(f){return f.deleted;}).sort(function(a,b){return a.deleted<b.deleted?1:-1;});
    el.innerHTML='<p class="help" style="margin-bottom:10px">Documentos excluídos ficam aqui até serem restaurados ou apagados de vez.</p>'+(del.length?del.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(f.titulo)+'</b><small>'+e(c?c.nome:'—')+' · '+e(setorOf(f))+' · excluído em '+NX.ftime(f.deleted)+'</small></div><div class="row"><button class="btn b-line" data-rs="'+f.id+'">Restaurar</button><button class="btn b-danger" data-px="'+f.id+'">Apagar de vez</button></div></div>';}).join(''):'<p class="empty">Lixeira vazia.</p>');
    el.onclick=function(ev){var t=ev.target,id;if(id=t.getAttribute('data-rs')){db.files.forEach(function(f){if(f.id===id){delete f.deleted;hist(f,'Restaurado da lixeira');}});persist();documentos();NX.toast('Documento restaurado.');}
      if(id=t.getAttribute('data-px')){if(confirm('Apagar de vez? Não dá para desfazer.')){db.files=db.files.filter(function(f){return f.id!==id;});persist();documentos();}}};}
  else{db.office=db.office||[];
    el.innerHTML='<div class="row between" style="margin-bottom:12px"><p class="help" style="margin:0">Modelos, procedimentos e arquivos internos da NEXIO. Não aparecem para os clientes.</p><label class="btn b-blue" style="display:inline-flex;flex-direction:row;color:#fff">Enviar arquivo<input type="file" id="of" style="display:none"></label></div>'+
    (db.office.length?db.office.map(function(f){return '<div class="list-item"><div><b>'+e(f.nome)+'</b><small>'+NX.fsize(f.size)+' · '+e(f.por)+' · '+NX.fdate(f.criado)+'</small></div><div class="row"><button class="btn b-text" data-od="'+f.id+'">Baixar</button><button class="btn b-danger" data-orm="'+f.id+'">Excluir</button></div></div>';}).join(''):'<p class="empty">Nenhum documento do escritório.</p>');
    document.getElementById('of').onchange=function(ev){var file=ev.target.files[0];if(file)NX.readFile(file,function(r){db.office.push({id:NX.uid(),nome:r.nome,data:r.data,size:r.size,por:S.user.nome,criado:NX.today()});if(persist()!==false)documentos();});};
    el.onclick=function(ev){var id;if(id=ev.target.getAttribute('data-od'))NX.download(db.office.filter(function(f){return f.id===id;})[0]);if(id=ev.target.getAttribute('data-orm')){db.office=db.office.filter(function(f){return f.id!==id;});persist();documentos();}};}
}

/* Comunicações: avisos para um, vários ou todos os clientes */
function comunicacoes(){db.avisos=db.avisos||[];var t=NX.today();
  shell('comunicacoes',head('Comunicações','Envie avisos para um, vários ou todos os clientes. Eles aparecem em destaque no portal.','<button class="btn b-blue" id="nav">+ Nova comunicação</button>')+
  '<section class="card"><div class="tbl"><table><thead><tr><th>Assunto</th><th>Destinatários</th><th>Enviado</th><th>Expira</th><th>Lido por</th><th>Status</th><th><span class="sr">Ações</span></th></tr></thead><tbody>'+
  (db.avisos.length?db.avisos.slice().reverse().map(function(a){var dest=a.clientes[0]==='*'?db.clients.map(function(c){return c.id;}):a.clientes,lidos=dest.filter(function(id){return a.lidos&&a.lidos[id];}).length,ativo=!a.expira||a.expira>=t;
    return '<tr><td><b>'+e(a.titulo)+'</b><small style="display:block;color:var(--muted)">'+e(a.texto.slice(0,80))+'</small></td><td>'+(a.clientes[0]==='*'?'Todos os clientes':dest.map(function(id){var c=cli(id);return c?e(c.nome):'';}).join(', '))+'</td><td>'+NX.fdate(a.criado)+'<small style="display:block;color:var(--muted)">'+e(a.por)+'</small></td><td>'+NX.fdate(a.expira)+'</td><td>'+lidos+' de '+dest.length+'</td><td><span class="tag '+(ativo?'ok':'info')+'">'+(ativo?'Ativa':'Expirada')+'</span></td><td><button class="btn b-danger" data-ra="'+a.id+'">Excluir</button></td></tr>';}).join(''):'<tr><td colspan="7" class="empty">Nenhuma comunicação enviada.</td></tr>')+'</tbody></table></div></section>');
  document.getElementById('nav').onclick=function(){openDlg('<h2>Nova comunicação</h2><label>Assunto<input name="titulo" required placeholder="Ex.: Prazo para envio de documentos de dezembro"></label><label>Mensagem<textarea name="texto" required></textarea></label><div class="grid"><label>Enviar para<select name="para" id="apara"><option value="*">Todos os clientes</option><option value="sel">Clientes selecionados</option></select></label><label>Expira em<input name="expira" type="date"></label></div><div id="asel" style="display:none;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px">'+db.clients.map(function(c){return '<label style="flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)"><input type="checkbox" name="c_'+c.id+'" style="width:auto;min-height:auto">'+e(c.nome)+'</label>';}).join('')+'</div>',
    function(fd){var ids=fd.get('para')==='*'?['*']:db.clients.filter(function(c){return fd.get('c_'+c.id);}).map(function(c){return c.id;});if(!ids.length){NX.toast('Selecione ao menos um cliente.');return false;}
      db.avisos.push({id:NX.uid(),titulo:fd.get('titulo'),texto:fd.get('texto'),clientes:ids,criado:NX.today(),expira:fd.get('expira'),por:S.user.nome,lidos:{}});persist();comunicacoes();NX.toast('Comunicação enviada.');});
    document.getElementById('apara').onchange=function(ev){document.getElementById('asel').style.display=ev.target.value==='sel'?'':'none';};};
  root.querySelector('.main').addEventListener('click',function(ev){var id=ev.target.getAttribute('data-ra');if(id&&confirm('Excluir esta comunicação?')){db.avisos=db.avisos.filter(function(a){return a.id!==id;});persist();comunicacoes();}});

function pastaAnexos(cid){db.folders=db.folders||[];var x=db.folders.filter(function(f){return f.cliente===cid&&f.nome==='Anexos das mensagens'&&!f.parent.fid;})[0];if(!x){x={id:NX.uid(),cliente:cid,nome:'Anexos das mensagens',parent:{setor:null,ano:null,comp:null,fid:null},por:S.user.nome,criado:NX.today()};db.folders.push(x);}return x;}

  '<form class="chat-form" id="cf"><label class="sr" for="ct">Mensagem</label><input id="ct" placeholder="Escreva para '+e(c.resp||c.nome)+'…"><div class="chat-tools"><label class="btn b-line" title="Anexar arquivo ou imagem" style="display:inline-flex;flex-direction:row;margin:0">📎<span class="sr">Anexar arquivo ou imagem</span><input type="file" id="cfa" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.xml,.zip" style="display:none"></label><button type="button" class="btn b-line" id="ctk" title="Criar tarefa a partir da conversa">+ Tarefa</button><button class="btn b-blue">Enviar</button></div></form>';

  document.getElementById('cf').onsubmit=function(ev){ev.preventDefault();var t=document.getElementById('ct').value.trim();if(!t)return;db.messages.push({id:NX.uid(),cliente:c.id,de:'equipe',autor:S.user.nome,texto:t,em:new Date().toISOString(),lida:false});persist();after();};
  document.getElementById('cfa').onchange=function(ev){var fs=[].slice.call(ev.target.files),n=0;if(!fs.length)return;var pa=pastaAnexos(c.id),tx=document.getElementById('ct').value.trim();

      hist(f,'Enviado pela equipe na conversa');db.files.push(f);db.messages.push({id:NX.uid(),cliente:c.id,de:'equipe',autor:S.user.nome,texto:(img?'🖼️ ':'📎 ')+r.nome+(tx&&n===0?' — '+tx:''),anexo:{id:f.id,nome:r.nome,img:img},em:new Date().toISOString(),lida:false});
      if(++n===fs.length){logEq('Enviou anexo na conversa',fs.length+' arquivo(s)',c.id);if(persist()!==false){NX.toast(fs.length+' anexo(s) enviado(s). Ficam também em Documentos › Anexos das mensagens.');after();}}});});};
  document.getElementById('ctk').onclick=function(){var t=document.getElementById('ct').value.trim(),ult=ms.filter(function(m){return m.de==='cliente';}).pop(),base=t||(ult?ult.texto:'');
    var v=new Date();v.setDate(v.getDate()+3);taskDialog({tipo:'cliente',cliente:c.id,titulo:base?('Conversa: '+base).slice(0,120):'Retornar ao cliente '+c.nome,comp:NX.ym(),venc:v.toISOString().slice(0,10),status:'nao',prio:'media',resp:S.user.id,owner:S.user.id});};

function snapFicha(c){var T=c.trib||{},I=c.insc||{},o={},L={nome:'Razão social',fantasia:'Nome fantasia',doc:'CNPJ / CPF',abertura:'Data de abertura',natureza:'Natureza jurídica',porte:'Porte',cnae:'CNAE principal',cnaes:'CNAEs secundários',endereco:'Endereço',cidade:'Município / UF',plano:'Plano',resp:'Responsável',email:'E-mail',tel:'Telefone',obsint:'Observações internas'};
  Object.keys(L).forEach(function(k){o[L[k]]=String(c[k]==null?'':c[k]);});

function cnaeFmt(n){n=String(n||'').replace(/\D/g,'');return n.length===7?n.slice(0,4)+'-'+n.slice(4,5)+'/'+n.slice(5):n;}
function buscaCnpj(cnpj){cnpj=String(cnpj||'').replace(/\D/g,'');if(cnpj.length!==14)return Promise.reject(new Error('CNPJ inválido'));
  return fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj).then(function(r){if(!r.ok)throw new Error('CNPJ não encontrado na Receita ('+r.status+')');return r.json();}).then(function(d){
    var nat=String(d.natureza_juridica||''),pt=String(d.porte||'').toUpperCase();
    return {nome:d.razao_social||'',fantasia:d.nome_fantasia||'',abertura:d.data_inicio_atividade||'',cnae:cnaeFmt(d.cnae_fiscal),cnaes:(d.cnaes_secundarios||[]).filter(function(x){return x.codigo;}).map(function(x){return cnaeFmt(x.codigo);}).join(', '),
      endereco:[[d.descricao_tipo_de_logradouro,d.logradouro].filter(Boolean).join(' ')+(d.numero?', '+d.numero:''),d.complemento,d.bairro,d.cep?'CEP '+String(d.cep).replace(/(\d{5})(\d{3})/,'$1-$2'):''].filter(Boolean).join(' - '),
      cidade:(d.municipio||'')+(d.uf?'/'+d.uf:''),ibge:d.codigo_municipio_ibge?String(d.codigo_municipio_ibge):'',email:(d.email||'').toLowerCase(),tel:d.ddd_telefone_1||'',
      porte:/MICRO/.test(pt)?(d.opcao_pelo_mei?'MEI':'ME'):/PEQUENO/.test(pt)?'EPP':pt?'DEMAIS':'',
      natureza:/Unipessoal/i.test(nat)?'SLU':/Limitada/i.test(nat)?'LTDA':/Simples/i.test(nat)?'SS':/An[ôo]nima/i.test(nat)?'SA':/Empres[áa]rio/i.test(nat)?(d.opcao_pelo_mei?'MEI':'EI'):'',
      regime:d.opcao_pelo_mei?'MEI':d.opcao_pelo_simples?'SN':'',situacao:d.descricao_situacao_cadastral||'',
      socios:(d.qsa||[]).map(function(q){return {nome:q.nome_socio||'',cpf:q.cnpj_cpf_do_socio||'',part:'',adm:/administrador/i.test(q.qualificacao_socio||'')};})};});}
function lerDocsTexto(files){return Promise.all(files.map(function(f){return /\.pdf$/i.test(f.name)?lerPdf(f).catch(function(){return '';}):Promise.resolve('');})).then(function(t){return t.join('\n');});}
function extrairCadastro(t){var r={},m;t=String(t||'');
  if(m=t.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/))r.doc=m[0];else if(m=t.match(/\b\d{14}\b/))r.doc=m[0];
  if(m=t.match(/NOME EMPRESARIAL\s*\n?\s*([^\n]{3,120})/i))r.nome=m[1].trim();
  if(m=t.match(/NOME DE FANTASIA\)?\s*\n?\s*([^\n]{2,120})/i))r.fantasia=m[1].trim().replace(/^\*+$/,'');
  return r;}

  var msg=document.getElementById('cdMsg'),put=function(d){Object.keys(d).forEach(function(k){var i=document.getElementById('cd_'+k);if(i&&d[k]&&typeof d[k]!=='object')i.value=d[k];});

  document.getElementById('cdBusca').onclick=busca;
  document.getElementById('cdFiles').onchange=function(ev){var fs=[].slice.call(ev.target.files);if(!fs.length)return;msg.textContent='Lendo '+fs.length+' documento(s)…';

function aplicarFoco(){root.querySelectorAll('.cols').forEach(function(cols){var nav=cols.querySelector('nav.client-list');if(!nav)return;var lista=nav.closest('section,.card'),det=lista&&lista.nextElementSibling;if(!det)return;
  var sel=nav.querySelector('a[aria-current="true"]'),old=det.querySelector('.foco-bar');if(old)old.remove();
  if(!sel){lista.style.display='';return;}
  lista.style.display=S.listaAberta?'':'none';det.style.maxWidth='none';
  var bar=document.createElement('div');bar.className='foco-bar row';bar.style.cssText='margin-bottom:14px;align-items:center;gap:10px';
  var links=[].slice.call(nav.querySelectorAll('a[href]'));
  bar.innerHTML='<button type="button" class="btn b-line" data-foco>'+(S.listaAberta?'Ocultar lista':'☰ Lista de clientes')+'</button><label class="sr" for="fsel">Trocar cliente</label><select id="fsel" style="width:auto;max-width:420px">'+links.map(function(l){var b=l.querySelector('b');return '<option value="'+e(l.getAttribute('href'))+'"'+(l===sel?' selected':'')+'>'+e(b?b.textContent:l.textContent)+'</option>';}).join('')+'</select>';
  det.insertBefore(bar,det.firstChild);

  bar.querySelector('select').onchange=function(ev){location.hash=ev.target.value;};});}
EX.aplicarFoco=aplicarFoco;
root.addEventListener('click',function(ev){if(ev.target.closest&&ev.target.closest('nav.client-list a'))S.listaAberta=false;});
new MutationObserver(function(){clearTimeout(aplicarFoco._t);aplicarFoco._t=setTimeout(function(){var d=root.querySelector('.cols nav.client-list a[aria-current="true"]');var bar=root.querySelector('.foco-bar');if(d&&!bar)aplicarFoco();else if(d&&bar){var l=d.closest('.cols').querySelector('nav.client-list').closest('section,.card');if(l&&(l.style.display==='none')===S.listaAberta)aplicarFoco();}},30);}).observe(root,{childList:true,subtree:true});

function limparDemandas(){if(!db||!db.tasks||!db.clients)return 0;var antes=db.tasks.length,sel={};
  db.clients.forEach(function(c){if(Array.isArray(c.obrig))sel[c.id]=c.obrig;});

  return antes-db.tasks.length;}

/* leitura de transcrições (Google Meet .txt/.sbv, Teams/Zoom .vtt, .srt, texto colado) */
function parseTranscricao(txt){txt=String(txt||'').replace(/\r/g,'');var falas=[];
  txt=txt.replace(/^WEBVTT.*\n/,'');
  var blocos=txt.split(/\n{2,}/);
  blocos.forEach(function(b){var ls=b.split('\n').filter(function(x){return x.trim()&&!/^\d+$/.test(x.trim())&&!/-->|^\d{1,2}:\d{2}(:\d{2})?([.,]\d+)?(,\d{1,2}:\d{2})?/.test(x.trim());});
    ls.forEach(function(x){x=x.trim();var m=x.match(/^<v\s+([^>]+)>(.*?)(<\/v>)?$/);if(m){falas.push({quem:m[1].trim(),texto:m[2].trim()});return;}
      m=x.match(/^([A-ZÀ-Úa-zà-ú][\wÀ-ú .'-]{1,40}?)\s*(\(\d{1,2}:\d{2}(:\d{2})?\))?\s*:\s+(.+)$/);if(m&&!/^(https?|obs|nota)$/i.test(m[1])){falas.push({quem:m[1].trim(),texto:m[4].trim()});return;}
      if(falas.length&&!/[.!?]$/.test(falas[falas.length-1].texto))falas[falas.length-1].texto+=' '+x;else falas.push({quem:'',texto:x});});});
  return falas.filter(function(f){return f.texto;});}
function frases(t){return String(t).split(/(?<=[.!?])\s+/).map(function(s){return s.trim();}).filter(function(s){return s.length>12;});}

      if(/\b(decidid|decidimos|ficou (decidido|definido|acertado|combinado)|fica (decidido|definido|combinado)|aprovad|vamos (seguir|fazer|manter|optar)|combinado)/i.test(s))dec.push(s);
      else if(/\b(vou |vai |fica responsável|ficou responsável|precisa(mos)? (enviar|mandar|fazer|providenciar)|enviar|mandar|providenciar|até (o dia|amanhã|segunda|terça|quarta|quinta|sexta|sábado|semana)|prazo)/i.test(s))pen.push({texto:s,quem:f.quem});});});

    (dec.length||pen.length?'Foram identificadas '+dec.length+' decisão(ões) e '+pen.length+' pendência(s) — revise abaixo.':'Não foram identificadas decisões automaticamente — complete o resumo abaixo.');

  el.innerHTML=['receber','pagar'].map(function(tp){return '<h3 style="margin:0 0 8px">'+(tp==='receber'?'Receitas':'Despesas')+'</h3><div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">'+F.cats[tp].map(function(c,i){return '<span class="tag" style="display:inline-flex;gap:6px;align-items:center">'+e(c)+'<button class="btn b-text" data-cx="'+tp+'|'+i+'" style="padding:0;min-height:0" aria-label="Remover '+e(c)+'">×</button></span>';}).join('')+'</div><div class="row" style="gap:8px;margin-bottom:22px"><input id="cn'+tp+'" placeholder="Nova categoria" style="max-width:260px"><button class="btn b-line" data-ca="'+tp+'">Adicionar</button></div>';}).join('')+
    '<h3 style="margin:8px 0 8px">Recorrências sem data para terminar</h3>'+(F.recs.length?'<div class="tbl"><table><thead><tr><th>Descrição</th><th>Tipo</th><th>Dia</th><th style="text-align:right">Valor</th><th>Desde</th><th>Situação</th><th><span class="sr">Ações</span></th></tr></thead><tbody>'+F.recs.map(function(r){return '<tr><td><b>'+e(r.desc)+'</b><small style="display:block;color:var(--muted)">'+e(r.parte||'')+' · '+e(r.categoria||'')+'</small></td><td>'+(r.tipo==='receber'?'A receber':'A pagar')+'</td><td>'+r.dia+'</td><td style="text-align:right">'+NX.brl(r.valor)+'</td><td>'+NX.fcomp(r.inicio)+'</td><td>'+(r.ativo?'<span class="tag ok">Ativa</span>':'<span class="tag">Encerrada</span>')+'</td><td>'+(r.ativo?'<button class="btn b-text" data-rce="'+r.id+'" style="color:var(--bad)">Encerrar</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div><p class="help">Para mudar o valor ou o dia, edite qualquer conta dessa recorrência e marque "aplicar às próximas".</p>':'<p class="help">Nenhuma. Para criar, lance uma conta e escolha "Todo mês, sem data para terminar" em Repetir.</p>');
  el.querySelectorAll('[data-rce]').forEach(function(b){b.onclick=function(){var r=F.recs.filter(function(x){return x.id===b.getAttribute('data-rce');})[0];if(!r||!confirm('Encerrar a recorrência "'+r.desc+'"? As contas em aberto a partir de hoje serão apagadas e nenhuma nova será gerada. As já pagas ficam.'))return;finEncerrarRec(r.id,finHoje());};});
  el.querySelectorAll('[data-ca]').forEach(function(b){b.onclick=function(){var tp=b.getAttribute('data-ca'),v=document.getElementById('cn'+tp).value.trim();if(!v)return;if(F.cats[tp].indexOf(v)<0)F.cats[tp].push(v);persist();go();};});
  el.querySelectorAll('[data-cx]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-cx').split('|'),c=F.cats[p[0]][+p[1]];if(F.lanc.some(function(l){return l.categoria===c&&!l.excluido;})){NX.toast('Essa categoria tem lançamentos; não dá para remover.');return;}F.cats[p[0]].splice(+p[1],1);persist();go();};});
 });};
NAVOK.financeiro='contratos';
var _shFN=shell;shell=function(active,html){_shFN(active,html);var ref=root.querySelector('.side a.nav[href="#/notas"]')||root.querySelector('.side a.nav[href="#/contratos"]');if(!ref||!navAllowed('financeiro')||root.querySelector('.side a.nav[href="#/financeiro"]'))return;var a=document.createElement('a');a.className='nav';a.href='#/financeiro';a.textContent='Financeiro da NEXIO';if(active==='financeiro')a.setAttribute('aria-current','page');ref.parentNode.insertBefore(a,ref.nextSibling);if(NX.applySide)NX.applySide();};

render();
})();
