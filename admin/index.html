</head>
<body>
<div id="root"></div>
<div class="toast" role="status" id="toast"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
(function(){
var db=NX.load(), e=NX.esc, S={sel:null,tab:'arquivos',month:NX.ym(),user:null};
try{S.user=JSON.parse(sessionStorage.getItem('nx_staff')||'null');}catch(x){}if(S.user&&!S.user.real&&!/[?&]demo=1/.test(location.search)&&window.NXA&&NXA.ok)S.user=null;if(S.user&&S.user.real){NX.realMode=true;NX.useKey('nexio_real_'+S.user.id);}
if(S.user&&S.user.real&&window.NXA&&NXA.ok)NXA.sb.auth.getSession().then(function(r){if(!(r.data&&r.data.session)){S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}render();}});
var root=document.getElementById('root');
function persist(){try{autoNotify();}catch(x){}return NX.save(db);}
function cli(id){return db.clients.filter(function(c){return c.id===id;})[0];}
function unread(cid){return db.messages.filter(function(m){return m.de==='cliente'&&!m.lida&&(!cid||m.cliente===cid);}).length;}
function newDocs(cid){return db.files.filter(function(f){return !f.deleted&&f.de==='cliente'&&!f.visto&&(!cid||f.cliente===cid);}).length;}
function route(){return (location.hash.replace('#/','')||'painel').split('/');}

/* ---------- LOGIN (real, Supabase) ---------- */
var DEMO=/[?&]demo=1/.test(location.search);
function loginBox(inner){root.innerHTML='<div class="login"><div class="box" style="max-width:440px"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a>'+inner+'</div></div>';}
function entrarComPerfil(p){if(p&&p.tipo==='cliente'){location.replace('/portal/');return;}if(!p||p.tipo!=='equipe'||!p.ativo){NXA.sair();loginBox('<h1>Acesso não liberado</h1><p class="help" style="font-size:15px;color:var(--ink)">Seu usuário ainda não tem acesso ao Painel da Equipe. Fale com o Administrador.</p><button class="btn b-blue" onclick="location.href=\'/admin/\'">Voltar</button>');return;}
  S.user={id:p.id,nome:p.nome,email:p.email,real:true};try{sessionStorage.setItem('nx_staff',JSON.stringify(S.user));}catch(x){}
  NXA.acesso('Entrou no painel');history.replaceState(null,'','/admin/#/painel');abrirReal();}
function abrirReal(){loginBox('<h1>Painel da equipe</h1><p class="help">Carregando dados do escritório…</p>');
  NXS.carregarEquipe().then(function(d){NXS.iniciar('nexio_real_'+S.user.id,d);db=NX.load();
    if(!staffBy(S.user.id)){loginBox('<h1>Acesso não liberado</h1><p class="help">Seu usuário não está ativo na equipe.</p>');return;}
    var novo=!db.procT;ensureProc();if(novo)db.tasks=db.tasks.filter(function(t){return t.tipo==='cliente';});persist();render();
  }).catch(function(err){loginBox('<h1>Erro ao carregar</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(String(err.message||err))+'</p><button class="btn b-blue" onclick="location.reload()">Tentar de novo</button>');});}
window.addEventListener('focus',function(){if(S.user&&S.user.real&&NXS.modo&&!document.querySelector('dialog[open]')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))NXS.atualizar(function(){render();});});
function telaSenhaNova(tipo){loginBox('<h1>'+(tipo==='recovery'?'Nova senha':'Crie sua senha')+'</h1><p class="help" style="font-size:15px;color:var(--ink)">Use pelo menos 10 caracteres, misturando letras, números e símbolos. Não reutilize senhas de outros serviços.</p><form id="nsf"><label>Nova senha<input type="password" id="ns1" minlength="10" required autocomplete="new-password"></label><label>Repita a senha<input type="password" id="ns2" minlength="10" required autocomplete="new-password"></label><button class="btn b-blue">Salvar senha e entrar</button><p class="help" id="nserr" role="alert" style="color:var(--bad)"></p></form>');
  document.getElementById('nsf').onsubmit=function(ev){ev.preventDefault();var a=document.getElementById('ns1').value,b=document.getElementById('ns2').value,er=document.getElementById('nserr');if(a!==b){er.textContent='As senhas não conferem.';return;}if(a.length<10){er.textContent='Use pelo menos 10 caracteres.';return;}
    er.textContent='Salvando…';NXA.sb.auth.updateUser({password:a}).then(function(r){if(r.error){er.textContent='Não foi possível salvar: '+r.error.message;return;}NXA.acesso(tipo==='recovery'?'Redefiniu a senha':'Criou a senha (convite)');NXA.tipoLink=null;NXA.perfil().then(entrarComPerfil);});};}
function login(){
  if(DEMO){return loginDemo();}
  if(!NXA.ok){loginBox('<h1>Painel da equipe</h1><p class="help" style="font-size:15px;color:var(--ink)">Não foi possível carregar o serviço de login. Verifique sua internet e recarregue a página.</p>');return;}
  if(NXA.erroLink){loginBox('<h1>Link inválido</h1><p class="help" style="font-size:15px;color:var(--ink)">'+e(NXA.erroLink)+'. Links de convite e de senha valem por tempo limitado. Peça um novo ou use "Esqueci minha senha".</p><button class="btn b-blue" id="vb">Voltar ao login</button>');NXA.erroLink=null;history.replaceState(null,'','/admin/');document.getElementById('vb').onclick=function(){render();};return;}
  loginBox('<h1>Painel da equipe</h1><p class="help">Carregando…</p>');
  NXA.sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
    if(s&&(NXA.tipoLink==='invite'||NXA.tipoLink==='recovery'||NXA.tipoLink==='signup')){telaSenhaNova(NXA.tipoLink);return;}
    if(s){NXA.perfil().then(entrarComPerfil);return;}
    loginBox('<h1>Painel da equipe</h1><form id="lf"><label>E-mail<input id="le" type="email" required autocomplete="username"></label><label>Senha<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn b-blue" type="submit">Entrar</button><p class="help" id="lerr" role="alert" style="color:var(--bad)"></p></form><p class="help"><a href="#" id="esq">Esqueci minha senha</a></p><p class="help" style="font-size:12px">Acesso restrito à equipe NEXIO. Acessos são registrados. · <a href="/privacidade/">Privacidade</a></p>');
    document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var er=document.getElementById('lerr');er.textContent='Entrando…';
      NXA.sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value}).then(function(r){if(r.error){er.textContent=/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar: '+r.error.message;return;}NXA.perfil().then(entrarComPerfil);});};
    document.getElementById('esq').onclick=function(ev){ev.preventDefault();var em=document.getElementById('le').value.trim();if(!em){document.getElementById('lerr').textContent='Digite seu e-mail acima e clique de novo em "Esqueci minha senha".';return;}
      NXA.sb.auth.resetPasswordForEmail(em,{redirectTo:'https://nexioic.com.br/admin/'}).then(function(){document.getElementById('lerr').style.color='var(--ok)';document.getElementById('lerr').textContent='Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.';});};
  });
}

/* ---------- LOGIN DEMONSTRAÇÃO (?demo=1) ---------- */
function loginDemo(){
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><h1>Painel da equipe</h1>'+
  '<label>E-mail<input id="le" type="email" required value="paulo@nexioic.com.br" autocomplete="username"></label>'+
  '<label>Senha<input id="lp" type="password" required value="demo" autocomplete="current-password"></label>'+
  '<button class="btn b-blue" type="submit">Entrar</button><p class="help">Protótipo: qualquer senha entra. Na versão final, cada funcionário terá login próprio.</p></form></div>';
  NX.ensureUsers(db);persist();var box=document.getElementById('lf');var hp=document.createElement('div');hp.innerHTML='<p class="help"><b>Protótipo</b> — entrar como:</p><div class="row">'+db.staff.map(function(s){return '<button type="button" class="btn b-line" data-qs="'+s.email+'" style="min-height:34px;font-size:12px">'+e(s.nome)+' · '+NX.NIV_EQ[s.nivel].nome+'</button>';}).join('')+'</div>';box.appendChild(hp);
  hp.querySelectorAll('[data-qs]').forEach(function(b){b.onclick=function(){document.getElementById('le').value=b.getAttribute('data-qs');box.requestSubmit();};});
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value;var st=db.staff.filter(function(s){return s.email===em;})[0];if(!st){NX.toast('Usuário não encontrado.');return;}S.user={id:st.id,nome:st.nome,email:st.email};NX.log(db,{tipo:'equipe',quem:st.nome,nivel:NX.NIV_EQ[st.nivel].nome,acao:'Entrou no painel'});persist();try{sessionStorage.setItem('nx_staff',JSON.stringify(st));}catch(x){}render();};
}

/* ---------- LAYOUT ---------- */
function shell(active,html){
  var nav=([['painel','Painel',0],['clientes','Clientes',newDocs()],['processos','Processos',0],['contabil','Controle contábil',0],['documentos','Documentos',0],['mensagens','Mensagens',unread()],['comunicacoes','Comunicações',0],['lote','Guias em lote',0],['notificacoes','Notificações',0],['lgpd','Privacidade (LGPD)',(db.lgpd||[]).filter(function(r){return r.status!=='concluida';}).length],['agenda','Agenda da equipe',0],['obrigacoes','Obrigações',0]]);
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/painel"><img src="/assets/logo-nexio-branco.png" alt="NEXIO Inteligência Contábil" style="width:150px;max-width:100%;display:block"></a><div class="role">Painel da equipe</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  '<div class="foot"><span>'+e(S.user.nome)+'</span>'+(S.user.real?'<a href="/portal/" target="_blank" rel="noopener">Abrir portal do cliente</a>':'<a href="/portal/demo/" target="_blank" rel="noopener">Ver portal do cliente (demo)</a><a href="#" id="reset">Restaurar dados de exemplo</a>')+'<a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();logEq('Saiu do painel');persist();if(S.user&&S.user.real)NXA.acesso('Saiu do painel');S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}NXA.sair().then(function(){render();});};
  var rs=document.getElementById('reset');if(rs)rs.onclick=function(ev){ev.preventDefault();if(confirm('Apagar tudo e restaurar os dados de exemplo?')){db=NX.seed();persist();render();NX.toast('Dados de exemplo restaurados.');}};
}
function head(t,sub,right){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="row">'+(right||'')+(S.user&&S.user.real?'':'<span class="badge-proto">Protótipo</span>')+'</div></div>';}

/* ---------- PAINEL ---------- */
function painel(){
  var t=NX.today(),in7=new Date();in7.setDate(in7.getDate()+7);in7=in7.toISOString().slice(0,10);
  var guias=db.files.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';});
  var venc=guias.filter(function(f){return f.venc&&f.venc<t;}), prox=guias.filter(function(f){return f.venc>=t&&f.venc<=in7;});
  var naoVistas=db.files.filter(function(f){return f.de==='equipe'&&!f.visto;}).length;
  var h=head('Olá, '+e(S.user.nome),'Resumo do dia — '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))+
  '<div class="kpis"><a class="kpi main" href="#/clientes"><span>Clientes ativos</span><strong>'+db.clients.length+'</strong></a>'+
  '<a class="kpi" href="#/mensagens"><span>Mensagens não lidas</span><strong>'+unread()+'</strong></a>'+
  '<a class="kpi" href="#/clientes"><span>Documentos novos de clientes</span><strong>'+newDocs()+'</strong></a>'+
  '<div class="kpi"><span>Notas emitidas pelos clientes no mês</span><strong>'+(db.notas||[]).filter(function(n){return n.status==='autorizada'&&n.emissao.slice(0,7)===NX.ym();}).length+'</strong></div>'+
  '<div class="kpi"><span>Guias vencidas sem baixa</span><strong style="color:var(--bad)">'+venc.length+'</strong></div></div>'+
  (function(){ensureProc();var t0=NX.today(),mine=db.tasks.filter(function(t){return t.resp===S.user.id&&t.status!=='ok'&&((t.tipo==='pessoal'?t.data:(t.meta||t.venc))||'9')<=t0;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Minhas tarefas para hoje e atrasadas</h2><a class="btn b-text" href="#/processos" data-ag>Abrir processos</a></div>'+(mine.length?mine.slice(0,6).map(function(t){var c=cli(t.cliente);return '<div class="list-item"><div><b>'+e(t.titulo)+'</b><small>'+(t.tipo==='cliente'?e(c?c.nome:'')+' · vence '+NX.fdate(t.venc):'Tarefa pessoal · '+NX.fdate(t.data))+'</small></div><span class="pill '+stInfo(t.status)[2]+'" style="cursor:default">'+stInfo(t.status)[1]+'</span></div>';}).join(''):'<p class="empty">Nada pendente para hoje.</p>')+'</section>';})()+(function(){ensureAgenda();var hj=db.meetings.filter(function(m){return m.data===NX.today();}).sort(function(x,y){return x.ini<y.ini?-1:1;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Reuniões de hoje</h2><a class="btn b-text" href="#/agenda">Abrir agenda</a></div>'+(hj.length?hj.map(function(m){return '<div class="list-item"><div><b>'+m.ini+'–'+m.fim+' · '+e(m.titulo)+'</b><small>'+m.part.map(function(id){var s=staffBy(id);return s?e(s.nome):'';}).join(', ')+(m.cliente&&cli(m.cliente)?' · Cliente: '+e(cli(m.cliente).nome):'')+'</small></div><span class="tag info">'+e(m.local||'')+'</span></div>';}).join(''):'<p class="empty">Nenhuma reunião hoje.</p>')+'</section>';})()+(function(){var L=[];db.clients.forEach(function(c){(c.licencas||[]).concat(c.cert?[{tipo:'Certificado digital',validade:c.cert.validade}]:[]).forEach(function(l){var s=NX.licStatus(l.validade);if(s.c==='warn'||s.c==='bad')L.push({c:c,l:l,s:s});});});if(!L.length)return '';return '<section class="card" style="margin-bottom:18px;border-left:5px solid var(--bad)"><h2>Licenças e certificados vencendo</h2>'+L.map(function(x){return '<div class="list-item"><div><b>'+e(x.c.nome)+'</b><small>'+e(x.l.tipo)+(x.l.numero?' nº '+e(x.l.numero):'')+' · validade '+NX.fdate(x.l.validade)+'</small></div><div class="row"><span class="tag '+x.s.c+'">'+x.s.t+'</span><a class="btn b-text" href="#/clientes/'+x.c.id+'" data-fic>Abrir ficha</a></div></div>';}).join('')+'</section>';})()+'<div class="cols"><section class="card"><h2>Guias vencendo em 7 dias</h2>'+(prox.length?prox.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(f.titulo)+'</b><small>'+e(c?c.nome:'')+' · vence '+NX.fdate(f.venc)+'</small></div><strong>'+NX.brl(f.valor)+'</strong></div>';}).join(''):'<p class="empty">Nenhuma guia vencendo nos próximos 7 dias.</p>')+'</section>'+
  '<section class="card"><h2>Pendências</h2>'+
  (venc.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(c?c.nome:'')+'</b><small>'+e(f.titulo)+' venceu em '+NX.fdate(f.venc)+' e não foi marcada como paga</small></div><a class="btn b-text" href="#/clientes/'+f.cliente+'">Abrir</a></div>';}).join('')||'')+
  db.clients.filter(function(c){return unread(c.id)||newDocs(c.id);}).map(function(c){return '<div class="list-item"><div><b>'+e(c.nome)+'</b><small>'+(unread(c.id)?unread(c.id)+' mensagem(ns) nova(s) ':'')+(newDocs(c.id)?newDocs(c.id)+' documento(s) enviado(s)':'')+'</small></div><a class="btn b-text" href="#/clientes/'+c.id+'">Abrir</a></div>';}).join('')+
  '<p class="help" style="margin-top:12px">'+naoVistas+' arquivo(s) enviados pela equipe ainda não foram abertos pelos clientes.</p></section></div>';
  shell('painel',h);
}

/* ---------- CLIENTES ---------- */
function clientes(id){
  if(id&&!cli(id))id=null; S.sel=id||S.sel; if(S.sel&&!cli(S.sel))S.sel=null;
  var list='<section class="card" style="flex:1 1 280px;max-width:360px"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Clientes</h2><button class="btn b-blue" id="addc">+ Novo</button></div>'+
  '<label class="sr" for="q">Buscar cliente</label><input id="q" placeholder="Buscar cliente…" style="margin-bottom:10px"><nav class="client-list" id="cl"></nav></section>';
  var det='<section class="card" style="flex:999 1 520px" id="det"></section>';
  shell('clientes',head('Clientes','Ficha cadastral, usuários do portal e obrigações de cada cliente.')+'<div class="cols">'+list+det+'</div>');
  function drawList(q){q=(q||'').toLowerCase();document.getElementById('cl').innerHTML=myClients().filter(function(c){return !q||(c.nome+c.doc).toLowerCase().indexOf(q)>-1;}).map(function(c){var n=unread(c.id)+newDocs(c.id);return '<a href="#/clientes/'+c.id+'"'+(c.id===S.sel?' aria-current="true"':'')+'><span><b>'+e(c.nome)+'</b><small style="display:block;color:var(--muted);font-size:12px">'+e(c.plano)+'</small></span>'+(n?'<span class="tag info">'+n+' novo(s)</span>':'')+'</a>';}).join('')||'<p class="empty">Nenhum cliente.</p>';}
  drawList();document.getElementById('q').oninput=function(ev){drawList(ev.target.value);};
  document.getElementById('addc').onclick=function(){clientDialog();};
  var el=document.getElementById('det');
  if(!S.sel){el.innerHTML='<p class="empty">Selecione um cliente na lista ou cadastre um novo.</p>';return;}
  var c=cli(S.sel);
  var tabs=[['dados','Ficha do cliente'],['usuarios','Usuários do cliente'],['obrigacoes','Seleção de obrigações']].filter(function(t){return t[0]==='usuarios'?can('clientesEdit'):t[0]==='arquivos'?can('docs'):t[0]==='obrigacoes'?can('obrig'):t[0]==='dados'?can('clientesEdit'):true;});if(!tabs.some(function(t){return t[0]===S.tab;}))S.tab=tabs[0][0];
  el.innerHTML='<div class="row between" style="margin-bottom:12px"><div><h2 style="margin:0">'+e(c.nome)+'</h2><p class="help">'+e(c.doc)+' · '+e(c.plano)+' · '+e(c.resp)+'</p></div></div>'+
  '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div><div id="tabc"></div>';
  el.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){S.tab=b.getAttribute('data-t');clientes(S.sel);};});
  ({arquivos:tabArquivos,obrigacoes:tabObrig,mensagens:tabMsgs,dados:tabFicha,usuarios:(S.user&&S.user.real)?function(c,el){rUsuarios({id:c.id,razao_social:c.nome},el);}:tabUsers})[S.tab](c,document.getElementById('tabc'));
}
/* ---------- DOCUMENTOS (espelhado no Onvio Documentos) ---------- */
var SETORES=['Fiscal','Departamento Pessoal','Contábil','Financeiro','Societário','Certidões','Notas fiscais','Enviados pelo cliente','Administrativo (interno)'];
var RESTRITOS=['Administrativo (interno)'];
function setorOf(f){if(f.setor==='__custom')return 'Enviados pelo cliente';if(f.setor)return f.setor;if(f.tipo==='Nota fiscal')return 'Notas fiscais';if(f.de==='cliente')return 'Enviados pelo cliente';
  if(f.tipo==='Folha de pagamento'||/fgts|inss|folha|e-?social|dctfweb|f[ée]rias|rescis|pr[óo]-?labore/i.test(f.titulo))return 'Departamento Pessoal';
  if(/cnd|certid/i.test(f.titulo))return 'Certidões';if(f.tipo==='Contrato')return 'Societário';if(f.tipo==='Relatório')return 'Contábil';if(f.tipo==='Guia')return 'Fiscal';return 'Contábil';}
function compOf(f){return f.comp||(f.criado||NX.today()).slice(0,7);}
function shared(f){return f.shared!=null?f.shared:RESTRITOS.indexOf(setorOf(f))<0;}
function hist(f,ev){f.hist=f.hist||[];f.hist.push({em:new Date().toISOString(),ev:ev,por:S.user?S.user.nome:''});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var ICO_F='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

function folderLevel(files,F,setores){ // devolve {items:[{key,label,n,extra}], level} ou null quando já está no mês
  function pend(l){var p=l.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';}).length;return p?p+' a pagar':'';}
  if(!F.setor)return setores.map(function(s){var l=files.filter(function(f){return setorOf(f)===s;});return {key:s,label:s,n:l.length,extra:pend(l)};});
  var ls=files.filter(function(f){return setorOf(f)===F.setor;});
  if(!F.ano){var an={};ls.forEach(function(f){an[compOf(f).slice(0,4)]=1;});return Object.keys(an).sort().reverse().map(function(a){var l=ls.filter(function(f){return compOf(f).slice(0,4)===a;});return {key:a,label:a,n:l.length,extra:pend(l)};});}
  if(!F.comp){var out=[];for(var i=12;i>=1;i--){var k=F.ano+'-'+String(i).padStart(2,'0'),l=ls.filter(function(f){return compOf(f)===k;});if(l.length)out.push({key:k,label:MESES[i-1],n:l.length,extra:pend(l)});}return out;}
  return null;}
function folderCards(items){return items.length?'<div class="folders">'+items.map(function(it){return '<button class="fold" data-go="'+e(it.key)+'"><span class="fi">'+FICO+'</span><span><b>'+e(it.label)+'</b><small>'+it.n+' documento(s)'+(it.extra?' · '+it.extra:'')+'</small></span></button>';}).join('')+'</div>':'<p class="empty">Pasta vazia.</p>';}

  return '<nav class="crumbs" aria-label="Caminho">'+c.map(function(k,i){return i===c.length-1?'<b>'+e(k[1])+'</b>':'<button data-cr="'+k[0]+'">'+e(k[1])+'</button><span aria-hidden="true">›</span>';}).join('')+'</nav>';}

  db.tasks.forEach(function(t){if(hit||t.tipo!=='cliente'||t.cliente!==f.cliente||t.status==='ok')return;var tp=db.procT.filter(function(x){return x.id===t.tpl;})[0];
    var okName=tp&&tp.match&&new RegExp(tp.match,'i').test(name);if(okName&&(t.comp===f.comp||!f.comp))hit=t;});
  if(hit){hit.doc=f.id;setStatus(hit,'ok','documento “'+f.titulo+'” enviado');persist();NX.toast('Demanda “'+hit.titulo+'” concluída automaticamente.');}}

function parseTranscricao(txt){txt=String(txt||'').replace(/\r/g,'');var falas=[];
  txt=txt.replace(/^WEBVTT.*\n/,'');
  var blocos=txt.split(/\n{2,}/);

    ls.forEach(function(x){x=x.trim();var m=x.match(/^<v\s+([^>]+)>(.*?)(<\/v>)?$/);if(m){falas.push({quem:m[1].trim(),texto:m[2].trim()});return;}

      if(falas.length&&!/[.!?]$/.test(falas[falas.length-1].texto))falas[falas.length-1].texto+=' '+x;else falas.push({quem:'',texto:x});});});

  '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn b-blue" id="rger">Gerar rascunho da ata</button><button class="btn b-line" id="ria" title="Copia um pedido pronto com a transcrição para colar no Claude">Copiar pedido para o Claude</button><button class="btn b-text" id="rsvt">Salvar</button></div></section>'+
  '<section class="card" style="flex:1 1 460px" id="rata"></section></div>');
  var g=function(id){return document.getElementById(id);};
  var guardar=function(){m.pauta=g('rpauta').value;m.convidados=g('rconv').value;m.transcricao=g('rtrans').value;};
  g('edm').onclick=function(){meetingDialog(m);};
  g('rsvt').onclick=function(){guardar();persist();NX.toast('Salvo.');};
  g('rfile').onchange=function(ev){var f=ev.target.files[0];if(!f)return;
    if(/\.docx$/i.test(f.name)){lerDocx(f).then(function(t){g('rtrans').value=t;guardar();persist();NX.toast('Transcrição anexada.');}).catch(function(){NX.toast('Não consegui ler esse .docx. Abra-o e cole o texto aqui.');});return;}
    var r=new FileReader();r.onload=function(){g('rtrans').value=r.result;guardar();persist();NX.toast('Transcrição anexada.');};r.readAsText(f,'utf-8');};
  g('rger').onclick=function(){guardar();if(!m.transcricao.trim()&&!confirm('Não há transcrição. Gerar uma ata em branco para preencher?'))return;
    if(m.ata&&!confirm('Substituir o rascunho atual da ata?'))return;m.ata=rascunho(m);persist();ata(m);NX.toast('Rascunho gerado. Revise antes de finalizar.');};
  g('ria').onclick=function(){guardar();persist();navigator.clipboard.writeText(pedidoIA(m)).then(function(){NX.toast('Pedido copiado. Cole numa conversa com o Claude e depois traga o resultado para os campos da ata.');});};
  var el=g('rata');
  if(!A){el.innerHTML='<h2>2. Ata</h2><p class="empty">Anexe ou cole a transcrição e clique em “Gerar rascunho da ata”.</p>';return;}
  el.innerHTML='<div class="row between"><h2 style="margin:0">2. Ata</h2>'+(A.status==='final'?'<span class="tag ok">Final</span>':'<span class="tag warn">Rascunho</span>')+'</div>'+
  '<label style="margin-top:10px">Participantes<input id="ap" value="'+e(A.participantes||'')+'"></label>'+
  '<label style="margin-top:10px">Resumo<textarea id="ar" rows="7">'+e(A.resumo||'')+'</textarea></label>'+
  '<label style="margin-top:10px">Decisões (uma por linha)<textarea id="ad" rows="5">'+e(A.decisoes||'')+'</textarea></label>'+
  '<h3 style="font-size:15px;color:var(--blue2);margin-top:14px">Pendências</h3><div id="apl">'+(A.pendencias||[]).map(function(p,i){return '<div class="row" style="align-items:center;gap:6px;margin-bottom:6px;flex-wrap:nowrap"><input data-pt="'+i+'" value="'+e(p.texto)+'" style="flex:1"><select data-pr="'+i+'" style="width:auto"><option value="">Cliente</option>'+db.staff.map(function(s){return '<option value="'+s.id+'"'+(p.resp===s.id?' selected':'')+'>'+e(s.nome.split(' ')[0])+'</option>';}).join('')+'</select><input type="date" data-pd="'+i+'" value="'+(p.prazo||'')+'" style="width:auto">'+(p.tarefa?'<span class="tag ok" title="Demanda criada">✓</span>':'')+'<button class="btn b-text" data-px="'+i+'" aria-label="Remover">×</button></div>';}).join('')+'</div>'+
  '<button class="btn b-text" id="apa" style="padding:0">+ Pendência</button>'+
  '<div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn b-blue" id="asv">Salvar ata</button><button class="btn b-line" id="atk">Criar demandas das pendências</button><button class="btn b-line" id="apdf">PDF</button>'+(c?'<button class="btn b-line" id="acli">Enviar ao cliente pelo portal</button>':'')+'<button class="btn b-line" id="afin">'+(A.status==='final'?'Reabrir':'Finalizar ata')+'</button></div>';
  var ler=function(){A.participantes=g('ap').value;A.resumo=g('ar').value;A.decisoes=g('ad').value;
    A.pendencias=A.pendencias.map(function(p,i){return {texto:el.querySelector('[data-pt="'+i+'"]').value,resp:el.querySelector('[data-pr="'+i+'"]').value,prazo:el.querySelector('[data-pd="'+i+'"]').value,tarefa:p.tarefa};}).filter(function(p){return p.texto.trim();});};
  el.querySelectorAll('[data-px]').forEach(function(b){b.onclick=function(){ler();A.pendencias.splice(+b.getAttribute('data-px'),1);persist();ata(m);};});
  g('apa').onclick=function(){ler();A.pendencias.push({texto:'',resp:S.user.id,prazo:'',tarefa:''});persist();ata(m);};
  g('asv').onclick=function(){ler();persist();NX.toast('Ata salva.');ata(m);};
  g('afin').onclick=function(){ler();A.status=A.status==='final'?'rascunho':'final';if(A.status==='final')A.finalizada={em:new Date().toISOString(),por:S.user.nome};persist();ata(m);};
  g('atk').onclick=function(){ler();var n=0;A.pendencias.forEach(function(p){if(p.tarefa||!p.resp)return;var id=NX.uid();
      db.tasks.push({id:id,tipo:'pessoal',titulo:p.texto.slice(0,140),data:p.prazo||NX.today(),resp:p.resp,owner:p.resp,status:'nao',prio:'media',cliente:m.cliente||'',origem:'Ata: '+m.titulo,criado:NX.today(),log:[{em:new Date().toISOString(),ev:'Criada a partir da ata de '+fd(m.data),por:S.user.nome}]});p.tarefa=id;n++;});
    persist();ata(m);NX.toast(n?n+' demanda(s) criada(s) na agenda dos responsáveis.':'Nenhuma pendência nova com responsável da equipe.');};
  g('apdf').onclick=function(){ler();persist();imprimir('Ata — '+m.titulo,ataHTML(m));};
  var ac=g('acli');if(ac)ac.onclick=function(){ler();persist();if(!confirm('Enviar o resumo, as decisões e as pendências desta ata ao cliente pelo portal?'))return;
    db.messages.push({id:NX.uid(),cliente:m.cliente,de:'equipe',autor:S.user.nome,texto:'Ata da reunião “'+m.titulo+'” ('+fd(m.data)+')\n\n'+A.resumo+(A.decisoes?'\n\nDecisões:\n- '+A.decisoes.split('\n').filter(Boolean).join('\n- '):'')+(A.pendencias.length?'\n\nPendências:\n- '+A.pendencias.map(function(p){return p.texto+' — '+(p.resp?(staffBy(p.resp)||{}).nome:'Cliente')+(p.prazo?' até '+fd(p.prazo):'');}).join('\n- '):''),em:new Date().toISOString(),lida:false});
    persist();NX.toast('Ata enviada ao cliente em Mensagens.');};
}
function ataHTML(m){var A=m.ata,c=m.cliente?cli(m.cliente):null;
  return '<h1>ATA DE REUNIÃO — '+e(m.titulo)+'</h1><p><b>Data:</b> '+fd(m.data)+' · <b>Horário:</b> '+m.ini+' às '+m.fim+'<br><b>'+(c?'Cliente:</b> '+e(c.nome):'Tipo:</b> reunião interna')+(m.local?'<br><b>Local:</b> '+e(m.local):'')+'<br><b>Participantes:</b> '+e(A.participantes||'')+'</p>'+
  (m.pauta?'<h2>Pauta</h2><pre>'+e(m.pauta)+'</pre>':'')+'<h2>Resumo</h2><pre>'+e(A.resumo||'')+'</pre>'+
  (A.decisoes?'<h2>Decisões</h2><ul>'+A.decisoes.split('\n').filter(Boolean).map(function(d){return '<li>'+e(d)+'</li>';}).join('')+'</ul>':'')+
  (A.pendencias.length?'<h2>Pendências</h2><table><tr><th>Ação</th><th>Responsável</th><th>Prazo</th></tr>'+A.pendencias.map(function(p){return '<tr><td>'+e(p.texto)+'</td><td>'+e(p.resp?(staffBy(p.resp)||{}).nome:'Cliente')+'</td><td>'+(p.prazo?fd(p.prazo):'—')+'</td></tr>';}).join('')+'</table>':'')+
  (A.finalizada?'<p style="margin-top:24px;color:#555">Ata finalizada por '+e(A.finalizada.por)+' em '+new Date(A.finalizada.em).toLocaleString('pt-BR')+'.</p>':'');}
/* .docx sem bibliotecas: descompacta word/document.xml (deflate) */
function lerDocx(file){return file.arrayBuffer().then(function(buf){var v=new DataView(buf),u8=new Uint8Array(buf),eo=-1;
  for(var j=u8.length-22;j>=0&&j>u8.length-70000;j--){if(v.getUint32(j,true)===0x06054b50){eo=j;break;}}if(eo<0)throw new Error('docx');
  var n=v.getUint16(eo+10,true),p=v.getUint32(eo+16,true);
  for(var k=0;k<n;k++){if(v.getUint32(p,true)!==0x02014b50)break;var met=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true),nome=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    if(nome==='word/document.xml'){var ini=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),dados=u8.subarray(ini,ini+cs);
      var st=met===8?new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw')):new Blob([dados]).stream();
      return new Response(st).text().then(function(x){return x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'");});}
    p+=46+nl+xl+cl;}
  throw new Error('docx');});}

render();
})();
</script>
