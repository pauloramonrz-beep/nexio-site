<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Equipe | NEXIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0740EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
</head>
<body>
<div id="root"></div>
<div class="toast" role="status" id="toast"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="/assets/store.js"></script>
<script src="/assets/explorer.js"></script>
<script>
(function(){
var db=NX.load(), e=NX.esc, S={sel:null,tab:'arquivos',month:NX.ym(),user:null};
try{S.user=JSON.parse(sessionStorage.getItem('nx_staff')||'null');}catch(x){}
var root=document.getElementById('root');
function persist(){NX.save(db);}
function cli(id){return db.clients.filter(function(c){return c.id===id;})[0];}
function unread(cid){return db.messages.filter(function(m){return m.de==='cliente'&&!m.lida&&(!cid||m.cliente===cid);}).length;}
function newDocs(cid){return db.files.filter(function(f){return !f.deleted&&f.de==='cliente'&&!f.visto&&(!cid||f.cliente===cid);}).length;}
function route(){return (location.hash.replace('#/','')||'painel').split('/');}

/* ---------- LOGIN ---------- */
function login(){
  root.innerHTML='<div class="login"><form class="box" id="lf"><a class="logo" href="/"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><h1>Painel da equipe</h1>'+
  '<label>E-mail<input id="le" type="email" required value="paulo@nexioic.com.br" autocomplete="username"></label>'+
  '<label>Senha<input id="lp" type="password" required value="demo" autocomplete="current-password"></label>'+
  '<button class="btn b-blue" type="submit">Entrar</button><p class="help">Protótipo: qualquer senha entra. Na versão final, cada funcionário terá login próprio.</p></form></div>';
  document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();var em=document.getElementById('le').value;var st=db.staff.filter(function(s){return s.email===em;})[0]||{id:'eqx',nome:em.split('@')[0],email:em};S.user=st;try{sessionStorage.setItem('nx_staff',JSON.stringify(st));}catch(x){}render();};
}

/* ---------- LAYOUT ---------- */
function shell(active,html){
  var nav=[['painel','Painel',0],['clientes','Clientes',newDocs()],['processos','Processos',0],['documentos','Documentos',0],['mensagens','Mensagens',unread()],['comunicacoes','Comunicações',0],['agenda','Agenda da equipe',0],['obrigacoes','Obrigações',0]];
  root.innerHTML='<div class="app"><aside class="side"><a class="logo" href="#/painel"><b>NEXIO</b><small>INTELIGÊNCIA CONTÁBIL</small></a><div class="role">Painel da equipe</div>'+NX.sideToggleHTML()+
  nav.map(function(n){return '<a class="nav" href="#/'+n[0]+'"'+(active===n[0]?' aria-current="page"':'')+'>'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>';}).join('')+
  '<div class="foot"><span>'+e(S.user.nome)+'</span><a href="/portal/" target="_blank" rel="noopener">Ver portal do cliente</a><a href="#" id="reset">Restaurar dados de exemplo</a><a href="#" id="logout">Sair</a></div></aside><main class="main">'+html+'</main></div>';
  NX.applySide();
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();S.user=null;try{sessionStorage.removeItem('nx_staff');}catch(x){}render();};
  document.getElementById('reset').onclick=function(ev){ev.preventDefault();if(confirm('Apagar tudo e restaurar os dados de exemplo?')){db=NX.seed();persist();render();NX.toast('Dados de exemplo restaurados.');}};
}
function head(t,sub,right){return '<div class="page-h"><div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="row">'+(right||'')+'<span class="badge-proto">Protótipo</span></div></div>';}

/* ---------- PAINEL ---------- */
function painel(){
  var t=NX.today(),in7=new Date();in7.setDate(in7.getDate()+7);in7=in7.toISOString().slice(0,10);
  var guias=db.files.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';});
  var venc=guias.filter(function(f){return f.venc&&f.venc<t;}), prox=guias.filter(function(f){return f.venc>=t&&f.venc<=in7;});
  var naoVistas=db.files.filter(function(f){return f.de==='equipe'&&!f.visto;}).length;
  var h=head('Olá, '+e(S.user.nome),'Resumo do dia — '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))+
  '<div class="kpis"><a class="kpi main" href="#/clientes"><span>Clientes ativos</span><strong>'+db.clients.length+'</strong></a>'+
  '<a class="kpi" href="#/mensagens"><span>Mensagens não lidas</span><strong>'+unread()+'</strong></a>'+
  '<a class="kpi" href="#/clientes"><span>Documentos novos de clientes</span><strong>'+newDocs()+'</strong></a>'+
  '<div class="kpi"><span>Notas emitidas pelos clientes no mês</span><strong>'+(db.notas||[]).filter(function(n){return n.status==='autorizada'&&n.emissao.slice(0,7)===NX.ym();}).length+'</strong></div>'+
  '<div class="kpi"><span>Guias vencidas sem baixa</span><strong style="color:var(--bad)">'+venc.length+'</strong></div></div>'+
  (function(){ensureProc();var t0=NX.today(),mine=db.tasks.filter(function(t){return t.resp===S.user.id&&t.status!=='ok'&&((t.tipo==='pessoal'?t.data:(t.meta||t.venc))||'9')<=t0;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Minhas tarefas para hoje e atrasadas</h2><a class="btn b-text" href="#/processos" data-ag>Abrir processos</a></div>'+(mine.length?mine.slice(0,6).map(function(t){var c=cli(t.cliente);return '<div class="list-item"><div><b>'+e(t.titulo)+'</b><small>'+(t.tipo==='cliente'?e(c?c.nome:'')+' · vence '+NX.fdate(t.venc):'Tarefa pessoal · '+NX.fdate(t.data))+'</small></div><span class="pill '+stInfo(t.status)[2]+'" style="cursor:default">'+stInfo(t.status)[1]+'</span></div>';}).join(''):'<p class="empty">Nada pendente para hoje.</p>')+'</section>';})()+(function(){ensureAgenda();var hj=db.meetings.filter(function(m){return m.data===NX.today();}).sort(function(x,y){return x.ini<y.ini?-1:1;});return '<section class="card" style="margin-bottom:18px"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Reuniões de hoje</h2><a class="btn b-text" href="#/agenda">Abrir agenda</a></div>'+(hj.length?hj.map(function(m){return '<div class="list-item"><div><b>'+m.ini+'–'+m.fim+' · '+e(m.titulo)+'</b><small>'+m.part.map(function(id){var s=staffBy(id);return s?e(s.nome):'';}).join(', ')+(m.cliente&&cli(m.cliente)?' · Cliente: '+e(cli(m.cliente).nome):'')+'</small></div><span class="tag info">'+e(m.local||'')+'</span></div>';}).join(''):'<p class="empty">Nenhuma reunião hoje.</p>')+'</section>';})()+'<div class="cols"><section class="card"><h2>Guias vencendo em 7 dias</h2>'+(prox.length?prox.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(f.titulo)+'</b><small>'+e(c?c.nome:'')+' · vence '+NX.fdate(f.venc)+'</small></div><strong>'+NX.brl(f.valor)+'</strong></div>';}).join(''):'<p class="empty">Nenhuma guia vencendo nos próximos 7 dias.</p>')+'</section>'+
  '<section class="card"><h2>Pendências</h2>'+
  (venc.map(function(f){var c=cli(f.cliente);return '<div class="list-item"><div><b>'+e(c?c.nome:'')+'</b><small>'+e(f.titulo)+' venceu em '+NX.fdate(f.venc)+' e não foi marcada como paga</small></div><a class="btn b-text" href="#/clientes/'+f.cliente+'">Abrir</a></div>';}).join('')||'')+
  db.clients.filter(function(c){return unread(c.id)||newDocs(c.id);}).map(function(c){return '<div class="list-item"><div><b>'+e(c.nome)+'</b><small>'+(unread(c.id)?unread(c.id)+' mensagem(ns) nova(s) ':'')+(newDocs(c.id)?newDocs(c.id)+' documento(s) enviado(s)':'')+'</small></div><a class="btn b-text" href="#/clientes/'+c.id+'">Abrir</a></div>';}).join('')+
  '<p class="help" style="margin-top:12px">'+naoVistas+' arquivo(s) enviados pela equipe ainda não foram abertos pelos clientes.</p></section></div>';
  shell('painel',h);
}

/* ---------- CLIENTES ---------- */
function clientes(id){
  if(id&&!cli(id))id=null; S.sel=id||S.sel; if(S.sel&&!cli(S.sel))S.sel=null;
  var list='<section class="card" style="flex:1 1 280px;max-width:360px"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Clientes</h2><button class="btn b-blue" id="addc">+ Novo</button></div>'+
  '<label class="sr" for="q">Buscar cliente</label><input id="q" placeholder="Buscar cliente…" style="margin-bottom:10px"><nav class="client-list" id="cl"></nav></section>';
  var det='<section class="card" style="flex:999 1 520px" id="det"></section>';
  shell('clientes',head('Clientes','Envie guias e arquivos, acompanhe obrigações e converse com cada cliente.')+'<div class="cols">'+list+det+'</div>');
  function drawList(q){q=(q||'').toLowerCase();document.getElementById('cl').innerHTML=db.clients.filter(function(c){return !q||(c.nome+c.doc).toLowerCase().indexOf(q)>-1;}).map(function(c){var n=unread(c.id)+newDocs(c.id);return '<a href="#/clientes/'+c.id+'"'+(c.id===S.sel?' aria-current="true"':'')+'><span><b>'+e(c.nome)+'</b><small style="display:block;color:var(--muted);font-size:12px">'+e(c.plano)+'</small></span>'+(n?'<span class="tag info">'+n+' novo(s)</span>':'')+'</a>';}).join('')||'<p class="empty">Nenhum cliente.</p>';}
  drawList();document.getElementById('q').oninput=function(ev){drawList(ev.target.value);};
  document.getElementById('addc').onclick=function(){clientDialog();};
  var el=document.getElementById('det');
  if(!S.sel){el.innerHTML='<p class="empty">Selecione um cliente na lista ou cadastre um novo.</p>';return;}
  var c=cli(S.sel);
  var tabs=[['arquivos','Documentos'],['obrigacoes','Obrigações'],['mensagens','Mensagens'+(unread(c.id)?' ('+unread(c.id)+')':'')],['dados','Dados do cliente']];
  el.innerHTML='<div class="row between" style="margin-bottom:12px"><div><h2 style="margin:0">'+e(c.nome)+'</h2><p class="help">'+e(c.doc)+' · '+e(c.plano)+' · '+e(c.resp)+'</p></div></div>'+
  '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div><div id="tabc"></div>';
  el.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){S.tab=b.getAttribute('data-t');clientes(S.sel);};});
  ({arquivos:tabArquivos,obrigacoes:tabObrig,mensagens:tabMsgs,dados:tabDados})[S.tab](c,document.getElementById('tabc'));
}
/* ---------- DOCUMENTOS (espelhado no Onvio Documentos) ---------- */
var SETORES=['Fiscal','Departamento Pessoal','Contábil','Financeiro','Societário','Certidões','Notas fiscais','Enviados pelo cliente','Administrativo (interno)'];
var RESTRITOS=['Administrativo (interno)'];
function setorOf(f){if(f.setor==='__custom')return 'Enviados pelo cliente';if(f.setor)return f.setor;if(f.tipo==='Nota fiscal')return 'Notas fiscais';if(f.de==='cliente')return 'Enviados pelo cliente';
  if(f.tipo==='Folha de pagamento'||/fgts|inss|folha|e-?social|dctfweb|f[ée]rias|rescis|pr[óo]-?labore/i.test(f.titulo))return 'Departamento Pessoal';
  if(/cnd|certid/i.test(f.titulo))return 'Certidões';if(f.tipo==='Contrato')return 'Societário';if(f.tipo==='Relatório')return 'Contábil';if(f.tipo==='Guia')return 'Fiscal';return 'Contábil';}
function compOf(f){return f.comp||(f.criado||NX.today()).slice(0,7);}
function shared(f){return f.shared!=null?f.shared:RESTRITOS.indexOf(setorOf(f))<0;}
function hist(f,ev){f.hist=f.hist||[];f.hist.push({em:new Date().toISOString(),ev:ev,por:S.user?S.user.nome:''});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var ICO_F='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
var ICO_S='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Compartilhado com o cliente" role="img"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var ICO_L='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A5300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Restrito à equipe" role="img"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
S.dv=S.dv||{vis:'todos',q:''};
function liveFiles(cid){return db.files.filter(function(f){return f.cliente===cid&&!f.deleted;});}
function guessFromName(name){var n=name.replace(/\.[^.]+$/,''),comp=null,m=/(\d{1,2})[\/\-_. ](\d{4})/.exec(n)||/(\d{4})[\/\-_. ](\d{1,2})(?!\d)/.exec(n);
  if(m){var a=m[1].length===4?[m[1],m[2]]:[m[2],m[1]];if(+a[1]>=1&&+a[1]<=12)comp=a[0]+'-'+String(+a[1]).padStart(2,'0');}
  var tipo=/\b(das|darf|gps|fgts|guia|gare|dam|boleto)\b/i.test(n)?'Guia':/balancete|dre|balan[cç]o|raz[aã]o|di[aá]rio/i.test(n)?'Relatório':/contrato|altera[cç][aã]o|alvar[aá]/i.test(n)?'Contrato':/folha|holerite|recibo de pagamento|f[ée]rias|rescis/i.test(n)?'Folha de pagamento':'Documento';
  var f={titulo:n.replace(/[_]+/g,' '),tipo:tipo,comp:comp||NX.ym()};f.setor=setorOf(f);return f;}

/* árvore + lista (usada na aba do cliente e no menu Documentos) */
var FICO='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function folderLevel(files,F,setores){ // devolve {items:[{key,label,n,extra}], level} ou null quando já está no mês
  function pend(l){var p=l.filter(function(f){return f.tipo==='Guia'&&f.status!=='pago';}).length;return p?p+' a pagar':'';}
  if(!F.setor)return setores.map(function(s){var l=files.filter(function(f){return setorOf(f)===s;});return {key:s,label:s,n:l.length,extra:pend(l)};});
  var ls=files.filter(function(f){return setorOf(f)===F.setor;});
  if(!F.ano){var an={};ls.forEach(function(f){an[compOf(f).slice(0,4)]=1;});return Object.keys(an).sort().reverse().map(function(a){var l=ls.filter(function(f){return compOf(f).slice(0,4)===a;});return {key:a,label:a,n:l.length,extra:pend(l)};});}
  if(!F.comp){var out=[];for(var i=12;i>=1;i--){var k=F.ano+'-'+String(i).padStart(2,'0'),l=ls.filter(function(f){return compOf(f)===k;});if(l.length)out.push({key:k,label:MESES[i-1],n:l.length,extra:pend(l)});}return out;}
  return null;}
function folderCards(items){return items.length?'<div class="folders">'+items.map(function(it){return '<button class="fold" data-go="'+e(it.key)+'"><span class="fi">'+FICO+'</span><span><b>'+e(it.label)+'</b><small>'+it.n+' documento(s)'+(it.extra?' · '+it.extra:'')+'</small></span></button>';}).join('')+'</div>':'<p class="empty">Pasta vazia.</p>';}
function crumbsHTML(root,F){var c=[['root',root]];if(F.setor)c.push(['setor',F.setor]);if(F.ano)c.push(['ano',F.ano]);if(F.comp)c.push(['comp',MESES[+F.comp.slice(5)-1]]);
  return '<nav class="crumbs" aria-label="Caminho">'+c.map(function(k,i){return i===c.length-1?'<b>'+e(k[1])+'</b>':'<button data-cr="'+k[0]+'">'+e(k[1])+'</button><span aria-hidden="true">›</span>';}).join('')+'</nav>';}
function folderClick(t,F){if(t.hasAttribute('data-go')){var v=t.getAttribute('data-go');if(!F.setor)F.setor=v;else if(!F.ano)F.ano=v;else F.comp=v;return true;}
  if(t.hasAttribute('data-cr')){var lv=t.getAttribute('data-cr');if(lv==='root')F.setor=F.ano=F.comp=null;else if(lv==='setor')F.ano=F.comp=null;else if(lv==='ano')F.comp=null;return true;}return false;}
var RR=function(){};
function x0(f){return f.tipo==='Guia'&&f.status!=='pago';}
S.xpA=S.xpA||{};
function editDoc(f,after){openDlg('<h2>Editar documento</h2><div class="grid"><label style="grid-column:1/-1">Nome<input name="titulo" value="'+e(f.titulo)+'" required></label><label>Setor<select name="setor">'+SETORES.map(function(s){return '<option'+(s===setorOf(f)?' selected':'')+'>'+s+'</option>';}).join('')+'</select></label><label>Competência<input name="comp" type="month" value="'+compOf(f)+'" required></label><label>Vencimento<input name="venc" type="date" value="'+(f.venc||'')+'"></label><label>Valor (R$)<input name="valor" value="'+(f.valor?String(f.valor).replace('.',','):'')+'" inputmode="decimal"></label></div><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="shared" '+(shared(f)?'checked':'')+' style="width:auto;min-height:auto"> Compartilhar com o cliente (aparece no portal)</label>',
  function(fd){f.titulo=fd.get('titulo');f.setor=fd.get('setor');f.comp=fd.get('comp');f.venc=fd.get('venc');f.valor=parseFloat(String(fd.get('valor')||'').replace(/\./g,'').replace(',','.'))||0;f.shared=!!fd.get('shared');hist(f,'Editado');persist();after();NX.toast('Documento atualizado.');});}
function tabArquivos(c,el,rr){RR=rr||function(){clientes(c.id);};
  if(S.xpA.cli!==c.id)S.xpA={cli:c.id};
  db.files.forEach(function(f){if(f.cliente===c.id&&f.de==='cliente'&&!f.visto&&!f.deleted){f.visto=true;hist(f,'Recebido pela equipe');}});persist();
  var st=S.xpA;
  function openF(f){hist(f,'Aberto pela equipe');persist();
    var acts=[{label:'Baixar',cls:'b-blue',close:false,fn:function(x){hist(x,'Baixado pela equipe');persist();NX.download(x);}},{label:'Editar',fn:function(x){setTimeout(function(){editDoc(x,draw);},0);}}];
    if(x0(f))acts.push({label:'Dar baixa',fn:function(x){x.status='pago';hist(x,'Baixa de pagamento pela equipe');persist();}});
    acts.push({label:'Excluir',cls:'b-danger',fn:function(x){if(!confirm('Mover "'+x.titulo+'" para a lixeira?'))return false;x.deleted=new Date().toISOString();hist(x,'Enviado para a lixeira');persist();NX.toast('Documento movido para a lixeira.');}});
    NX.viewer(f,{db:db,me:'equipe',path:NX.xpPath(f),actions:acts,onClose:function(){draw();},onComment:function(x,t){x.coments=x.coments||[];x.coments.push({em:new Date().toISOString(),de:'equipe',autor:S.user.nome,texto:t});hist(x,'Comentário da equipe');persist();}});}
  function draw(){NX.explorer(el,{db:db,cliente:c.id,role:'equipe',st:st,rootLabel:c.nome,setores:SETORES,restritos:RESTRITOS,setorOf:setorOf,visible:function(f){return !f.deleted;},
    onOpen:openF,
    onNewFolder:function(L,re){if(NX.newFolder(db,c.id,L,S.user.nome)){persist();re();NX.toast('Pasta criada.');}},
    onUpload:function(L){var pl=NX.placeFor(db,L,'Fiscal');fileDialog(c,{setor:pl.setor==='__custom'?null:pl.setor,comp:pl.comp,folder:pl.folder});},
    onMass:function(){massDialog(c);},
    onDropFiles:function(files,L,re){var pl=NX.placeFor(db,L,'Contábil'),n=0;files.forEach(function(file){NX.readFile(file,function(r){var g=guessFromName(r.nome);
      var f={id:NX.uid(),cliente:c.id,setor:pl.setor,folder:pl.folder,tipo:g.tipo,titulo:g.titulo,comp:L.comp?pl.comp:g.comp,venc:'',valor:0,status:g.tipo==='Guia'?'pendente':'disponivel',de:'equipe',por:S.user.nome,nome:r.nome,data:r.data,size:r.size,criado:NX.today(),visto:false};hist(f,'Enviado pela equipe');db.files.push(f);onDocAdded(f);
      if(++n===files.length&&persist()!==false){re();NX.toast(n+' documento(s) enviado(s).');}});});}});}
  RR=function(){draw();};draw();
}
function commentDialog(f,after){

function conflicts(m,ignoreId){var out=[];m.part.forEach(function(sid){meetingsOf(sid,m.data).forEach(function(x){if(x.id!==ignoreId&&mins(x.ini)<mins(m.fim)&&mins(m.ini)<mins(x.fim))out.push(staffBy(sid).nome+' já tem "'+x.titulo+'" ('+x.ini+'–'+x.fim+')');});});return out;}
function freeSlots(ids,date,dur){var out=[],from=8*60,to=18*60;if(date===NX.today()){var n=new Date();from=Math.max(from,Math.ceil((n.getHours()*60+n.getMinutes())/30)*30);}
  for(var s=from;s+dur<=to;s+=30){var ok=ids.every(function(id){return meetingsOf(id,date).every(function(x){return !(mins(x.ini)<s+dur&&s<mins(x.fim));});});if(ok)out.push(hhmm(s));}return out;}

function oblDialog(cid){openDlg('<h2>Nova obrigação'+(cid==='*'?' geral':'')+'</h2><div class="grid"><label style="grid-column:1/-1">Título<input name="titulo" required placeholder="Ex.: DCTFWeb"></label><label>Repetição<select name="rec" id="rec"><option value="1">Mensal</option><option value="0">Data única</option></select></label><label id="ldia">Dia do mês<input name="dia" type="number" min="1" max="28" value="20"></label><label id="ldata" style="display:none">Data<input name="data" type="date"></label><label style="grid-column:1/-1">Descrição<input name="desc"></label></div>',
  function(fd){var rec=fd.get('rec')==='1';if(!rec&&!fd.get('data')){NX.toast('Informe a data.');return false;}db.obligations.push({id:NX.uid(),cliente:cid,titulo:fd.get('titulo'),recorrente:rec,dia:+fd.get('dia')||1,data:fd.get('data'),desc:fd.get('desc')});persist();render();NX.toast('Obrigação cadastrada.');});
  document.getElementById('rec').onchange=function(ev){var r=ev.target.value==='1';document.getElementById('ldia').style.display=r?'':'none';document.getElementById('ldata').style.display=r?'none':'';};}

/* ---------- ROTEADOR ---------- */
function render(){db=NX.load();if(!S.user){login();return;}var r=route();
  if(r[0]==='clientes')clientes(r[1]);else if(r[0]==='mensagens')mensagens();else if(r[0]==='obrigacoes')obrigacoes();else if(r[0]==='agenda')agenda();else if(r[0]==='documentos')documentos();else if(r[0]==='processos')processos();else if(r[0]==='comunicacoes')comunicacoes();else painel();}
window.addEventListener('hashchange',render);
window.NX_onSync=function(){if(!dlg.open&&document.activeElement.tagName!=='INPUT')render();};
render();
})();
</script>
</body>
</html>
